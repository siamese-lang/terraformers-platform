apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraformers-frontend-hosted
  labels:
    app.kubernetes.io/name: terraformers-frontend-hosted
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terraformers-frontend-hosted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraformers-frontend-hosted
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: terraformers-frontend-hosted:replace-with-immutable-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-temp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nginx-temp
          emptyDir:
            sizeLimit: 32Mi
