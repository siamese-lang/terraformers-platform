work_package:
  id: case-c-simplified-terraform-validation-v1
  status: ACTIVE
  approved_base_sha: BIND_AT_ACTIVATION
  execution_base_sha: "5f2ab26ce4d4e303e5966ecaec7c79d32884e4d3"

  goal: >
    Implement the user-approved simplified Terraform draft contract: remove policy-only credential,
    account-identifier and placeholder rejection; remove sensitive-credential regeneration; make
    request-specific schema evidence advisory rather than a generated-resource allowlist; enrich
    prompt schema context from retrieved reference content; retain exact local AWS provider and
    Terraform CLI correctness checks; and fix C2 terminal failure-category selection.

  decision_source:
    - docs/plans/active/case-c-simplified-terraform-validation-decision.md

  representative_case:
    - Case C Cloud Runtime Capacity & Safe Delivery

