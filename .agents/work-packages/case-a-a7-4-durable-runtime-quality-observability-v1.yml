    - second_failure_after_one_bounded_repair
    - failure_class_changes
    - exact_A7_0_official_knowledge_gap_manifest_cannot_be_reproduced_or_verified
    - quality_state_would_need_raw_payload_or_generated_HCL
    - project_decision_applicability_would_need_to_be_guessed
    - retry_lease_claim_or_fencing_change_is_required
    - RAG_serving_or_ingestion_change_is_required
    - new_observability_product_is_required
    - live_or_cost_action_is_requested
    - acceptance_criteria_would_need_to_change

  completion:
    merge_requires_user_approval: true
    A7_5_requires_separate_user_approval: true
    live_action_requires_separate_user_approval: true
    new_observability_product_requires_separate_user_approval: true
