name: M2 Portable Persistent Runtime Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m2-portable-persistent-runtime-verification.yml'
      - 'backend/**'
      - 'infra/kubernetes/base/**'
      - 'infra/kubernetes/overlays/portable-persistent/**'
      - 'scripts/checks/kind-portable-persistent-smoke.sh'

permissions:
  contents: read

jobs:
  portable-persistent-runtime:
    name: Portable persistent runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Kind
        uses: helm/kind-action@v1
        with:
          cluster_name: terraformers-portable-persistent
          wait: 120s

      - name: Verify portable persistent runtime
        run: bash scripts/checks/kind-portable-persistent-smoke.sh

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-portable-persistent-runtime
          path: artifacts/m2-portable-persistent-runtime
