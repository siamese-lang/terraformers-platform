    artifact_category: unclassified

  activation:
    bind_rule: >
      Immediately before the first implementation write, read authoritative GitHub remote main
      exactly once and bind that SHA to execution_base_sha. Do not automatically refresh or rebase.
    stop_on_main_drift: true

