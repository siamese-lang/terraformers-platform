    - failure_class_changes
    - frozen_dataset_change_is_required
    - production_retrieval_generation_or_model_change_is_required
    - runtime_quality_would_need_to_be_used_as_ground_truth
    - live_or_cost_action_is_requested
    - acceptance_criteria_would_need_to_change

  implementation_evidence:
