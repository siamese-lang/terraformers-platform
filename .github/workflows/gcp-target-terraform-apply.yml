name: GCP Target Terraform Apply

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Authenticate only, run read-only verification, create the reviewed GKE foundation or immutable-image delivery foundation, activate or capacity-scale the node pool, or return it to zero.
        required: true
        type: choice
        options:
          - identity-check
          - preflight
          - runtime-check
          - foundation
          - delivery-foundation
          - activate
          - capacity-scale-out
          - capacity-scale-in
          - idle
      expected_sha:
        description: Exact trusted main commit SHA being approved.
        required: true
        type: string
      confirmation:
        description: Use IDENTITY_CHECK, PREFLIGHT_ONLY, RUNTIME_CHECK, APPLY_REVIEWED_GCP_FOUNDATION_12, APPLY_REVIEWED_GCP_DELIVERY_FOUNDATION_5, ACTIVATE_GCP_TARGET_ONE, SCALE_GCP_TARGET_TO_TWO, SCALE_GCP_TARGET_TO_ONE, or SCALE_GCP_TARGET_TO_ZERO as appropriate.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-target-terraform-state
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: gcp-target-plan
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_project_id: terraformers-platform
      TF_VAR_subnet_cidr: 10.40.0.0/20
      TF_VAR_node_count: '1'
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/envs/gcp-target-runtime

    steps:
      - uses: actions/checkout@v5

      - name: Validate preflight request
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PLAN_SERVICE_ACCOUNT: ${{ vars.GCP_TF_PLAN_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]] || exit 1
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'expected_sha must be a full 40-character commit SHA.' >&2
            exit 1
          }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Preflight SHA does not match the checked-out main commit.' >&2
            exit 1
          }

          case "$OPERATION" in
            identity-check)
              [[ "$CONFIRMATION" == IDENTITY_CHECK ]] || exit 1
              ;;
            preflight)
              [[ "$CONFIRMATION" == PREFLIGHT_ONLY ]] || exit 1
              echo 'TF_VAR_enable_delivery_foundation=false' >> "$GITHUB_ENV"
              ;;
            runtime-check)
              [[ "$CONFIRMATION" == RUNTIME_CHECK ]] || exit 1
              ;;
            foundation)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_FOUNDATION_12 ]] || exit 1
              echo 'TF_VAR_enable_delivery_foundation=false' >> "$GITHUB_ENV"
              ;;
            delivery-foundation)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_DELIVERY_FOUNDATION_5 ]] || exit 1
              echo 'TF_VAR_enable_delivery_foundation=true' >> "$GITHUB_ENV"
              ;;
            activate)
              [[ "$CONFIRMATION" == ACTIVATE_GCP_TARGET_ONE ]] || exit 1
              ;;
            capacity-scale-out)
              [[ "$CONFIRMATION" == SCALE_GCP_TARGET_TO_TWO ]] || exit 1
              ;;
            capacity-scale-in)
              [[ "$CONFIRMATION" == SCALE_GCP_TARGET_TO_ONE ]] || exit 1
              ;;
            idle)
              [[ "$CONFIRMATION" == SCALE_GCP_TARGET_TO_ZERO ]] || exit 1
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 1
              ;;
          esac

          if [[ "$OPERATION" == preflight || "$OPERATION" == runtime-check || "$OPERATION" == foundation || "$OPERATION" == delivery-foundation ]]; then
            [[ -n "$STATE_BUCKET" && -n "$WIF_PROVIDER" && -n "$PLAN_SERVICE_ACCOUNT" ]] || {
              echo 'gcp-target-plan environment variables are incomplete.' >&2
              exit 1
            }
            [[ "$PLAN_SERVICE_ACCOUNT" == terraformers-plan@terraformers-platform.iam.gserviceaccount.com ]] || {
              echo 'Foundation preflight must use the dedicated plan identity.' >&2
              exit 1
            }
            [[ "$STATE_BUCKET" == terraformers-platform-tfstate-21647422237 ]] || {
              echo 'Unexpected Terraform state bucket.' >&2
              exit 1
            }
          fi

      - uses: google-github-actions/auth@v3
        if: inputs.operation == 'preflight' || inputs.operation == 'runtime-check' || inputs.operation == 'foundation' || inputs.operation == 'delivery-foundation'
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: inputs.operation == 'preflight' || inputs.operation == 'runtime-check' || inputs.operation == 'foundation' || inputs.operation == 'delivery-foundation'

      - name: Reconfirm plan identity is non-mutating
        if: inputs.operation == 'preflight' || inputs.operation == 'runtime-check' || inputs.operation == 'foundation' || inputs.operation == 'delivery-foundation'
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          response="$(
            curl -fsS -X POST               -H "Authorization: Bearer ${access_token}"               -H 'Content-Type: application/json'               -d '{"permissions":["artifactregistry.repositories.create","artifactregistry.repositories.setIamPolicy","compute.networks.create","compute.subnetworks.create","container.clusters.create","container.clusters.update","iam.serviceAccounts.create","iam.serviceAccounts.actAs","resourcemanager.projects.setIamPolicy","serviceusage.services.enable"]}'               "https://cloudresourcemanager.googleapis.com/v1/projects/terraformers-platform:testIamPermissions"
          )"
          granted="$(jq -r '.permissions // [] | join(",")' <<< "$response")"
          [[ -z "$granted" ]] || {
            echo "Plan identity unexpectedly has target mutation permissions: $granted" >&2
            exit 1
          }

      - name: Capture mutable account evidence
        if: inputs.operation == 'preflight' || inputs.operation == 'foundation'
        run: |
          set -euo pipefail

          gcloud projects describe terraformers-platform --format=json             > "${RUNNER_TEMP}/project.json"

          if gcloud billing projects describe terraformers-platform --quiet --format=json             > "${RUNNER_TEMP}/billing-query.json" 2> "${RUNNER_TEMP}/billing-query.err"; then
            jq '. + {verificationStatus: "verified"}'               "${RUNNER_TEMP}/billing-query.json" > "${RUNNER_TEMP}/billing.json"
          else
            jq -n               --arg projectId terraformers-platform               '{projectId: $projectId, billingEnabled: null, verificationStatus: "unavailable"}'               > "${RUNNER_TEMP}/billing.json"
            echo 'Cloud Billing status query unavailable; billing/credit remain a single manual approval item.'               >> "$GITHUB_STEP_SUMMARY"
          fi

          gcloud compute project-info describe             --project=terraformers-platform             --format=json             > "${RUNNER_TEMP}/global-quota.json"

          gcloud compute regions describe asia-northeast3             --project=terraformers-platform             --format=json             > "${RUNNER_TEMP}/region.json"

          gcloud compute machine-types describe e2-standard-2             --zone=asia-northeast3-a             --project=terraformers-platform             --format=json             > "${RUNNER_TEMP}/machine.json"

          gcloud container get-server-config             --zone=asia-northeast3-a             --project=terraformers-platform             --format=json             > "${RUNNER_TEMP}/gke-server.json"

          gcloud services list             --enabled             --project=terraformers-platform             --format=json             > "${RUNNER_TEMP}/services.json"

          gcloud container clusters list             --project=terraformers-platform             --format=json             > "${RUNNER_TEMP}/clusters.json"

          gcloud compute networks list             --project=terraformers-platform             --format=json             > "${RUNNER_TEMP}/networks.json"

          gcloud compute networks subnets list             --project=terraformers-platform             --regions=asia-northeast3             --format=json             > "${RUNNER_TEMP}/subnets.json"

          gcloud iam service-accounts list             --project=terraformers-platform             --format=json             > "${RUNNER_TEMP}/service-accounts.json"

          gcloud compute instances list             --project=terraformers-platform             --format=json             > "${RUNNER_TEMP}/instances.json"

      - name: Enforce mutable foundation preflight
        if: inputs.operation == 'preflight' || inputs.operation == 'foundation'
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/deploy/gcp_foundation_preflight.py"             --project-json "${RUNNER_TEMP}/project.json"             --billing-json "${RUNNER_TEMP}/billing.json"             --global-quota-json "${RUNNER_TEMP}/global-quota.json"             --region-json "${RUNNER_TEMP}/region.json"             --machine-json "${RUNNER_TEMP}/machine.json"             --gke-server-json "${RUNNER_TEMP}/gke-server.json"             --services-json "${RUNNER_TEMP}/services.json"             --clusters-json "${RUNNER_TEMP}/clusters.json"             --networks-json "${RUNNER_TEMP}/networks.json"             --subnets-json "${RUNNER_TEMP}/subnets.json"             --service-accounts-json "${RUNNER_TEMP}/service-accounts.json"             --instances-json "${RUNNER_TEMP}/instances.json"             --output-json "${RUNNER_TEMP}/gcp-foundation-preflight.json"             --output-md "${RUNNER_TEMP}/gcp-foundation-preflight.md"

          cat "${RUNNER_TEMP}/gcp-foundation-preflight.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Check canonical state bucket protection
        if: inputs.operation == 'preflight' || inputs.operation == 'runtime-check' || inputs.operation == 'foundation' || inputs.operation == 'delivery-foundation'
        env:
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          versioning="$(gcloud storage buckets describe "gs://${STATE_BUCKET}" --format='value(versioning_enabled)')"
          ubla="$(gcloud storage buckets describe "gs://${STATE_BUCKET}" --format='value(uniform_bucket_level_access)')"
          [[ "$versioning" == True ]] || {
            echo 'State bucket object versioning must be enabled.' >&2
            exit 1
          }
          [[ "$ubla" == True ]] || {
            echo 'State bucket uniform bucket-level access must be enabled.' >&2
            exit 1
          }

      - uses: hashicorp/setup-terraform@v3
        if: inputs.operation == 'preflight' || inputs.operation == 'runtime-check' || inputs.operation == 'foundation' || inputs.operation == 'delivery-foundation'
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Verify empty canonical state and corrected foundation plan
        if: inputs.operation == 'preflight' || inputs.operation == 'foundation'
        env:
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail

          terraform init -no-color -reconfigure -input=false             -backend-config="bucket=${STATE_BUCKET}"             -backend-config='prefix=gcp-target-runtime'

          state_error="${RUNNER_TEMP}/terraform-state-list.err"
          if state_list="$(terraform state list 2>"$state_error")"; then
            if [[ -n "$state_list" ]]; then
              echo 'Foundation preflight requires empty canonical runtime state.' >&2
              printf '%s\n' "$state_list" >&2
              exit 1
            fi
          else
            if ! grep -q 'No state file was found' "$state_error"; then
              cat "$state_error" >&2
              exit 1
            fi
          fi

          terraform plan -no-color -input=false -lock-timeout=5m             -out="${RUNNER_TEMP}/gcp-target-preflight.tfplan"

          terraform show -json "${RUNNER_TEMP}/gcp-target-preflight.tfplan"             > "${RUNNER_TEMP}/gcp-target-preflight-plan.json"

          python3 "$GITHUB_WORKSPACE/scripts/deploy/gcp_target_plan_gate.py"             --plan-json "${RUNNER_TEMP}/gcp-target-preflight-plan.json"             --operation foundation

          {
            echo
            echo '### Pre-approval boundary'
            echo
            echo '- Corrected foundation contract: `12 create` only.'
            echo '- Delete/replacement/additional managed resources: `forbidden`.'
            echo '- Raw plan/state are not uploaded.'
            echo '- Remaining Free Trial promotional credit is confirmed by the operator at the single protected foundation approval.'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Verify immutable-image delivery foundation plan
        if: inputs.operation == 'delivery-foundation'
        env:
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail

          terraform init -no-color -reconfigure -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config='prefix=gcp-target-runtime'

          mapfile -t state_addresses < <(terraform state list)
          printf '%s\n' "${state_addresses[@]}" | grep -Fxq 'google_container_cluster.target' || {
            echo 'Delivery foundation requires the canonical GKE cluster in state.' >&2
            exit 1
          }
          printf '%s\n' "${state_addresses[@]}" | grep -Fxq 'google_container_node_pool.target' || {
            echo 'Delivery foundation requires the canonical GKE node pool in state.' >&2
            exit 1
          }

          gcloud iam service-accounts describe \
            terraformers-image-publish@terraformers-platform.iam.gserviceaccount.com \
            --project=terraformers-platform \
            --format='value(email)' >/dev/null || {
              echo 'Dedicated image publisher identity must be bootstrapped before delivery-foundation apply.' >&2
              exit 1
            }

          terraform show -json > "${RUNNER_TEMP}/gcp-target-delivery-state.json"
          current_node_count="$(
            jq -r '
              .values.root_module.resources[]
              | select(.address == "google_container_node_pool.target")
              | .values.node_count
            ' "${RUNNER_TEMP}/gcp-target-delivery-state.json"
          )"
          [[ "$current_node_count" =~ ^[01]$ ]] || {
            echo "Unexpected target node count: $current_node_count" >&2
            exit 1
          }

          terraform plan -no-color -input=false -lock-timeout=5m \
            -var="node_count=${current_node_count}" \
            -var="enable_delivery_foundation=true" \
            -out="${RUNNER_TEMP}/gcp-target-delivery-preflight.tfplan"

          terraform show -json "${RUNNER_TEMP}/gcp-target-delivery-preflight.tfplan" \
            > "${RUNNER_TEMP}/gcp-target-delivery-preflight-plan.json"

          python3 "$GITHUB_WORKSPACE/scripts/deploy/gcp_target_plan_gate.py" \
            --plan-json "${RUNNER_TEMP}/gcp-target-delivery-preflight-plan.json" \
            --operation delivery-foundation

          {
            echo
            echo '### Immutable backend image delivery pre-approval boundary'
            echo
            echo '- Canonical runtime state is reused; no second Terraform root/state is introduced.'
            echo '- Reviewed contract: exactly `5 create` resources.'
            echo '- Artifact Registry API + Docker repository + three repository-scoped IAM members only.'
            echo '- Delete/replacement/update/additional managed resources: `forbidden`.'
            echo '- Publisher service account must already exist, but no image is published here.'
            echo '- Raw plan/state are not uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify existing runtime without mutation
        if: inputs.operation == 'runtime-check'
        env:
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail

          terraform init -no-color -reconfigure -input=false             -backend-config="bucket=${STATE_BUCKET}"             -backend-config='prefix=gcp-target-runtime'

          mapfile -t state_addresses < <(terraform state list)
          managed_state=()
          for address in "${state_addresses[@]}"; do
            [[ "$address" == data.* ]] && continue
            managed_state+=("$address")
          done

          printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_container_cluster.target' || {
            echo 'Runtime check requires the canonical GKE cluster in state.' >&2
            exit 1
          }
          printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_container_node_pool.target' || {
            echo 'Runtime check requires the canonical GKE node pool in state.' >&2
            exit 1
          }

          if printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_artifact_registry_repository.backend[0]'; then
            delivery_enabled=true
          else
            delivery_enabled=false
          fi

          if printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_secret_manager_secret.mariadb_app[0]'; then
            runtime_secret_enabled=true
          else
            runtime_secret_enabled=false
          fi

          if printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_compute_instance.mariadb[0]'; then
            runtime_dependencies_enabled=true
          else
            runtime_dependencies_enabled=false
          fi

          cluster_status="$(
            gcloud container clusters describe terraformers-target               --zone=asia-northeast3-a               --project=terraformers-platform               --format='value(status)'
          )"
          [[ "$cluster_status" == RUNNING ]] || {
            echo "GKE cluster status is $cluster_status, expected RUNNING." >&2
            exit 1
          }

          node_pool_status="$(
            gcloud container node-pools describe terraformers-target-primary               --cluster=terraformers-target               --zone=asia-northeast3-a               --project=terraformers-platform               --format='value(status)'
          )"
          [[ "$node_pool_status" == RUNNING ]] || {
            echo "GKE node pool status is $node_pool_status, expected RUNNING." >&2
            exit 1
          }

          terraform show -json > "${RUNNER_TEMP}/gcp-target-runtime-state.json"
          node_count="$(
            jq -r '
              .values.root_module.resources[]
              | select(.address == "google_container_node_pool.target")
              | .values.node_count
            ' "${RUNNER_TEMP}/gcp-target-runtime-state.json"
          )"
          [[ "$node_count" == 1 ]] || {
            echo "Runtime check expected Terraform node_count=1, got $node_count." >&2
            exit 1
          }

          runtime_image_args=()
          if [[ "$runtime_dependencies_enabled" == true ]]; then
            runtime_image="$(
              jq -r '
                .values.root_module.resources[]
                | select(.address == "google_compute_instance.mariadb[0]")
                | .values.metadata_startup_script
              ' "${RUNNER_TEMP}/gcp-target-runtime-state.json" \
              | sed -n 's/.*MARIADB_IMAGE="\(mariadb:11\.4@sha256:[0-9a-f]\{64\}\)".*/\1/p' \
              | head -n1
            )"
            [[ "$runtime_image" =~ ^mariadb:11\.4@sha256:[0-9a-f]{64}$ ]] || {
              echo 'Could not recover the current immutable MariaDB image from state.' >&2
              exit 1
            }
            runtime_image_args+=("-var=mariadb_image=${runtime_image}")
          fi

          set +e
          terraform plan -no-color -input=false -lock-timeout=5m -detailed-exitcode \
            -var="enable_delivery_foundation=${delivery_enabled}" \
            -var="enable_runtime_secret_foundation=${runtime_secret_enabled}" \
            -var="enable_runtime_dependencies=${runtime_dependencies_enabled}" \
            "${runtime_image_args[@]}" \
            > "${RUNNER_TEMP}/gcp-target-runtime-check-plan.txt"
          plan_rc=$?
          set -e
          [[ "$plan_rc" -eq 0 ]] || {
            cat "${RUNNER_TEMP}/gcp-target-runtime-check-plan.txt" >&2
            echo "Runtime check expected zero Terraform drift, plan exit code=$plan_rc." >&2
            exit 1
          }

          {
            echo '## GCP target runtime check'
            echo
            printf -- '- Immutable image delivery foundation enabled: `%s`\n' "$delivery_enabled"
            printf -- '- Runtime secret foundation enabled: `%s`\n' "$runtime_secret_enabled"
            printf -- '- Runtime dependencies enabled: `%s`\n' "$runtime_dependencies_enabled"
            printf -- '- Cluster status: `%s`\n' "$cluster_status"
            printf -- '- Node pool status: `%s`\n' "$node_pool_status"
            printf -- '- Terraform node count: `%s`\n' "$node_count"
            echo '- Terraform drift: `none`'
            echo '- No resource mutation was attempted.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation != 'preflight' &&
      inputs.operation != 'runtime-check' &&
      needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 60
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_project_id: terraformers-platform
      TF_VAR_subnet_cidr: 10.40.0.0/20
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/envs/gcp-target-runtime

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted apply request
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          APPLY_SERVICE_ACCOUNT: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]] || exit 1
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'expected_sha must be a full 40-character commit SHA.' >&2
            exit 1
          }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Approved SHA does not match the checked-out main commit.' >&2
            exit 1
          }
          [[ -n "$WIF_PROVIDER" && -n "$APPLY_SERVICE_ACCOUNT" ]] || {
            echo 'Configure GCP_WIF_PROVIDER and GCP_TF_APPLY_SERVICE_ACCOUNT in gcp-target-apply.' >&2
            exit 1
          }
          [[ "$WIF_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]] || exit 1
          [[ "$APPLY_SERVICE_ACCOUNT" == terraformers-apply@terraformers-platform.iam.gserviceaccount.com ]] || {
            echo 'The apply workflow only accepts the dedicated terraformers-apply identity.' >&2
            exit 1
          }

          case "$OPERATION" in
            identity-check)
              [[ "$CONFIRMATION" == IDENTITY_CHECK ]] || {
                echo 'identity-check requires confirmation IDENTITY_CHECK.' >&2
                exit 1
              }
              ;;
            foundation)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_FOUNDATION_12 ]] || {
                echo 'foundation requires confirmation APPLY_REVIEWED_GCP_FOUNDATION_12.' >&2
                exit 1
              }
              [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{2,62}$ ]] || exit 1
              [[ "$STATE_BUCKET" != *..* ]] || exit 1
              echo 'TF_VAR_node_count=1' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_delivery_foundation=false' >> "$GITHUB_ENV"
              ;;
            delivery-foundation)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_DELIVERY_FOUNDATION_5 ]] || {
                echo 'delivery-foundation requires confirmation APPLY_REVIEWED_GCP_DELIVERY_FOUNDATION_5.' >&2
                exit 1
              }
              [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{2,62}$ ]] || exit 1
              [[ "$STATE_BUCKET" != *..* ]] || exit 1
              echo 'TF_VAR_enable_delivery_foundation=true' >> "$GITHUB_ENV"
              ;;
            activate)
              [[ "$CONFIRMATION" == ACTIVATE_GCP_TARGET_ONE ]] || {
                echo 'activate requires confirmation ACTIVATE_GCP_TARGET_ONE.' >&2
                exit 1
              }
              [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{2,62}$ ]] || exit 1
              [[ "$STATE_BUCKET" != *..* ]] || exit 1
              echo 'TF_VAR_node_count=1' >> "$GITHUB_ENV"
              ;;
            capacity-scale-out)
              [[ "$CONFIRMATION" == SCALE_GCP_TARGET_TO_TWO ]] || {
                echo 'capacity-scale-out requires confirmation SCALE_GCP_TARGET_TO_TWO.' >&2
                exit 1
              }
              [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{2,62}$ ]] || exit 1
              [[ "$STATE_BUCKET" != *..* ]] || exit 1
              echo 'TF_VAR_node_count=2' >> "$GITHUB_ENV"
              ;;
            capacity-scale-in)
              [[ "$CONFIRMATION" == SCALE_GCP_TARGET_TO_ONE ]] || {
                echo 'capacity-scale-in requires confirmation SCALE_GCP_TARGET_TO_ONE.' >&2
                exit 1
              }
              [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{2,62}$ ]] || exit 1
              [[ "$STATE_BUCKET" != *..* ]] || exit 1
              echo 'TF_VAR_node_count=1' >> "$GITHUB_ENV"
              ;;
            idle)
              [[ "$CONFIRMATION" == SCALE_GCP_TARGET_TO_ZERO ]] || {
                echo 'idle requires confirmation SCALE_GCP_TARGET_TO_ZERO.' >&2
                exit 1
              }
              [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{2,62}$ ]] || exit 1
              [[ "$STATE_BUCKET" != *..* ]] || exit 1
              echo 'TF_VAR_node_count=0' >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 1
              ;;
          esac

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify apply identity
        run: |
          set -euo pipefail
          gcloud auth print-access-token > /dev/null
          echo 'Dedicated GCP apply identity authenticated through GitHub OIDC.' >> "$GITHUB_STEP_SUMMARY"

      - name: Stop after identity check
        if: inputs.operation == 'identity-check'
        run: |
          echo 'Identity check only; no state or target resource operation was attempted.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check canonical state bucket protection
        if: inputs.operation != 'identity-check'
        env:
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          versioning="$(gcloud storage buckets describe "gs://${STATE_BUCKET}" --format='value(versioning_enabled)')"
          ubla="$(gcloud storage buckets describe "gs://${STATE_BUCKET}" --format='value(uniform_bucket_level_access)')"
          [[ "$versioning" == True ]] || {
            echo 'State bucket object versioning must be enabled.' >&2
            exit 1
          }
          [[ "$ubla" == True ]] || {
            echo 'State bucket uniform bucket-level access must be enabled.' >&2
            exit 1
          }

      - uses: hashicorp/setup-terraform@v3
        if: inputs.operation != 'identity-check'
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize canonical remote state
        if: inputs.operation != 'identity-check'
        env:
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform init -no-color -reconfigure -input=false             -backend-config="bucket=${STATE_BUCKET}"             -backend-config='prefix=gcp-target-runtime'

      - name: Check operation state boundary
        if: inputs.operation != 'identity-check'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          mapfile -t managed_state < <(terraform state list)

          if [[ "$OPERATION" == foundation ]]; then
            if (( ${#managed_state[@]} != 0 )); then
              printf 'Foundation apply requires empty canonical runtime state; found:\n' >&2
              printf '  %s\n' "${managed_state[@]}" >&2
              exit 1
            fi

            for existing in               "$(gcloud container clusters list --project=terraformers-platform --filter='name=terraformers-target' --format='value(name)')"               "$(gcloud compute networks list --project=terraformers-platform --filter='name=terraformers-target' --format='value(name)')"               "$(gcloud compute networks subnets list --project=terraformers-platform --regions=asia-northeast3 --filter='name=terraformers-target' --format='value(name)')"               "$(gcloud iam service-accounts list --project=terraformers-platform --filter='email:terraformers-gke-nodes@terraformers-platform.iam.gserviceaccount.com' --format='value(email)')"
            do
              [[ -z "$existing" ]] || {
                echo "Unmanaged target resource already exists: $existing" >&2
                exit 1
              }
            done
          elif [[ "$OPERATION" == delivery-foundation ]]; then
            printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_container_cluster.target' || {
              echo 'Delivery foundation apply requires the canonical GKE cluster in state.' >&2
              exit 1
            }
            printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_container_node_pool.target' || {
              echo 'Delivery foundation apply requires the canonical GKE node pool in state.' >&2
              exit 1
            }
            gcloud iam service-accounts describe \
              terraformers-image-publish@terraformers-platform.iam.gserviceaccount.com \
              --project=terraformers-platform \
              --format='value(email)' >/dev/null || {
                echo 'Dedicated image publisher identity must be bootstrapped before delivery-foundation apply.' >&2
                exit 1
              }

            terraform show -json > "${RUNNER_TEMP}/gcp-target-delivery-state.json"
            current_node_count="$(
              jq -r '
                .values.root_module.resources[]
                | select(.address == "google_container_node_pool.target")
                | .values.node_count
              ' "${RUNNER_TEMP}/gcp-target-delivery-state.json"
            )"
            [[ "$current_node_count" =~ ^[01]$ ]] || {
              echo "Unexpected target node count: $current_node_count" >&2
              exit 1
            }
            echo "TF_VAR_node_count=$current_node_count" >> "$GITHUB_ENV"
          else
            printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_container_cluster.target' || {
              echo 'Runtime scale operation requires the canonical GKE cluster in remote state.' >&2
              exit 1
            }
            printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_container_node_pool.target' || {
              echo 'Runtime scale operation requires the canonical node pool in remote state.' >&2
              exit 1
            }

            if printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_artifact_registry_repository.backend[0]'; then
              echo 'TF_VAR_enable_delivery_foundation=true' >> "$GITHUB_ENV"
            else
              echo 'TF_VAR_enable_delivery_foundation=false' >> "$GITHUB_ENV"
            fi

            if printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_secret_manager_secret.mariadb_app[0]'; then
              echo 'TF_VAR_enable_runtime_secret_foundation=true' >> "$GITHUB_ENV"
            else
              echo 'TF_VAR_enable_runtime_secret_foundation=false' >> "$GITHUB_ENV"
            fi

            if printf '%s\n' "${managed_state[@]}" | grep -Fxq 'google_compute_instance.mariadb[0]'; then
              echo 'TF_VAR_enable_runtime_dependencies=true' >> "$GITHUB_ENV"
              terraform show -json > "${RUNNER_TEMP}/gcp-target-preserve-runtime-state.json"
              runtime_image="$(
                jq -r '
                  .values.root_module.resources[]
                  | select(.address == "google_compute_instance.mariadb[0]")
                  | .values.metadata_startup_script
                ' "${RUNNER_TEMP}/gcp-target-preserve-runtime-state.json" \
                | sed -n 's/.*MARIADB_IMAGE="\(mariadb:11\.4@sha256:[0-9a-f]\{64\}\)".*/\1/p' \
                | head -n1
              )"
              [[ "$runtime_image" =~ ^mariadb:11\.4@sha256:[0-9a-f]{64}$ ]] || {
                echo 'Could not recover immutable MariaDB image while preserving runtime dependencies.' >&2
                exit 1
              }
              echo "TF_VAR_mariadb_image=$runtime_image" >> "$GITHUB_ENV"
            else
              echo 'TF_VAR_enable_runtime_dependencies=false' >> "$GITHUB_ENV"
            fi
          fi

      - name: Create saved plan
        if: inputs.operation != 'identity-check'
        run: |
          set -euo pipefail
          terraform plan -no-color -input=false -lock-timeout=5m             -out="${RUNNER_TEMP}/gcp-target.tfplan"
          terraform show -json "${RUNNER_TEMP}/gcp-target.tfplan"             > "${RUNNER_TEMP}/gcp-target-plan.json"

      - name: Enforce reviewed plan contract
        if: inputs.operation != 'identity-check'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/deploy/gcp_target_plan_gate.py"             --plan-json "${RUNNER_TEMP}/gcp-target-plan.json"             --operation "$OPERATION"
          printf '%s  %s\n'             "$(sha256sum "${RUNNER_TEMP}/gcp-target.tfplan" | awk '{print $1}')"             'saved Terraform plan' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply exact saved plan
        if: inputs.operation != 'identity-check'
        run: |
          set -euo pipefail
          terraform apply -no-color -input=false "${RUNNER_TEMP}/gcp-target.tfplan"

      - name: Verify resulting runtime boundary
        if: inputs.operation != 'identity-check'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail

          cluster_status="$(
            gcloud container clusters describe terraformers-target               --zone=asia-northeast3-a               --project=terraformers-platform               --format='value(status)'
          )"
          [[ "$cluster_status" == RUNNING ]] || {
            echo "GKE cluster status is $cluster_status, expected RUNNING." >&2
            exit 1
          }

          node_pool_status="$(
            gcloud container node-pools describe terraformers-target-primary               --cluster=terraformers-target               --zone=asia-northeast3-a               --project=terraformers-platform               --format='value(status)'
          )"
          [[ "$node_pool_status" == RUNNING ]] || {
            echo "GKE node pool status is $node_pool_status, expected RUNNING." >&2
            exit 1
          }

          terraform show -json > "${RUNNER_TEMP}/gcp-target-runtime-state.json"
          node_count="$(
            jq -r '
              .values.root_module.resources[]
              | select(.address == "google_container_node_pool.target")
              | .values.node_count
            ' "${RUNNER_TEMP}/gcp-target-runtime-state.json"
          )"

          if [[ "$OPERATION" == foundation || "$OPERATION" == activate || "$OPERATION" == capacity-scale-in ]]; then
            expected_nodes=1
          elif [[ "$OPERATION" == capacity-scale-out ]]; then
            expected_nodes=2
          elif [[ "$OPERATION" == delivery-foundation ]]; then
            expected_nodes="${TF_VAR_node_count}"
          else
            expected_nodes=0
          fi

          [[ "$node_count" == "$expected_nodes" ]] || {
            echo "Expected Terraform node_count=$expected_nodes, got $node_count." >&2
            exit 1
          }

          if [[ "$OPERATION" == delivery-foundation ]]; then
            repository_format="$(
              gcloud artifacts repositories describe terraformers-backend \
                --project=terraformers-platform \
                --location=asia-northeast3 \
                --format='value(format)'
            )"
            [[ "$repository_format" == DOCKER ]] || {
              echo "Artifact Registry format is $repository_format, expected DOCKER." >&2
              exit 1
            }
          fi

          {
            echo '## GCP target apply result'
            echo
            printf -- '- Operation: `%s`\n' "$OPERATION"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Cluster status: `%s`\n' "$cluster_status"
            printf -- '- Node pool status: `%s`\n' "$node_pool_status"
            printf -- '- Terraform node count: `%s`\n' "$node_count"
            echo '- Raw Terraform plan/state were not uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"
