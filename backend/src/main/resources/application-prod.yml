spring:
  application:
    name: terraformers-backend-modernization
  autoconfigure:
    exclude: []
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MariaDBDialect
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  cloudwatch:
    metrics:
      export:
        enabled: true
        namespace: Terraformers/Backend
        step: 1m
  endpoint:
    health:
      probes:
        enabled: true

terraformers:
  runtime:
    required-env:
      - SPRING_DATASOURCE_URL
      - SPRING_DATASOURCE_USERNAME
      - SPRING_DATASOURCE_PASSWORD
      - JWT_ISSUER_URI
      - JWT_JWK_SET_URI
      - UPLOAD_SOURCE_BUCKET
  security:
    jwt:
      enabled: true
      provider: ${JWT_PROVIDER:cognito}
      issuer-uri: ${JWT_ISSUER_URI}
      jwk-set-uri: ${JWT_JWK_SET_URI}
  upload:
    source-bucket: ${UPLOAD_SOURCE_BUCKET}
    source-prefix: browser-uploads
  storage:
    reader-provider: ${OBJECT_READER_PROVIDER:disabled}
    writer-provider: ${OBJECT_WRITER_PROVIDER:metadata-only}
  analysis:
    mode: integrated-java
    provider: ${ANALYSIS_PROVIDER:stub}
    embedding-provider: ${EMBEDDING_PROVIDER:disabled}
    progress-publisher: ${PROGRESS_PUBLISHER:logging}
    retrieval-mode: ${RETRIEVAL_MODE:DISABLED}
    opensearch-endpoint: ${OPENSEARCH_ENDPOINT:}
    opensearch-top-k: ${OPENSEARCH_TOP_K:3}
    index-name: ${INDEX_NAME:}
    vector-field-name: ${VECTOR_FIELD_NAME:}
    content-field-name: ${CONTENT_FIELD_NAME:}
    corpus-version: ${CORPUS_VERSION:terraformers-reference-v1}
    provider-version: ${PROVIDER_VERSION:5.100.0}
    expected-vector-dimension: ${EXPECTED_VECTOR_DIMENSION:}
    result-bucket-name: ${ANALYSIS_RESULT_BUCKET_NAME:${UPLOAD_SOURCE_BUCKET}}
    result-key-prefix: ${ANALYSIS_RESULT_KEY_PREFIX:analysis-results}

info:
  build:
    source-revision: ${BUILD_SOURCE_REVISION:unknown}
