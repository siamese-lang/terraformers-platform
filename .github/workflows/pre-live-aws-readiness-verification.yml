name: Pre-Live AWS Readiness Verification

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  pre-live-aws-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify deployment-ready static contract
        run: python3 scripts/checks/pre-live-aws-readiness-verification.py

      - name: Verify downstream tfvars generation
        run: python3 scripts/checks/live-stage-tfvars-builder-verification.py

      - name: Upload pre-live readiness evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-live-aws-readiness-evidence
          path: |
            artifacts/pre-live-aws-readiness
            artifacts/live-stage-tfvars-builder-verification/verification-summary.txt
          if-no-files-found: error
