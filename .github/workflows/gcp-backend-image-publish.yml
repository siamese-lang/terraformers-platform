name: GCP Backend Image Publish

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact trusted main commit SHA to build and publish.
        required: true
        type: string
      image_kind:
        description: Publish the existing backend image or the hosted frontend image.
        required: false
        default: backend
        type: choice
        options:
          - backend
          - frontend
      confirmation:
        description: Enter PUBLISH_REVIEWED_BACKEND_IMAGE or PUBLISH_REVIEWED_FRONTEND_IMAGE.
        required: true
        type: string
      firebase_api_key:
        description: Public Firebase web API key (frontend only).
        required: false
        type: string
      firebase_auth_domain:
        description: Public Firebase authorized auth domain (frontend only).
        required: false
        type: string
      firebase_project_id:
        description: Public Firebase project ID (frontend only).
        required: false
        type: string
      firebase_app_id:
        description: Public Firebase web app ID (frontend only).
        required: false
        type: string
      hosted_hostname:
        description: Owned public hostname for the hosted frontend (frontend only).
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-backend-image-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: gcp-image-publish
    timeout-minutes: 45
    env:
      GCP_PROJECT: terraformers-platform
      GCP_LOCATION: asia-northeast3

    steps:
      - uses: actions/checkout@v5

      - name: Validate immutable publication request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          IMAGE_KIND: ${{ inputs.image_kind || 'backend' }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
          FIREBASE_AUTH_DOMAIN: ${{ inputs.firebase_auth_domain }}
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
          FIREBASE_APP_ID: ${{ inputs.firebase_app_id }}
          HOSTED_HOSTNAME: ${{ inputs.hosted_hostname }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PUBLISH_SERVICE_ACCOUNT: ${{ vars.GCP_IMAGE_PUBLISH_SERVICE_ACCOUNT }}
          REGISTRY_HOST: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
          REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]] || exit 1
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'expected_sha must be a full 40-character commit SHA.' >&2
            exit 1
          }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Approved source SHA does not match checked-out main.' >&2
            exit 1
          }
          case "$IMAGE_KIND" in
            backend)
              [[ "$CONFIRMATION" == PUBLISH_REVIEWED_BACKEND_IMAGE ]] || {
                echo 'Backend confirmation must be PUBLISH_REVIEWED_BACKEND_IMAGE.' >&2
                exit 1
              }
              [[ -z "$FIREBASE_API_KEY$FIREBASE_AUTH_DOMAIN$FIREBASE_PROJECT_ID$FIREBASE_APP_ID$HOSTED_HOSTNAME" ]] || {
                echo 'Frontend build inputs are not accepted for backend publication.' >&2
                exit 1
              }
              echo 'IMAGE_NAME=terraformers-backend' >> "$GITHUB_ENV"
              ;;
            frontend)
              [[ "$CONFIRMATION" == PUBLISH_REVIEWED_FRONTEND_IMAGE ]] || {
                echo 'Frontend confirmation must be PUBLISH_REVIEWED_FRONTEND_IMAGE.' >&2
                exit 1
              }
              [[ "$FIREBASE_API_KEY" =~ ^[A-Za-z0-9_-]{20,128}$ ]] || {
                echo 'A public Firebase web API key is required.' >&2
                exit 1
              }
              [[ "$FIREBASE_AUTH_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$ ]] || {
                echo 'A valid Firebase auth domain is required.' >&2
                exit 1
              }
              [[ "$FIREBASE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,29}$ ]] || {
                echo 'A valid Firebase project ID is required.' >&2
                exit 1
              }
              [[ "$FIREBASE_APP_ID" =~ ^[A-Za-z0-9:_-]{6,128}$ ]] || {
                echo 'A public Firebase web app ID is required.' >&2
                exit 1
              }
              [[ "$HOSTED_HOSTNAME" =~ ^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$ ]] || {
                echo 'A valid owned hostname is required.' >&2
                exit 1
              }
              case "$HOSTED_HOSTNAME" in
                *.invalid|*.test|*.example|*.localhost) echo 'A placeholder hostname is not allowed.' >&2; exit 1 ;;
              esac
              config_sha="$(printf 'REACT_APP_FIREBASE_API_KEY=%s\nREACT_APP_FIREBASE_AUTH_DOMAIN=%s\nREACT_APP_FIREBASE_PROJECT_ID=%s\nREACT_APP_FIREBASE_APP_ID=%s\nHOSTED_HOSTNAME=%s\n' \
                "$FIREBASE_API_KEY" "$FIREBASE_AUTH_DOMAIN" "$FIREBASE_PROJECT_ID" "$FIREBASE_APP_ID" "$HOSTED_HOSTNAME" | sha256sum | cut -d' ' -f1)"
              [[ "$config_sha" =~ ^[0-9a-f]{64}$ ]]
              echo 'IMAGE_NAME=terraformers-frontend' >> "$GITHUB_ENV"
              echo "FRONTEND_CONFIG_SHA=$config_sha" >> "$GITHUB_ENV"
              ;;
            *) echo 'image_kind must be backend or frontend.' >&2; exit 1 ;;
          esac
          [[ "$WIF_PROVIDER" == projects/21647422237/locations/global/workloadIdentityPools/terraformers-github/providers/terraformers-main ]]
          [[ "$PUBLISH_SERVICE_ACCOUNT" == terraformers-image-publish@terraformers-platform.iam.gserviceaccount.com ]]
          [[ "$REGISTRY_HOST" == asia-northeast3-docker.pkg.dev ]]
          [[ "$REGISTRY_REPOSITORY" == terraformers-backend ]]

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify publisher boundary and repository
        env:
          REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          set -euo pipefail
          gcloud auth print-access-token >/dev/null

          access_token="$(gcloud auth print-access-token)"
          response="$(
            curl -fsS -X POST \
              -H "Authorization: Bearer ${access_token}" \
              -H 'Content-Type: application/json' \
              -d '{"permissions":["artifactregistry.repositories.create","compute.instances.create","container.clusters.update","resourcemanager.projects.setIamPolicy"]}' \
              "https://cloudresourcemanager.googleapis.com/v1/projects/terraformers-platform:testIamPermissions"
          )"
          granted="$(jq -r '.permissions // [] | join(",")' <<<"$response")"
          [[ -z "$granted" ]] || {
            echo "Publisher unexpectedly has project mutation permissions: $granted" >&2
            exit 1
          }

          format="$(
            gcloud artifacts repositories describe "$REGISTRY_REPOSITORY" \
              --project="$GCP_PROJECT" \
              --location="$GCP_LOCATION" \
              --format='value(format)'
          )"
          [[ "$format" == DOCKER ]] || {
            echo "Expected Docker repository, got: $format" >&2
            exit 1
          }

      - name: Authenticate Docker to Artifact Registry
        env:
          REGISTRY_HOST: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Build and publish immutable image once
        env:
          REGISTRY_HOST: ${{ vars.GCP_ARTIFACT_REGISTRY_HOST }}
          REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
          IMAGE_KIND: ${{ inputs.image_kind || 'backend' }}
          FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
          FIREBASE_AUTH_DOMAIN: ${{ inputs.firebase_auth_domain }}
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
          FIREBASE_APP_ID: ${{ inputs.firebase_app_id }}
          HOSTED_HOSTNAME: ${{ inputs.hosted_hostname }}
        run: |
          set -euo pipefail

          image_base="${REGISTRY_HOST}/${GCP_PROJECT}/${REGISTRY_REPOSITORY}/${IMAGE_NAME}"
          if [[ "$IMAGE_KIND" == frontend ]]; then
            image_tag="${image_base}:${GITHUB_SHA}-f${FRONTEND_CONFIG_SHA}"
          else
            image_tag="${image_base}:${GITHUB_SHA}"
          fi

          reject_existing_tag() {
            local response
            if response="$(gcloud artifacts docker images describe "$image_tag" \
                --project="$GCP_PROJECT" \
                --format='value(image_summary.digest)' 2>&1)"; then
              echo "Immutable source/config tag already exists and will not be moved: $image_tag" >&2
              exit 1
            fi
            [[ "$response" == *NOT_FOUND* || "$response" == *NOT_FOUND:* ]] || {
              echo 'Cannot prove image tag is absent; refusing publication.' >&2
              exit 1
            }
          }
          reject_existing_tag

          if [[ "$IMAGE_KIND" == frontend ]]; then
            docker build \
              --file frontend/Dockerfile.hosted \
              --build-arg "REACT_APP_FIREBASE_API_KEY=$FIREBASE_API_KEY" \
              --build-arg "REACT_APP_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN" \
              --build-arg "REACT_APP_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
              --build-arg "REACT_APP_FIREBASE_APP_ID=$FIREBASE_APP_ID" \
              --build-arg "HOSTED_HOSTNAME=$HOSTED_HOSTNAME" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "com.terraformers.frontend.config-sha256=$FRONTEND_CONFIG_SHA" \
              --tag "$image_tag" \
              frontend
            [[ "$(docker image inspect "$image_tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$GITHUB_SHA" ]]
            [[ "$(docker image inspect "$image_tag" --format '{{ index .Config.Labels "com.terraformers.frontend.config-sha256" }}')" == "$FRONTEND_CONFIG_SHA" ]]
          else
            docker build \
              --build-arg "BUILD_SOURCE_REVISION=${GITHUB_SHA}" \
              --tag "$image_tag" \
              backend

            docker image inspect "$image_tag" \
              --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -Fx "BUILD_SOURCE_REVISION=${GITHUB_SHA}"
          fi

          reject_existing_tag
          docker push "$image_tag"

          digest="$(
            gcloud artifacts docker images describe "$image_tag" \
              --project="$GCP_PROJECT" \
              --format='value(image_summary.digest)'
          )"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid remote image digest: $digest" >&2
            exit 1
          }

          immutable_ref="${image_base}@${digest}"
          remote_digest="$(
            gcloud artifacts docker images describe "$immutable_ref" \
              --project="$GCP_PROJECT" \
              --format='value(image_summary.digest)'
          )"
          [[ "$remote_digest" == "$digest" ]] || {
            echo 'Digest verification mismatch after publication.' >&2
            exit 1
          }
          docker image inspect "$image_tag" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -Fx "$immutable_ref" || {
              echo 'Remote digest does not match the locally built image.' >&2
              exit 1
            }

          {
            printf '## Immutable %s image publication\n' "$IMAGE_KIND"
            echo
            printf -- '- Source SHA: `%s`\n' "$GITHUB_SHA"
            if [[ "$IMAGE_KIND" == frontend ]]; then
              printf -- '- Public build-configuration SHA-256: `%s`\n' "$FRONTEND_CONFIG_SHA"
            fi
            printf -- '- Source tag: `%s`\n' "$image_tag"
            printf -- '- Resolved digest: `%s`\n' "$digest"
            printf -- '- Immutable deployment reference: `%s`\n' "$immutable_ref"
            echo '- Mutable `latest` tag: not published'
            echo '- Kubernetes/Terraform mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"
