  acceptance_criteria:
    - policy_only_sensitive_literal_rejection_removed
    - account_ID_and_account_scoped_ARN_policy_rejection_removed
    - placeholder_TODO_example_word_policy_rejection_removed
    - sensitive_credential_regeneration_removed
    - truncation_is_the_only_generation_retry_path
    - generation_provider_call_budget_remains_at_most_two
    - retrieved_reference_content_resource_blocks_can_enrich_prompt_schema_context
    - request_schema_context_is_not_a_generated_resource_allowlist
    - generated_AWS_resource_must_exist_in_exact_local_provider_catalog
    - nonexistent_or_non_AWS_generated_resource_still_fails
    - Terraform_module_scope_remains_unchanged_and_unsupported
    - Terraform_init_and_validate_remain_final_executable_checks
    - C2_parser_uses_terminal_failure_category_not_earlier_informational_category
    - C2_five_of_five_acceptance_is_unchanged
    - no_new_workflow_or_standalone_verifier

  validation:
    required:
      - targeted_backend_tests
      - full_backend_local_verification
      - existing_automatic_workflow_policy
      - python3_scripts_checks_case_c_architecture_ledger_py_check
      - git_diff_check

  auto_repair_limit: 1

  stop_on:
    - current_main_differs_from_bound_execution_base
    - second_failure_after_one_bounded_repair
    - failure_class_changes
    - allowed_path_outside_scope_is_required
    - provider_or_Terraform_version_change_becomes_required
    - module_or_non_AWS_provider_support_becomes_required
    - retrieval_algorithm_or_corpus_change_becomes_required
    - C2_acceptance_would_need_to_change
    - live_or_cost_action_is_requested_without_user_checkpoint
    - acceptance_criteria_would_need_to_change

  completion:
    merge_requires_user_approval: true
    live_action_authorized: false
    later_image_publish_rollout_and_C2_rerun_require_separate_user_approval: true
    next_work_package_requires_user_approval: true
