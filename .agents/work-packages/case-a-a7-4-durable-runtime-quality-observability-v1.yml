    - evidence_quality_v1_is_reused_not_reimplemented_as_a_parallel_quality_model
    - successful_architecture_job_persists_versioned_technical_knowledge_quality_project_decision_boundary_and_reasons
    - failed_terminal_job_persists_technical_FAIL_without_replaying_provider_calls
    - input_rejection_persists_technical_PASS_and_quality_NOT_APPLICABLE_without_Terraform
    - retry_reschedule_does_not_persist_terminal_quality
    - stale_generation_cannot_mutate_quality_state
    - pre_A7_4_rows_remain_unavailable_without_backfill_guessing
    - official_knowledge_availability_is_not_derived_from_selected_retrieval_hits
    - official_knowledge_gap_and_missing_selected_evidence_remain_distinguishable
    - project_decision_applicability_is_UNKNOWN_unless_deterministic
    - successful_job_can_be_DEGRADED_or_UNKNOWN_without_being_marked_technical_FAIL
    - existing_GET_analysis_job_API_exposes_nullable_bounded_quality_snapshot
    - API_addition_is_backward_compatible
    - terminal_quality_state_survives_repository_context_or_backend_restart_readback
    - quality_metrics_have_only_low_cardinality_enum_labels
    - job_identity_remains_in_MDC_or_persisted_state_not_metric_labels
    - no_raw_prompt_image_provider_payload_generated_HCL_or_unbounded_diagnostic_is_persisted_or_exported
    - timeout_retry_rate_limit_and_ownership_semantics_are_unchanged
    - no_v4_embedding_ingestion_or_live_provider_GCP_action_occurs
    - no_Langfuse_OpenTelemetry_or_new_observability_product_is_added
    - existing_backend_and_MariaDB_schema_validation_remain_green

  allowed_paths:
    - .agents/work-packages/case-a-a7-4-durable-runtime-quality-observability-v1.yml
    - .agents/work-packages/case-a-semantic-reliability-v1.yml
    - docs/AI_PROJECT_STATE.md
    - docs/plans/active/case-a-semantic-reliability-extension.md
    - docs/evaluation/case-a-a7-4-durable-runtime-quality-observability.md
