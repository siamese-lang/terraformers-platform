name: GCP Target Runtime Dependencies

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Apply one separately approved Case C runtime dependency, backend deployment, or live-acceptance checkpoint.
        required: true
        type: choice
        options:
          - runtime-secret-foundation
          - runtime-dependencies
          - runtime-host-firewall-repair
          - kubernetes-prerequisites
          - backend-deployment
          - backend-revision-rollout
          - backend-replacement-durability
          - backend-live-validation
          - backend-live-validation-c2-stability
          - a7-7-broad-v4-live-proof
          - capacity-baseline
          - runtime-live-acceptance
      expected_sha:
        description: Exact trusted main commit SHA being approved.
        required: true
        type: string
      confirmation:
        description: Exact confirmation token for the selected operation.
        required: true
        type: string
      mariadb_image:
        description: Exact mariadb:11.4@sha256:<digest>; required for runtime dependency, host-firewall repair, and live-acceptance operations.
        required: false
        type: string
      backend_image:
        description: Exact immutable Artifact Registry backend image; required for backend rollout, live validation, and capacity baseline.
        required: false
        type: string
      backend_source_sha:
        description: Full source commit SHA embedded in the backend image; required for backend rollout, C2 stability validation, and capacity baseline.
        required: false
        type: string
      expected_current_backend_image:
        description: Exact currently deployed backend image; required for backend rollout.
        required: false
        type: string
      source_validation_run_id:
        description: Successful backend-live-validation run ID whose private project/result will be re-read across backend replacement.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-target-terraform-state
  cancel-in-progress: false

jobs:
  terraform-preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'runtime-secret-foundation' || inputs.operation == 'runtime-dependencies' || inputs.operation == 'runtime-host-firewall-repair')
    runs-on: ubuntu-latest
    environment: gcp-target-plan
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_project_id: terraformers-platform
      TF_VAR_subnet_cidr: 10.40.0.0/20
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/envs/gcp-target-runtime

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted runtime dependency request
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          MARIADB_IMAGE: ${{ inputs.mariadb_image }}
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PLAN_SERVICE_ACCOUNT: ${{ vars.GCP_TF_PLAN_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Approved SHA does not match checked-out main.' >&2
            exit 1
          }
          [[ "$STATE_BUCKET" == terraformers-platform-tfstate-21647422237 ]]
          [[ "$PLAN_SERVICE_ACCOUNT" == terraformers-plan@terraformers-platform.iam.gserviceaccount.com ]]
          [[ -n "$WIF_PROVIDER" ]]
          case "$OPERATION" in
            runtime-secret-foundation)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_RUNTIME_SECRET_FOUNDATION_3 ]]
              echo 'TF_VAR_enable_delivery_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_secret_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_dependencies=false' >> "$GITHUB_ENV"
              ;;
            runtime-dependencies)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_RUNTIME_DEPENDENCIES_10 ]]
              [[ "$MARIADB_IMAGE" =~ ^mariadb:11\.4@sha256:[0-9a-f]{64}$ ]] || {
                echo 'runtime-dependencies requires exact mariadb:11.4@sha256:<digest>.' >&2
                exit 1
              }
              echo 'TF_VAR_enable_delivery_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_secret_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_dependencies=true' >> "$GITHUB_ENV"
              echo "TF_VAR_mariadb_image=$MARIADB_IMAGE" >> "$GITHUB_ENV"
              ;;
            runtime-host-firewall-repair)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_RUNTIME_HOST_FIREWALL_REPAIR_1 ]]
              [[ "$MARIADB_IMAGE" =~ ^mariadb:11\.4@sha256:[0-9a-f]{64}$ ]] || {
                echo 'runtime-host-firewall-repair requires exact mariadb:11.4@sha256:<digest>.' >&2
                exit 1
              }
              echo 'TF_VAR_enable_delivery_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_secret_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_dependencies=true' >> "$GITHUB_ENV"
              echo "TF_VAR_mariadb_image=$MARIADB_IMAGE" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported Terraform operation: $OPERATION" >&2
              exit 1
              ;;
          esac

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Reconfirm plan identity is non-mutating
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          response="$(
            curl -fsS -X POST \
              -H "Authorization: Bearer ${access_token}" \
              -H 'Content-Type: application/json' \
              -d '{"permissions":["compute.disks.create","compute.firewalls.create","compute.instances.create","container.clusters.update","iam.serviceAccounts.create","resourcemanager.projects.setIamPolicy","secretmanager.secrets.create","secretmanager.secrets.setIamPolicy","secretmanager.versions.access","serviceusage.services.enable","storage.buckets.create","storage.buckets.setIamPolicy"]}' \
              'https://cloudresourcemanager.googleapis.com/v1/projects/terraformers-platform:testIamPermissions'
          )"
          granted="$(jq -r '.permissions // [] | join(",")' <<< "$response")"
          [[ -z "$granted" ]] || {
            echo "Plan identity unexpectedly has runtime mutation/secret-access permissions: $granted" >&2
            exit 1
          }

      - name: Verify required plan read roles
        run: |
          set -euo pipefail
          policy="$(mktemp)"
          gcloud projects get-iam-policy terraformers-platform --format=json > "$policy"
          member='serviceAccount:terraformers-plan@terraformers-platform.iam.gserviceaccount.com'
          for role in \
            roles/browser \
            roles/compute.viewer \
            roles/container.viewer \
            roles/iam.serviceAccountViewer \
            roles/iam.securityReviewer \
            roles/serviceusage.serviceUsageConsumer \
            roles/secretmanager.viewer \
            roles/storage.bucketViewer
          do
            jq -e --arg role "$role" --arg member "$member" '
              any(.bindings[]?;
                .role == $role and any(.members[]?; . == $member)
              )
            ' "$policy" >/dev/null || {
              echo "Plan identity is missing runtime read role: $role" >&2
              echo 'Run the separately approved runtime IAM bootstrap first.' >&2
              exit 1
            }
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Plan exact reviewed runtime dependency operation
        env:
          OPERATION: ${{ inputs.operation }}
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform init -no-color -reconfigure -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config='prefix=gcp-target-runtime'

          mapfile -t state_addresses < <(terraform state list)
          for required in \
            'google_container_cluster.target' \
            'google_container_node_pool.target' \
            'google_artifact_registry_repository.backend[0]'
          do
            printf '%s\n' "${state_addresses[@]}" | grep -Fxq "$required" || {
              echo "Missing canonical runtime state address: $required" >&2
              exit 1
            }
          done

          terraform show -json > "${RUNNER_TEMP}/state.json"
          node_count="$(
            jq -r '
              .values.root_module.resources[]
              | select(.address == "google_container_node_pool.target")
              | .values.node_count
            ' "${RUNNER_TEMP}/state.json"
          )"
          [[ "$node_count" =~ ^[01]$ ]]
          echo "TF_VAR_node_count=$node_count" >> "$GITHUB_ENV"
          export TF_VAR_node_count="$node_count"

          if [[ "$OPERATION" == runtime-secret-foundation ]]; then
            for address in \
              'google_project_service.secret_manager[0]' \
              'google_secret_manager_secret.mariadb_root[0]' \
              'google_secret_manager_secret.mariadb_app[0]'
            do
              if printf '%s\n' "${state_addresses[@]}" | grep -Fxq "$address"; then
                echo "Runtime secret foundation already exists in state: $address" >&2
                exit 1
              fi
            done
          else
            master_version="$(
              gcloud container clusters describe terraformers-target \
                --zone=asia-northeast3-a \
                --project=terraformers-platform \
                --format='value(currentMasterVersion)'
            )"
            [[ "$master_version" =~ ^1\.([0-9]+)[.-] ]]
            (( BASH_REMATCH[1] >= 33 )) || {
              echo "GKE Secret Sync requires 1.33+; current=$master_version" >&2
              exit 1
            }
            for required in \
              'google_project_service.secret_manager[0]' \
              'google_secret_manager_secret.mariadb_root[0]' \
              'google_secret_manager_secret.mariadb_app[0]'
            do
              printf '%s\n' "${state_addresses[@]}" | grep -Fxq "$required" || {
                echo "Runtime dependencies require secret foundation state: $required" >&2
                exit 1
              }
            done
            for secret in terraformers-mariadb-root-password terraformers-mariadb-app-password; do
              enabled="$(
                gcloud secrets versions list "$secret" \
                  --project=terraformers-platform \
                  --filter='state=ENABLED' \
                  --format='value(name)' \
                  --limit=1
              )"
              [[ -n "$enabled" ]] || {
                echo "Runtime dependencies require an enabled secret version: $secret" >&2
                exit 1
              }
            done
          fi

          terraform plan -no-color -input=false -lock-timeout=5m \
            -out="${RUNNER_TEMP}/runtime.tfplan"
          terraform show -json "${RUNNER_TEMP}/runtime.tfplan" > "${RUNNER_TEMP}/runtime-plan.json"
          python3 "$GITHUB_WORKSPACE/scripts/deploy/gcp_target_plan_gate.py" \
            --plan-json "${RUNNER_TEMP}/runtime-plan.json" \
            --operation "$OPERATION"

  terraform-apply:
    needs: terraform-preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'runtime-secret-foundation' || inputs.operation == 'runtime-dependencies' || inputs.operation == 'runtime-host-firewall-repair') &&
      needs.terraform-preflight.result == 'success'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 60
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_project_id: terraformers-platform
      TF_VAR_subnet_cidr: 10.40.0.0/20
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/envs/gcp-target-runtime

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted apply request
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          MARIADB_IMAGE: ${{ inputs.mariadb_image }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          case "$OPERATION" in
            runtime-secret-foundation)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_RUNTIME_SECRET_FOUNDATION_3 ]]
              echo 'TF_VAR_enable_delivery_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_secret_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_dependencies=false' >> "$GITHUB_ENV"
              ;;
            runtime-dependencies)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_RUNTIME_DEPENDENCIES_10 ]]
              [[ "$MARIADB_IMAGE" =~ ^mariadb:11\.4@sha256:[0-9a-f]{64}$ ]]
              echo 'TF_VAR_enable_delivery_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_secret_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_dependencies=true' >> "$GITHUB_ENV"
              echo "TF_VAR_mariadb_image=$MARIADB_IMAGE" >> "$GITHUB_ENV"
              ;;
            runtime-host-firewall-repair)
              [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_RUNTIME_HOST_FIREWALL_REPAIR_1 ]]
              [[ "$MARIADB_IMAGE" =~ ^mariadb:11\.4@sha256:[0-9a-f]{64}$ ]]
              echo 'TF_VAR_enable_delivery_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_secret_foundation=true' >> "$GITHUB_ENV"
              echo 'TF_VAR_enable_runtime_dependencies=true' >> "$GITHUB_ENV"
              echo "TF_VAR_mariadb_image=$MARIADB_IMAGE" >> "$GITHUB_ENV"
              ;;
          esac

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify runtime dependency IAM bootstrap
        working-directory: ${{ github.workspace }}
        run: bash scripts/deploy/bootstrap_gcp_runtime_secrets.sh check

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Recreate and gate exact saved plan
        env:
          OPERATION: ${{ inputs.operation }}
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform init -no-color -reconfigure -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config='prefix=gcp-target-runtime'

          terraform show -json > "${RUNNER_TEMP}/state.json"
          node_count="$(
            jq -r '
              .values.root_module.resources[]
              | select(.address == "google_container_node_pool.target")
              | .values.node_count
            ' "${RUNNER_TEMP}/state.json"
          )"
          [[ "$node_count" =~ ^[01]$ ]]
          echo "TF_VAR_node_count=$node_count" >> "$GITHUB_ENV"
          export TF_VAR_node_count="$node_count"

          if [[ "$OPERATION" == runtime-dependencies || "$OPERATION" == runtime-host-firewall-repair ]]; then
            for secret in terraformers-mariadb-root-password terraformers-mariadb-app-password; do
              enabled="$(
                gcloud secrets versions list "$secret" \
                  --project=terraformers-platform \
                  --filter='state=ENABLED' \
                  --format='value(name)' \
                  --limit=1
              )"
              [[ -n "$enabled" ]] || {
                echo "Missing enabled secret version: $secret" >&2
                exit 1
              }
            done
          fi

          terraform plan -no-color -input=false -lock-timeout=5m \
            -out="${RUNNER_TEMP}/runtime.tfplan"
          terraform show -json "${RUNNER_TEMP}/runtime.tfplan" > "${RUNNER_TEMP}/runtime-plan.json"
          python3 "$GITHUB_WORKSPACE/scripts/deploy/gcp_target_plan_gate.py" \
            --plan-json "${RUNNER_TEMP}/runtime-plan.json" \
            --operation "$OPERATION"
          sha256sum "${RUNNER_TEMP}/runtime.tfplan" | awk '{print "- Saved plan SHA-256: `"$1"`"}' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply exact saved plan
        run: terraform apply -no-color -input=false "${RUNNER_TEMP}/runtime.tfplan"

      - name: Activate MariaDB host-firewall repair
        if: inputs.operation == 'runtime-host-firewall-repair'
        run: |
          set -euo pipefail
          gcloud compute instances stop terraformers-mariadb \
            --zone=asia-northeast3-a --project=terraformers-platform --quiet
          gcloud compute instances start terraformers-mariadb \
            --zone=asia-northeast3-a --project=terraformers-platform --quiet
          for _ in $(seq 1 90); do
            status="$(gcloud compute instances describe terraformers-mariadb \
              --zone=asia-northeast3-a --project=terraformers-platform \
              --format='value(status)')"
            [[ "$status" == RUNNING ]] && break
            sleep 2
          done
          [[ "$status" == RUNNING ]]
          echo '- MariaDB VM restarted once to activate the repaired COS startup-script firewall.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify resulting runtime dependency boundary
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == runtime-secret-foundation ]]; then
            for secret in terraformers-mariadb-root-password terraformers-mariadb-app-password; do
              gcloud secrets describe "$secret" --project=terraformers-platform --format='value(name)' >/dev/null
            done
            echo 'Secret containers exist; no secret version was created by Terraform.' >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$(
              gcloud container clusters describe terraformers-target \
                --zone=asia-northeast3-a --project=terraformers-platform \
                --format='value(secretSyncConfig.enabled)'
            )" == True ]]
            [[ "$(
              gcloud storage buckets describe gs://terraformers-runtime-objects-21647422237 \
                --format='value(public_access_prevention)'
            )" == enforced ]]
            [[ "$(
              gcloud storage buckets describe gs://terraformers-runtime-objects-21647422237 \
                --format='value(uniform_bucket_level_access)'
            )" == True ]]
            [[ "$(
              gcloud compute instances describe terraformers-mariadb \
                --zone=asia-northeast3-a --project=terraformers-platform \
                --format='value(status)'
            )" == RUNNING ]]
            {
              echo '## Case C runtime dependency apply'
              echo
              echo '- GKE Secret Sync: `enabled`'
              echo '- Runtime object bucket: private / UBLA / public access prevention enforced'
              echo '- MariaDB VM: `RUNNING`'
              echo '- Backend Deployment: not applied by this workflow'
              echo '- Secret payloads: not printed or uploaded'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  kubernetes-prerequisites:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'kubernetes-prerequisites'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted Kubernetes prerequisite request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMATION" == APPLY_REVIEWED_GCP_RUNTIME_K8S_PREREQUISITES ]]

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: terraformers-platform
          cluster_name: terraformers-target
          location: asia-northeast3-a

      - name: Verify prerequisite boundary
        run: |
          set -euo pipefail
          [[ "$(
            gcloud container clusters describe terraformers-target \
              --zone=asia-northeast3-a --project=terraformers-platform \
              --format='value(secretSyncConfig.enabled)'
          )" == True ]]
          [[ "$(
            gcloud compute instances describe terraformers-mariadb \
              --zone=asia-northeast3-a --project=terraformers-platform \
              --format='value(status)'
          )" == RUNNING ]]
          if kubectl -n terraformers-target get deployment terraformers-backend >/dev/null 2>&1; then
            echo 'Backend Deployment already exists; prerequisite workflow must not mutate around it.' >&2
            exit 1
          fi
          for pair in \
            'create serviceaccounts' \
            'create secretproviderclasses.secrets-store.csi.x-k8s.io' \
            'create secretsyncs.secret-sync.gke.io' \
            'create configmaps' \
            'create deployments.apps' \
            'create services' \
            'create endpointslices.discovery.k8s.io'
          do
            verb="${pair%% *}"
            resource="${pair#* }"
            kubectl auth can-i "$verb" "$resource" -n terraformers-target | grep -Fxq yes || {
              echo "Missing Kubernetes permission: $verb $resource" >&2
              exit 1
            }
          done

      - name: Apply isolated runtime prerequisites
        run: |
          set -euo pipefail
          kubectl apply -f infra/kubernetes/overlays/gcp-target/namespace.yaml
          kubectl apply -k infra/kubernetes/overlays/gcp-target/runtime-dependencies

          mariadb_ip="$(
            gcloud compute instances describe terraformers-mariadb \
              --zone=asia-northeast3-a \
              --project=terraformers-platform \
              --format='value(networkInterfaces[0].networkIP)'
          )"
          [[ "$mariadb_ip" =~ ^10\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Unexpected MariaDB private IP: $mariadb_ip" >&2
            exit 1
          }

          cat <<EOF | kubectl apply -f -
          apiVersion: discovery.k8s.io/v1
          kind: EndpointSlice
          metadata:
            name: terraformers-mariadb
            namespace: terraformers-target
            labels:
              kubernetes.io/service-name: terraformers-mariadb
          addressType: IPv4
          ports:
            - name: mariadb
              protocol: TCP
              port: 3306
          endpoints:
            - addresses:
                - "$mariadb_ip"
          EOF

      - name: Verify Secret Sync and JWKS prerequisites
        run: |
          set -euo pipefail
          kubectl -n terraformers-target rollout status deployment/terraformers-jwks --timeout=3m

          ready=false
          for _ in $(seq 1 60); do
            if kubectl -n terraformers-target get secret terraformers-backend-runtime-secrets -o json 2>/dev/null \
              | jq -e '.data.SPRING_DATASOURCE_PASSWORD | type == "string" and length > 0' >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || {
            echo 'Secret Sync did not create the expected backend DB-password key.' >&2
            exit 1
          }

          kubectl -n terraformers-target get endpointslice terraformers-mariadb >/dev/null
          if kubectl -n terraformers-target get deployment terraformers-backend >/dev/null 2>&1; then
            echo 'Backend Deployment was unexpectedly created.' >&2
            exit 1
          fi

          {
            echo '## Case C Kubernetes runtime prerequisites'
            echo
            echo '- Secret Sync target key: present (value not printed)'
            echo '- MariaDB Kubernetes service/EndpointSlice: present'
            echo '- Internal JWKS service: ready'
            echo '- Backend Deployment: absent'
          } >> "$GITHUB_STEP_SUMMARY"


  backend-deployment:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'backend-deployment'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 15
    env:
      PROJECT_ID: terraformers-platform
      ZONE: asia-northeast3-a
      NAMESPACE: terraformers-target
      IMAGE_BASE: asia-northeast3-docker.pkg.dev/terraformers-platform/terraformers-backend/terraformers-backend
      BACKEND_IMAGE: ${{ inputs.backend_image }}
      BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted backend deployment request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Approved SHA does not match checked-out main.' >&2
            exit 1
          }
          [[ "$CONFIRMATION" == APPLY_REVIEWED_CASE_C_BACKEND_DEPLOYMENT_1 ]]
          [[ "$BACKEND_IMAGE" =~ ^asia-northeast3-docker\.pkg\.dev/terraformers-platform/terraformers-backend/terraformers-backend@sha256:[0-9a-f]{64}$ ]] || {
            echo 'backend-deployment requires an exact immutable backend_image.' >&2
            exit 1
          }
          [[ "$BACKEND_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'backend-deployment requires a full 40-character backend_source_sha.' >&2
            exit 1
          }
          if [[ "$BACKEND_SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$BACKEND_SOURCE_SHA"
          fi
          git diff --quiet "$BACKEND_SOURCE_SHA" "$GITHUB_SHA" -- backend || {
            echo 'Backend source tree differs from the approved deployment revision; publish a new backend image.' >&2
            exit 1
          }

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: terraformers-platform
          cluster_name: terraformers-target
          location: asia-northeast3-a

      - name: Verify immutable backend image provenance
        run: |
          set -euo pipefail
          approved_digest="${BACKEND_IMAGE##*@}"
          source_tag="${IMAGE_BASE}:${BACKEND_SOURCE_SHA}"

          source_tag_digest="$(
            gcloud artifacts docker images describe "$source_tag" \
              --project="$PROJECT_ID" \
              --format='value(image_summary.digest)'
          )"
          [[ "$source_tag_digest" == "$approved_digest" ]] || {
            echo "Source-SHA tag digest mismatch: tag=$source_tag_digest approved=$approved_digest" >&2
            exit 1
          }

          immutable_digest="$(
            gcloud artifacts docker images describe "$BACKEND_IMAGE" \
              --project="$PROJECT_ID" \
              --format='value(image_summary.digest)'
          )"
          [[ "$immutable_digest" == "$approved_digest" ]] || {
            echo "Immutable backend image digest mismatch: resolved=$immutable_digest approved=$approved_digest" >&2
            exit 1
          }

      - name: Verify backend deployment prerequisites
        run: |
          set -euo pipefail

          [[ "$(
            gcloud compute instances describe terraformers-mariadb \
              --zone="$ZONE" --project="$PROJECT_ID" \
              --format='value(status)'
          )" == RUNNING ]]

          ready_nodes="$(
            kubectl get nodes \
              -o jsonpath='{range .items[*]}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}{end}' \
              | grep -c '^True$' || true
          )"
          (( ready_nodes >= 1 )) || {
            echo 'No Ready GKE node is available for the backend Deployment.' >&2
            exit 1
          }

          kubectl -n "$NAMESPACE" rollout status statefulset/terraformers-opensearch --timeout=2m
          kubectl -n "$NAMESPACE" rollout status deployment/terraformers-jwks --timeout=2m
          kubectl -n "$NAMESPACE" get secret terraformers-backend-runtime-secrets -o json \
            | jq -e '.data.SPRING_DATASOURCE_PASSWORD | type == "string" and length > 0' >/dev/null
          kubectl -n "$NAMESPACE" get endpointslice terraformers-mariadb >/dev/null

          if kubectl -n "$NAMESPACE" get deployment terraformers-backend >/dev/null 2>&1; then
            echo 'Backend Deployment already exists; first deployment checkpoint refuses to overwrite it.' >&2
            exit 1
          fi

          for pair in \
            'create serviceaccounts' \
            'patch serviceaccounts' \
            'create configmaps' \
            'patch configmaps' \
            'create services' \
            'patch services' \
            'create deployments.apps' \
            'patch deployments.apps'
          do
            verb="${pair%% *}"
            resource="${pair#* }"
            kubectl auth can-i "$verb" "$resource" -n "$NAMESPACE" | grep -Fxq yes || {
              echo "Missing Kubernetes permission: $verb $resource" >&2
              exit 1
            }
          done

      - name: Render and verify exact backend deployment
        run: |
          set -euo pipefail
          rendered_base="${RUNNER_TEMP}/gcp-target-rendered-base.yaml"
          rendered="${RUNNER_TEMP}/gcp-target-rendered.yaml"
          placeholder="${IMAGE_BASE}:replace-with-immutable-tag"

          kubectl kustomize infra/kubernetes/overlays/gcp-target > "$rendered_base"

          PLACEHOLDER="$placeholder" BACKEND_IMAGE="$BACKEND_IMAGE" \
            python3 - "$rendered_base" "$rendered" <<'PY'
          import os
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          text = source.read_text()
          placeholder = "image: " + os.environ["PLACEHOLDER"]
          replacement = "image: " + os.environ["BACKEND_IMAGE"]
          count = text.count(placeholder)
          if count != 1:
              raise SystemExit(
                  f"expected exactly one backend image placeholder in rendered manifest, found {count}"
              )
          target.write_text(text.replace(placeholder, replacement))
          PY

          mapfile -t backend_images < <(
            awk '$1 == "image:" && $2 ~ /terraformers-backend/ { print $2 }' "$rendered"
          )
          [[ "${#backend_images[@]}" == 1 ]] || {
            echo "Rendered manifest must contain exactly one backend container image; found ${#backend_images[@]}." >&2
            exit 1
          }
          [[ "${backend_images[0]}" == "$BACKEND_IMAGE" ]] || {
            echo "Rendered backend image mismatch: ${backend_images[0]}" >&2
            exit 1
          }

          grep -Fq "image: $BACKEND_IMAGE" "$rendered"
          ! grep -Fq 'replace-with-immutable-tag' "$rendered"
          ! grep -Fq 'registry.example.com' "$rendered"
          ! grep -Fq 'public.ecr.aws/example/terraformers-backend' "$rendered"

          stale_digest="$(
            awk -v approved="$BACKEND_IMAGE" \
              '$1 == "image:" && $2 ~ /terraformers-backend@sha256:/ && $2 != approved { print $2 }' \
              "$rendered"
          )"
          [[ -z "$stale_digest" ]] || {
            echo "Rendered manifest contains a stale backend digest: $stale_digest" >&2
            exit 1
          }

          grep -Fq 'GOOGLE_CLOUD_PROJECT: terraformers-platform' "$rendered"
          grep -Fq 'TERRAFORMERS_SECURITY_JWT_COGNITO_CLIENT_ID: case-c-runtime-client' "$rendered"
          ! grep -Fq 'JWT_COGNITO_CLIENT_ID:' "$rendered"
          ! grep -Fq 'COGNITO_USER_POOL_CLIENT_ID:' "$rendered"

      - name: Apply only backend-labeled resources
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/gcp-target-rendered.yaml"

          kubectl apply \
            -f "$rendered" \
            -l app.kubernetes.io/name=terraformers-backend

          if ! kubectl -n "$NAMESPACE" rollout status \
              deployment/terraformers-backend --timeout=5m; then
            echo 'Backend Deployment did not become Ready; capturing bounded diagnostics.' >&2
            kubectl -n "$NAMESPACE" get deployment terraformers-backend -o wide || true
            kubectl -n "$NAMESPACE" get pods \
              -l app.kubernetes.io/name=terraformers-backend -o wide || true
            kubectl -n "$NAMESPACE" describe deployment terraformers-backend || true
            kubectl -n "$NAMESPACE" logs \
              -l app.kubernetes.io/name=terraformers-backend \
              --all-containers=true --tail=200 || true
            exit 1
          fi

      - name: Verify deployed backend boundary
        run: |
          set -euo pipefail

          actual_image="$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}'
          )"
          [[ "$actual_image" == "$BACKEND_IMAGE" ]]

          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend \
              -o jsonpath='{.status.readyReplicas}'
          )" == 1 ]]
          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend \
              -o jsonpath='{.status.availableReplicas}'
          )" == 1 ]]
          [[ "$(
            kubectl -n "$NAMESPACE" get service terraformers-backend \
              -o jsonpath='{.spec.type}'
          )" == ClusterIP ]]

          runtime_source="$(
            kubectl -n "$NAMESPACE" exec deployment/terraformers-backend \
              -c backend -- sh -c 'printf "%s" "$BUILD_SOURCE_REVISION"'
          )"
          [[ "$runtime_source" == "$BACKEND_SOURCE_SHA" ]] || {
            echo "Runtime source revision mismatch: $runtime_source" >&2
            exit 1
          }

          health="$(
            kubectl -n "$NAMESPACE" exec deployment/terraformers-backend \
              -c backend -- curl -fsS http://127.0.0.1:8080/actuator/health
          )"
          jq -e '.status == "UP"' <<< "$health" >/dev/null

          {
            echo '## Case C backend deployment'
            echo
            printf -- '- Deployment workflow SHA: `%s`\n' "$GITHUB_SHA"
            printf -- '- Backend artifact source SHA: `%s`\n' "$BACKEND_SOURCE_SHA"
            printf -- '- Immutable backend image: `%s`\n' "$actual_image"
            printf -- '- Embedded source SHA: `%s`\n' "$runtime_source"
            echo '- Ready replicas: 1/1'
            echo '- Service exposure: ClusterIP'
            echo '- Backend health: UP'
            echo '- Runtime prerequisites reused; no new IAM/cloud resource mutation'
            echo '- Load generation / rollout / rollback: not executed in this checkpoint'
          } >> "$GITHUB_STEP_SUMMARY"

  backend-revision-rollout:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'backend-revision-rollout'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 20
    env:
      PROJECT_ID: terraformers-platform
      LOCATION: asia-northeast3
      ZONE: asia-northeast3-a
      NAMESPACE: terraformers-target
      IMAGE_BASE: asia-northeast3-docker.pkg.dev/terraformers-platform/terraformers-backend/terraformers-backend

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted backend revision rollout request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
          EXPECTED_CURRENT_BACKEND_IMAGE: ${{ inputs.expected_current_backend_image }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Approved workflow SHA does not match checked-out main.' >&2
            exit 1
          }
          [[ "$CONFIRMATION" == APPLY_REVIEWED_CASE_C_BACKEND_REVISION_ROLLOUT_1 ]]
          [[ "$BACKEND_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_IMAGE" =~ ^asia-northeast3-docker\.pkg\.dev/terraformers-platform/terraformers-backend/terraformers-backend@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CURRENT_BACKEND_IMAGE" =~ ^asia-northeast3-docker\.pkg\.dev/terraformers-platform/terraformers-backend/terraformers-backend@sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKEND_IMAGE" != "$EXPECTED_CURRENT_BACKEND_IMAGE" ]] || {
            echo 'Target backend image is already the expected current image.' >&2
            exit 1
          }

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: terraformers-platform
          cluster_name: terraformers-target
          location: asia-northeast3-a

      - name: Verify immutable image provenance and current deployment boundary
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
          EXPECTED_CURRENT_BACKEND_IMAGE: ${{ inputs.expected_current_backend_image }}
        run: |
          set -euo pipefail
          target_digest="${BACKEND_IMAGE##*@}"
          source_tag="${IMAGE_BASE}:${BACKEND_SOURCE_SHA}"

          tag_digest="$(
            gcloud artifacts docker images describe "$source_tag"               --project="$PROJECT_ID"               --format='value(image_summary.digest)'
          )"
          [[ "$tag_digest" == "$target_digest" ]] || {
            echo "Source-SHA tag digest mismatch: tag=$tag_digest target=$target_digest" >&2
            exit 1
          }

          immutable_digest="$(
            gcloud artifacts docker images describe "$BACKEND_IMAGE"               --project="$PROJECT_ID"               --format='value(image_summary.digest)'
          )"
          [[ "$immutable_digest" == "$target_digest" ]] || {
            echo 'Immutable backend image digest verification failed.' >&2
            exit 1
          }

          actual_current="$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend               -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}'
          )"
          [[ "$actual_current" == "$EXPECTED_CURRENT_BACKEND_IMAGE" ]] || {
            echo "Current backend image mismatch: actual=$actual_current" >&2
            exit 1
          }

          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend               -o jsonpath='{.status.readyReplicas}'
          )" == 1 ]]
          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend               -o jsonpath='{.status.availableReplicas}'
          )" == 1 ]]

          kubectl auth can-i patch deployments.apps -n "$NAMESPACE" | grep -Fxq yes
          kubectl auth can-i patch configmaps -n "$NAMESPACE" | grep -Fxq yes

      - name: Roll out exact immutable backend revision
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: |
          set -euo pipefail
          if ! kubectl -n "$NAMESPACE" set image               deployment/terraformers-backend               "backend=$BACKEND_IMAGE"; then
            echo 'Failed to submit backend image update.' >&2
            exit 1
          fi

          if ! kubectl -n "$NAMESPACE" rollout status               deployment/terraformers-backend --timeout=7m; then
            echo 'Backend revision did not become Ready; reverting to previous ReplicaSet revision.' >&2
            kubectl -n "$NAMESPACE" rollout undo deployment/terraformers-backend || true
            kubectl -n "$NAMESPACE" rollout status deployment/terraformers-backend --timeout=5m || true
            kubectl -n "$NAMESPACE" get deployment terraformers-backend -o wide || true
            kubectl -n "$NAMESPACE" get pods               -l app.kubernetes.io/name=terraformers-backend -o wide || true
            kubectl -n "$NAMESPACE" logs               -l app.kubernetes.io/name=terraformers-backend               --all-containers=true --tail=200 || true
            exit 1
          fi

      - name: Verify resulting backend revision
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
          EXPECTED_CURRENT_BACKEND_IMAGE: ${{ inputs.expected_current_backend_image }}
        run: |
          set -euo pipefail
          actual_image="$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend               -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}'
          )"
          [[ "$actual_image" == "$BACKEND_IMAGE" ]]

          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend               -o jsonpath='{.status.readyReplicas}'
          )" == 1 ]]
          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend               -o jsonpath='{.status.availableReplicas}'
          )" == 1 ]]

          runtime_source="$(
            kubectl -n "$NAMESPACE" exec deployment/terraformers-backend               -c backend -- sh -c 'printf "%s" "$BUILD_SOURCE_REVISION"'
          )"
          [[ "$runtime_source" == "$BACKEND_SOURCE_SHA" ]] || {
            echo "Runtime source revision mismatch: $runtime_source" >&2
            exit 1
          }

          health="$(
            kubectl -n "$NAMESPACE" exec deployment/terraformers-backend               -c backend -- curl -fsS http://127.0.0.1:8080/actuator/health
          )"
          jq -e '.status == "UP"' <<< "$health" >/dev/null

          {
            echo '## Case C backend revision rollout'
            echo
            printf -- '- Workflow SHA: `%s`\n' "$GITHUB_SHA"
            printf -- '- Previous image: `%s`\n' "$EXPECTED_CURRENT_BACKEND_IMAGE"
            printf -- '- Target image: `%s`\n' "$BACKEND_IMAGE"
            printf -- '- Embedded source SHA: `%s`\n' "$runtime_source"
            echo '- Ready replicas: `1/1`'
            echo '- Backend health: `UP`'
            echo '- Terraform/IAM/GCP resource mutation: none'
          } >> "$GITHUB_STEP_SUMMARY"

  backend-replacement-durability:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'backend-replacement-durability'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 25
    env:
      PROJECT_ID: terraformers-platform
      NAMESPACE: terraformers-target
      ISSUER_URI: https://identity.example.test/case-c
      CLIENT_ID: case-c-runtime-client
      RESULT_BUCKET: terraformers-runtime-objects-21647422237

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted backend replacement durability request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
          SOURCE_VALIDATION_RUN_ID: ${{ inputs.source_validation_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Approved workflow SHA does not match checked-out main.' >&2
            exit 1
          }
          [[ "$CONFIRMATION" == RUN_REVIEWED_CASE_C_BACKEND_REPLACEMENT_DURABILITY_1 ]]
          [[ "$BACKEND_IMAGE" =~ ^asia-northeast3-docker\.pkg\.dev/terraformers-platform/terraformers-backend/terraformers-backend@sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKEND_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_VALIDATION_RUN_ID" =~ ^[0-9]+$ ]]

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: terraformers-platform
          cluster_name: terraformers-target
          location: asia-northeast3-a

      - name: Verify replacement boundary
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
        run: |
          set -euo pipefail
          actual_image="$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}'
          )"
          [[ "$actual_image" == "$BACKEND_IMAGE" ]]

          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend \
              -o jsonpath='{.status.readyReplicas}'
          )" == 1 ]]
          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend \
              -o jsonpath='{.status.availableReplicas}'
          )" == 1 ]]

          runtime_source="$(
            kubectl -n "$NAMESPACE" exec deployment/terraformers-backend \
              -c backend -- sh -c 'printf "%s" "$BUILD_SOURCE_REVISION"'
          )"
          [[ "$runtime_source" == "$BACKEND_SOURCE_SHA" ]]
          kubectl auth can-i delete pods -n "$NAMESPACE" | grep -Fxq yes

      - name: Prepare durable-project authentication fixture
        env:
          SOURCE_VALIDATION_RUN_ID: ${{ inputs.source_validation_run_id }}
        run: |
          set -euo pipefail
          previous_jwks="${RUNNER_TEMP}/previous-jwks.json"
          private_key="${RUNNER_TEMP}/case-c-private.pem"
          modulus_bin="${RUNNER_TEMP}/case-c-modulus.bin"
          jwks="${RUNNER_TEMP}/case-c-jwks.json"
          token_file="${RUNNER_TEMP}/case-c-access.token"
          unsigned="${RUNNER_TEMP}/case-c-unsigned.token"
          signature="${RUNNER_TEMP}/case-c-signature.bin"
          kid="case-c-${GITHUB_RUN_ID}"

          kubectl -n "$NAMESPACE" get configmap terraformers-jwks \
            -o jsonpath='{.data.jwks\.json}' > "$previous_jwks"
          test -s "$previous_jwks"
          jq -e '.keys == []' "$previous_jwks" >/dev/null || {
            echo 'Refusing to replace a non-placeholder JWKS configuration.' >&2
            exit 1
          }

          b64url_file() {
            openssl base64 -A <"$1" | tr '+/' '-_' | tr -d '='
          }

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -pkeyopt rsa_keygen_pubexp:65537 \
            -out "$private_key" 2>/dev/null

          modulus_hex="$(
            openssl rsa -in "$private_key" -noout -modulus 2>/dev/null | cut -d= -f2
          )"
          printf '%s' "$modulus_hex" | xxd -r -p > "$modulus_bin"
          modulus="$(b64url_file "$modulus_bin")"

          printf '{"keys":[{"kid":"%s","kty":"RSA","alg":"RS256","use":"sig","n":"%s","e":"AQAB"}]}' \
            "$kid" "$modulus" > "$jwks"

          kubectl -n "$NAMESPACE" create configmap terraformers-jwks \
            --from-file=jwks.json="$jwks" \
            --dry-run=client -o yaml \
            | kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout restart deployment/terraformers-jwks
          kubectl -n "$NAMESPACE" rollout status deployment/terraformers-jwks --timeout=2m

          service_visible=false
          for _ in $(seq 1 30); do
            backend_seen_jwks="$(
              kubectl -n "$NAMESPACE" exec deployment/terraformers-backend \
                -c backend -- \
                curl -fsS http://terraformers-jwks:8080/jwks.json 2>/dev/null || true
            )"
            if jq -e --arg kid "$kid" --arg modulus "$modulus" '
              .keys | length == 1
              and .[0].kid == $kid
              and .[0].alg == "RS256"
              and .[0].n == $modulus
              and .[0].e == "AQAB"
            ' <<< "$backend_seen_jwks" >/dev/null 2>&1; then
              service_visible=true
              break
            fi
            sleep 1
          done
          [[ "$service_visible" == true ]] || {
            echo 'Backend pod did not observe the durability JWKS through the Service path.' >&2
            exit 1
          }

          now="$(date +%s)"
          subject="case-c-${SOURCE_VALIDATION_RUN_ID}"
          header="$(
            printf '{"alg":"RS256","kid":"%s","typ":"JWT"}' "$kid" \
              | openssl base64 -A | tr '+/' '-_' | tr -d '='
          )"
          payload="$(
            printf '{"iss":"%s","sub":"%s","email":"%s","token_use":"access","client_id":"%s","iat":%s,"exp":%s}' \
              "$ISSUER_URI" \
              "$subject" \
              "${subject}@example.test" \
              "$CLIENT_ID" \
              "$now" \
              "$((now + 900))" \
              | openssl base64 -A | tr '+/' '-_' | tr -d '='
          )"
          printf '%s.%s' "$header" "$payload" > "$unsigned"
          openssl dgst -sha256 -sign "$private_key" -out "$signature" "$unsigned"
          printf '%s.%s' "$(cat "$unsigned")" "$(b64url_file "$signature")" > "$token_file"

      - name: Prove result identity survives backend pod replacement
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
          SOURCE_VALIDATION_RUN_ID: ${{ inputs.source_validation_run_id }}
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/case-c-access.token")"
          project_name="case-c-live-${SOURCE_VALIDATION_RUN_ID}"
          projects_before="${RUNNER_TEMP}/projects-before.json"
          job_before="${RUNNER_TEMP}/job-before.json"
          tree_before="${RUNNER_TEMP}/tree-before.json"
          draft_before="${RUNNER_TEMP}/draft-before.json"
          job_after="${RUNNER_TEMP}/job-after.json"
          tree_after="${RUNNER_TEMP}/tree-after.json"
          draft_after="${RUNNER_TEMP}/draft-after.json"
          pf_log="${RUNNER_TEMP}/case-c-replacement-port-forward.log"
          pf_pid=""

          stop_pf() {
            if [[ -n "$pf_pid" ]]; then
              kill "$pf_pid" >/dev/null 2>&1 || true
              wait "$pf_pid" >/dev/null 2>&1 || true
              pf_pid=""
            fi
          }

          start_pf() {
            : > "$pf_log"
            kubectl -n "$NAMESPACE" port-forward service/terraformers-backend 18080:80 \
              >"$pf_log" 2>&1 &
            pf_pid=$!
            ready=false
            for _ in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:18080/actuator/health \
                  | jq -e '.status == "UP"' >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done
            [[ "$ready" == true ]] || {
              cat "$pf_log" >&2 || true
              echo 'Backend port-forward did not become healthy.' >&2
              exit 1
            }
          }

          hash_gcs_object_from_pod() {
            local pod="$1"
            local bucket="$2"
            local key="$3"
            kubectl -n "$NAMESPACE" exec "$pod" -c backend -- \
              env OBJECT_BUCKET="$bucket" OBJECT_KEY="$key" sh -c '
                set -eu
                token="$(
                  curl -fsS -H "Metadata-Flavor: Google" \
                    http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
                    | sed -nE "s/.*\"access_token\"[[:space:]]*:[[:space:]]*\"([^\"]+)\".*/\1/p"
                )"
                test -n "$token"
                tmp="$(mktemp /tmp/case-c-object.XXXXXX)"
                curl -fsS \
                  -H "Authorization: Bearer $token" \
                  "https://storage.googleapis.com/${OBJECT_BUCKET}/${OBJECT_KEY}" \
                  -o "$tmp"
                sha256sum "$tmp" | awk "{print \$1}"
                rm -f "$tmp"
              '
          }

          trap stop_pf EXIT
          start_pf

          metrics_before="${RUNNER_TEMP}/metrics-before.txt"
          curl -fsS http://127.0.0.1:18080/actuator/prometheus > "$metrics_before"
          grep -Eq '^(jvm_|process_|http_server_requests)' "$metrics_before"

          curl -fsS \
            -H "Authorization: Bearer ${token}" \
            http://127.0.0.1:18080/api/projects > "$projects_before"

          jq -e --arg name "$project_name" \
            '[.[] | select(.displayName == $name)] | length == 1' \
            "$projects_before" >/dev/null

          project_id="$(
            jq -r --arg name "$project_name" \
              '.[] | select(.displayName == $name) | .projectId' \
              "$projects_before"
          )"
          job_id="$(
            jq -r --arg name "$project_name" \
              '.[] | select(.displayName == $name) | .latestAnalysisJobId' \
              "$projects_before"
          )"
          result_file_id="$(
            jq -r --arg name "$project_name" \
              '.[] | select(.displayName == $name) | .latestResultFileId' \
              "$projects_before"
          )"
          result_key="$(
            jq -r --arg name "$project_name" \
              '.[] | select(.displayName == $name) | .latestResultObjectKey' \
              "$projects_before"
          )"
          source_file_id="$(
            jq -r --arg name "$project_name" \
              '.[] | select(.displayName == $name) | .sourceFileId' \
              "$projects_before"
          )"
          source_bucket="$(
            jq -r --arg name "$project_name" \
              '.[] | select(.displayName == $name) | .sourceBucket' \
              "$projects_before"
          )"
          source_key="$(
            jq -r --arg name "$project_name" \
              '.[] | select(.displayName == $name) | .sourceKey' \
              "$projects_before"
          )"

          [[ "$project_id" =~ ^[0-9]+$ ]]
          [[ "$job_id" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$result_file_id" =~ ^[0-9]+$ ]]
          [[ -n "$result_key" && "$result_key" != null ]]
          [[ "$source_file_id" =~ ^[0-9]+$ ]]
          [[ "$source_bucket" == terraformers-runtime-objects-21647422237 ]]
          [[ -n "$source_key" && "$source_key" != null ]]

          jq -e --arg name "$project_name" \
            '.[] | select(.displayName == $name)
              | .analysisStatus == "SUCCEEDED"
                and .sourceBinaryPersisted == true
                and .sourceStorageProvider == "gcs"' \
            "$projects_before" >/dev/null

          curl -fsS \
            -H "Authorization: Bearer ${token}" \
            "http://127.0.0.1:18080/api/analysis/jobs/${job_id}" > "$job_before"
          jq -e \
            --arg job_id "$job_id" \
            --arg result_key "$result_key" \
            --argjson project_id "$project_id" \
            --argjson result_file_id "$result_file_id" '
              .id == $job_id
              and .projectId == $project_id
              and .status == "SUCCEEDED"
              and .resultFileId == $result_file_id
              and .resultObjectKey == $result_key
              and (.provider | type == "string" and length > 0)
              and .failureReason == null
            ' "$job_before" >/dev/null

          curl -fsS \
            -H "Authorization: Bearer ${token}" \
            "http://127.0.0.1:18080/api/project-tree/${project_id}" > "$tree_before"
          jq -e \
            --arg job_id "$job_id" \
            --arg result_key "$result_key" \
            --argjson result_file_id "$result_file_id" '
              .latestAnalysisJobId == $job_id
              and .latestResultFileId == $result_file_id
              and .latestResultObjectKey == $result_key
              and .analysisStatus == "SUCCEEDED"
            ' "$tree_before" >/dev/null

          curl -fsS \
            -H "Authorization: Bearer ${token}" \
            "http://127.0.0.1:18080/api/projects/${project_id}/terraform/main.tf" > "$draft_before"
          jq -e \
            --arg job_id "$job_id" \
            --arg result_key "$result_key" \
            --argjson project_id "$project_id" \
            --argjson result_file_id "$result_file_id" '
              .projectId == $project_id
              and .fileId == $result_file_id
              and .latestAnalysisJobId == $job_id
              and .latestResultObjectKey == $result_key
              and (.content | type == "string" and length > 0)
            ' "$draft_before" >/dev/null
          draft_hash_before="$(
            jq -r '.content' "$draft_before" | sha256sum | awk '{print $1}'
          )"

          old_pod="$(
            kubectl -n "$NAMESPACE" get pods \
              -l app.kubernetes.io/name=terraformers-backend \
              -o jsonpath='{.items[0].metadata.name}'
          )"
          old_uid="$(
            kubectl -n "$NAMESPACE" get pod "$old_pod" \
              -o jsonpath='{.metadata.uid}'
          )"
          [[ -n "$old_pod" && -n "$old_uid" ]]

          source_hash_before="$(
            hash_gcs_object_from_pod "$old_pod" "$source_bucket" "$source_key"
          )"
          result_hash_before="$(
            hash_gcs_object_from_pod "$old_pod" "$RESULT_BUCKET" "$result_key"
          )"
          [[ "$source_hash_before" =~ ^[0-9a-f]{64}$ ]]
          [[ "$result_hash_before" =~ ^[0-9a-f]{64}$ ]]

          stop_pf
          kubectl -n "$NAMESPACE" delete pod "$old_pod" --wait=true
          kubectl -n "$NAMESPACE" rollout status deployment/terraformers-backend --timeout=7m

          new_pod="$(
            kubectl -n "$NAMESPACE" get pods \
              -l app.kubernetes.io/name=terraformers-backend \
              -o jsonpath='{.items[0].metadata.name}'
          )"
          new_uid="$(
            kubectl -n "$NAMESPACE" get pod "$new_pod" \
              -o jsonpath='{.metadata.uid}'
          )"
          [[ -n "$new_pod" && -n "$new_uid" ]]
          [[ "$new_uid" != "$old_uid" ]] || {
            echo 'Backend pod UID did not change after replacement.' >&2
            exit 1
          }

          [[ "$(
            kubectl -n "$NAMESPACE" get pod "$new_pod" \
              -o jsonpath='{.spec.containers[?(@.name=="backend")].image}'
          )" == "$BACKEND_IMAGE" ]]

          runtime_source="$(
            kubectl -n "$NAMESPACE" exec "$new_pod" -c backend -- \
              sh -c 'printf "%s" "$BUILD_SOURCE_REVISION"'
          )"
          [[ "$runtime_source" == "$BACKEND_SOURCE_SHA" ]]

          source_hash_after="$(
            hash_gcs_object_from_pod "$new_pod" "$source_bucket" "$source_key"
          )"
          result_hash_after="$(
            hash_gcs_object_from_pod "$new_pod" "$RESULT_BUCKET" "$result_key"
          )"
          [[ "$source_hash_after" == "$source_hash_before" ]] || {
            echo 'Source GCS object hash changed across backend pod replacement.' >&2
            exit 1
          }
          [[ "$result_hash_after" == "$result_hash_before" ]] || {
            echo 'Result GCS object hash changed across backend pod replacement.' >&2
            exit 1
          }

          start_pf
          metrics_after="${RUNNER_TEMP}/metrics-after.txt"
          curl -fsS http://127.0.0.1:18080/actuator/prometheus > "$metrics_after"
          grep -Eq '^(jvm_|process_|http_server_requests)' "$metrics_after"

          curl -fsS \
            -H "Authorization: Bearer ${token}" \
            "http://127.0.0.1:18080/api/analysis/jobs/${job_id}" > "$job_after"
          jq -e \
            --arg job_id "$job_id" \
            --arg result_key "$result_key" \
            --argjson project_id "$project_id" \
            --argjson result_file_id "$result_file_id" '
              .id == $job_id
              and .projectId == $project_id
              and .status == "SUCCEEDED"
              and .resultFileId == $result_file_id
              and .resultObjectKey == $result_key
              and (.provider | type == "string" and length > 0)
              and .failureReason == null
            ' "$job_after" >/dev/null

          curl -fsS \
            -H "Authorization: Bearer ${token}" \
            "http://127.0.0.1:18080/api/project-tree/${project_id}" > "$tree_after"
          jq -e \
            --arg job_id "$job_id" \
            --arg result_key "$result_key" \
            --argjson result_file_id "$result_file_id" '
              .latestAnalysisJobId == $job_id
              and .latestResultFileId == $result_file_id
              and .latestResultObjectKey == $result_key
              and .analysisStatus == "SUCCEEDED"
            ' "$tree_after" >/dev/null

          curl -fsS \
            -H "Authorization: Bearer ${token}" \
            "http://127.0.0.1:18080/api/projects/${project_id}/terraform/main.tf" > "$draft_after"
          jq -e \
            --arg job_id "$job_id" \
            --arg result_key "$result_key" \
            --argjson project_id "$project_id" \
            --argjson result_file_id "$result_file_id" '
              .projectId == $project_id
              and .fileId == $result_file_id
              and .latestAnalysisJobId == $job_id
              and .latestResultObjectKey == $result_key
              and (.content | type == "string" and length > 0)
            ' "$draft_after" >/dev/null
          draft_hash_after="$(
            jq -r '.content' "$draft_after" | sha256sum | awk '{print $1}'
          )"
          [[ "$draft_hash_after" == "$draft_hash_before" ]] || {
            echo 'Terraform draft content hash changed across backend pod replacement.' >&2
            exit 1
          }

          {
            echo '## Case C backend replacement durability'
            printf -- '- Source validation run: %s\n' "$SOURCE_VALIDATION_RUN_ID"
            printf -- '- Project ID: %s\n' "$project_id"
            printf -- '- AnalysisJob: %s\n' "$job_id"
            printf -- '- Result file ID: %s\n' "$result_file_id"
            printf -- '- Result object key: %s\n' "$result_key"
            printf -- '- Source file ID: %s\n' "$source_file_id"
            printf -- '- Old pod UID: %s\n' "$old_uid"
            printf -- '- New pod UID: %s\n' "$new_uid"
            printf -- '- Terraform draft SHA-256: %s\n' "$draft_hash_after"
            printf -- '- Source GCS SHA-256: %s\n' "$source_hash_after"
            printf -- '- Result GCS SHA-256: %s\n' "$result_hash_after"
            echo '- Actuator/Prometheus metrics before/after replacement: reachable'
            echo '- Durable AnalysisJob state after replacement: SUCCEEDED'
            echo '- Result relational identity after replacement: unchanged'
            echo '- Result Terraform bytes after replacement: unchanged'
            echo '- Deployment image/source revision after replacement: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore placeholder JWKS fixture
        if: always()
        run: |
          set -euo pipefail
          previous_jwks="${RUNNER_TEMP}/previous-jwks.json"
          if [[ -s "$previous_jwks" ]]; then
            kubectl -n "$NAMESPACE" create configmap terraformers-jwks \
              --from-file=jwks.json="$previous_jwks" \
              --dry-run=client -o yaml \
              | kubectl apply -f -
            kubectl -n "$NAMESPACE" rollout restart deployment/terraformers-jwks
            kubectl -n "$NAMESPACE" rollout status deployment/terraformers-jwks --timeout=2m
          fi

  backend-live-validation:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'backend-live-validation' || inputs.operation == 'backend-live-validation-c2-stability' || inputs.operation == 'a7-7-broad-v4-live-proof')
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 90
    env:
      PROJECT_ID: terraformers-platform
      ZONE: asia-northeast3-a
      NAMESPACE: terraformers-target
      ISSUER_URI: https://identity.example.test/case-c
      CLIENT_ID: case-c-runtime-client
      FIXTURE: evaluation/terraformers-eval-v1/fixtures/case-01-vpc-three-tier.webp
      NEGATIVE_FIXTURE: evaluation/terraformers-eval-v1/fixtures/case-06-non-architecture-dashboard.webp

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted backend live-validation request
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Approved SHA does not match checked-out main.' >&2
            exit 1
          }
          case "$OPERATION" in
            backend-live-validation)
              [[ "$CONFIRMATION" == RUN_REVIEWED_CASE_C_BACKEND_LIVE_VALIDATION_1 ]] || {
                echo 'Backend live validation requires confirmation RUN_REVIEWED_CASE_C_BACKEND_LIVE_VALIDATION_1.' >&2
                exit 1
              }
              ;;
            backend-live-validation-c2-stability)
              [[ "$CONFIRMATION" == RUN_REVIEWED_CASE_C_C2_STABILITY_GATE_5 ]] || {
                echo 'C2 stability gate requires confirmation RUN_REVIEWED_CASE_C_C2_STABILITY_GATE_5.' >&2
                exit 1
              }
              [[ "$BACKEND_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'C2 stability gate requires an exact backend_source_sha.' >&2
                exit 1
              }
              ;;
            a7-7-broad-v4-live-proof)
              [[ "$CONFIRMATION" == RUN_A7_7_BROAD_V4_LIVE_PROOF ]] || {
                echo 'A7-7 live proof requires confirmation RUN_A7_7_BROAD_V4_LIVE_PROOF.' >&2
                exit 1
              }
              [[ "$BACKEND_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'A7-7 live proof requires an exact backend_source_sha.' >&2
                exit 1
              }
              ;;
            *)
              echo "Unsupported backend live-validation operation: $OPERATION" >&2
              exit 1
              ;;
          esac

          if [[ "$OPERATION" == backend-live-validation-c2-stability || "$OPERATION" == a7-7-broad-v4-live-proof ]]; then
            if [[ "$BACKEND_SOURCE_SHA" != "$GITHUB_SHA" ]]; then
              git fetch --no-tags --depth=1 origin "$BACKEND_SOURCE_SHA"
            fi
            git diff --quiet "$BACKEND_SOURCE_SHA" "$GITHUB_SHA" -- backend || {
              echo 'Backend source tree differs from the approved validation revision; publish and deploy a new backend image first.' >&2
              exit 1
            }
          fi

          [[ "$BACKEND_IMAGE" =~ ^asia-northeast3-docker\.pkg\.dev/terraformers-platform/terraformers-backend/terraformers-backend@sha256:[0-9a-f]{64}$ ]] || {
            echo 'backend live validation requires an exact immutable backend_image.' >&2
            exit 1
          }

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: terraformers-platform
          cluster_name: terraformers-target
          location: asia-northeast3-a

      - name: Verify deployed backend boundary
        env:
          OPERATION: ${{ inputs.operation }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
        run: |
          set -euo pipefail
          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend               -o jsonpath='{.status.readyReplicas}'
          )" == 1 ]]
          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend               -o jsonpath='{.status.availableReplicas}'
          )" == 1 ]]
          [[ "$(
            kubectl -n "$NAMESPACE" get deployment terraformers-backend               -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}'
          )" == "$BACKEND_IMAGE" ]]
          [[ "$(
            kubectl -n "$NAMESPACE" get service terraformers-backend               -o jsonpath='{.spec.type}'
          )" == ClusterIP ]]
          kubectl -n "$NAMESPACE" rollout status deployment/terraformers-jwks --timeout=2m
          test -s "$FIXTURE"

          if [[ "$OPERATION" == backend-live-validation-c2-stability || "$OPERATION" == a7-7-broad-v4-live-proof ]]; then
            runtime_source="$(
              kubectl -n "$NAMESPACE" exec deployment/terraformers-backend                 -c backend -- sh -c 'printf "%s" "$BUILD_SOURCE_REVISION"'
            )"
            [[ "$runtime_source" == "$BACKEND_SOURCE_SHA" ]] || {
              echo "Runtime source revision mismatch: $runtime_source" >&2
              exit 1
            }
          fi

          if [[ "$OPERATION" == a7-7-broad-v4-live-proof ]]; then
            test -s "$NEGATIVE_FIXTURE"
            [[ "$(sha256sum "$FIXTURE" | awk '{print $1}')" == a254981735b1060513251cfd9d6dcab82de8a818730f10b128d1c3904635c8c8 ]]
            [[ "$(sha256sum "$NEGATIVE_FIXTURE" | awk '{print $1}')" == 12eb8590b89eaea0988d5038c7a9862eebc584039d88084fe91433848a53d36d ]]

            [[ "$(
              kubectl -n "$NAMESPACE" get configmap terraformers-backend-runtime-config                 -o jsonpath='{.data.CORPUS_VERSION}'
            )" == terraformers-reference-v4 ]]
            [[ "$(
              kubectl -n "$NAMESPACE" get configmap terraformers-backend-runtime-config                 -o jsonpath='{.data.INDEX_NAME}'
            )" == terraformers-reference-v4 ]]
            [[ "$(
              kubectl -n "$NAMESPACE" get configmap terraformers-backend-runtime-config                 -o jsonpath='{.data.VERTEX_EMBEDDING_MODEL_ID}'
            )" == gemini-embedding-2 ]]
            [[ "$(
              kubectl -n "$NAMESPACE" get configmap terraformers-backend-runtime-config                 -o jsonpath='{.data.VERTEX_EMBEDDING_DIMENSION}'
            )" == 1536 ]]
            [[ "$(
              kubectl -n "$NAMESPACE" get configmap terraformers-backend-runtime-config                 -o jsonpath='{.data.EXPECTED_VECTOR_DIMENSION}'
            )" == 1536 ]]

            runtime_retrieval="$(
              kubectl -n "$NAMESPACE" exec deployment/terraformers-backend -c backend --                 sh -c 'printf "%s|%s|%s|%s|%s" "$CORPUS_VERSION" "$INDEX_NAME" "$VERTEX_EMBEDDING_MODEL_ID" "$VERTEX_EMBEDDING_DIMENSION" "$EXPECTED_VECTOR_DIMENSION"'
            )"
            [[ "$runtime_retrieval" == 'terraformers-reference-v4|terraformers-reference-v4|gemini-embedding-2|1536|1536' ]] || {
              echo "A7-7 backend runtime retrieval identity mismatch: $runtime_retrieval" >&2
              exit 1
            }

            mapping_json="$(
              kubectl -n "$NAMESPACE" exec deployment/terraformers-backend -c backend --                 curl -fsS http://terraformers-opensearch:9200/terraformers-reference-v4/_mapping
            )"
            v4_checksum="$(
              jq -r '."terraformers-reference-v4".mappings._meta.terraformers_corpus.checksum // empty'                 <<< "$mapping_json"
            )"
            [[ "$v4_checksum" =~ ^[0-9a-f]{64}$ ]] || {
              echo 'A7-7 v4 index is missing the immutable corpus checksum.' >&2
              exit 1
            }
            v4_corpus_version="$(
              jq -r '."terraformers-reference-v4".mappings._meta.terraformers_corpus.corpus_version // empty'                 <<< "$mapping_json"
            )"
            [[ "$v4_corpus_version" == terraformers-reference-v4 ]]

            count_json="$(
              kubectl -n "$NAMESPACE" exec deployment/terraformers-backend -c backend --                 curl -fsS -H 'Content-Type: application/json'                   -X POST http://terraformers-opensearch:9200/terraformers-reference-v4/_count                   -d '{"query":{"term":{"corpusVersion":"terraformers-reference-v4"}}}'
            )"
            [[ "$(jq -r '.count' <<< "$count_json")" == 5395 ]] || {
              echo "A7-7 v4 index document count mismatch: $(jq -r '.count' <<< "$count_json")" >&2
              exit 1
            }
            echo "A77_V4_CHECKSUM=$v4_checksum" >> "$GITHUB_ENV"
          fi

      - name: Prepare ephemeral authenticated JWT fixture
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          previous_jwks="${RUNNER_TEMP}/previous-jwks.json"
          private_key="${RUNNER_TEMP}/case-c-private.pem"
          modulus_bin="${RUNNER_TEMP}/case-c-modulus.bin"
          jwks="${RUNNER_TEMP}/case-c-jwks.json"
          token_file="${RUNNER_TEMP}/case-c-access.token"
          unsigned="${RUNNER_TEMP}/case-c-unsigned.token"
          signature="${RUNNER_TEMP}/case-c-signature.bin"
          kid="case-c-${GITHUB_RUN_ID}"

          kubectl -n "$NAMESPACE" get configmap terraformers-jwks             -o jsonpath='{.data.jwks\.json}' > "$previous_jwks"
          test -s "$previous_jwks"
          jq -e '.keys == []' "$previous_jwks" >/dev/null || {
            echo 'Refusing to replace a non-placeholder JWKS configuration.' >&2
            exit 1
          }

          # Reuse the already-proven M2 portable-authenticated JWT/JWK construction.
          b64url_file() {
            openssl base64 -A <"$1" | tr '+/' '-_' | tr -d '='
          }

          openssl genpkey             -algorithm RSA             -pkeyopt rsa_keygen_bits:2048             -pkeyopt rsa_keygen_pubexp:65537             -out "$private_key" 2>/dev/null

          modulus_hex="$(
            openssl rsa -in "$private_key" -noout -modulus 2>/dev/null | cut -d= -f2
          )"
          printf '%s' "$modulus_hex" | xxd -r -p > "$modulus_bin"
          modulus="$(b64url_file "$modulus_bin")"

          printf '{"keys":[{"kid":"%s","kty":"RSA","alg":"RS256","use":"sig","n":"%s","e":"AQAB"}]}'             "$kid" "$modulus" > "$jwks"

          kubectl -n "$NAMESPACE" create configmap terraformers-jwks             --from-file=jwks.json="$jwks"             --dry-run=client -o yaml             | kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout restart deployment/terraformers-jwks
          kubectl -n "$NAMESPACE" rollout status deployment/terraformers-jwks --timeout=2m

          served_jwks="$(
            kubectl -n "$NAMESPACE" exec deployment/terraformers-jwks --               wget -qO- http://127.0.0.1:8080/jwks.json
          )"
          jq -e --arg kid "$kid" --arg modulus "$modulus" '
            .keys | length == 1
            and .[0].kid == $kid
            and .[0].alg == "RS256"
            and .[0].n == $modulus
            and .[0].e == "AQAB"
          ' <<< "$served_jwks" >/dev/null

          service_visible=false
          for _ in $(seq 1 30); do
            backend_seen_jwks="$(
              kubectl -n "$NAMESPACE" exec deployment/terraformers-backend                 -c backend --                 curl -fsS http://terraformers-jwks:8080/jwks.json 2>/dev/null || true
            )"
            if jq -e --arg kid "$kid" --arg modulus "$modulus" '
              .keys | length == 1
              and .[0].kid == $kid
              and .[0].alg == "RS256"
              and .[0].n == $modulus
              and .[0].e == "AQAB"
            ' <<< "$backend_seen_jwks" >/dev/null 2>&1; then
              service_visible=true
              break
            fi
            sleep 1
          done
          [[ "$service_visible" == true ]] || {
            echo 'Backend pod did not observe the new JWKS through the Service path.' >&2
            exit 1
          }

          now="$(date +%s)"
          header="$(
            printf '{"alg":"RS256","kid":"%s","typ":"JWT"}' "$kid"               | openssl base64 -A | tr '+/' '-_' | tr -d '='
          )"
          token_ttl=900
          if [[ "$OPERATION" == backend-live-validation-c2-stability || "$OPERATION" == a7-7-broad-v4-live-proof ]]; then
            token_ttl=10800
          fi
          payload="$(
            printf '{"iss":"%s","sub":"%s","email":"%s","token_use":"access","client_id":"%s","iat":%s,"exp":%s}'               "$ISSUER_URI"               "case-c-${GITHUB_RUN_ID}"               "case-c-${GITHUB_RUN_ID}@example.test"               "$CLIENT_ID"               "$now"               "$((now + token_ttl))"               | openssl base64 -A | tr '+/' '-_' | tr -d '='
          )"
          printf '%s.%s' "$header" "$payload" > "$unsigned"
          openssl dgst -sha256 -sign "$private_key" -out "$signature" "$unsigned"
          printf '%s.%s' "$(cat "$unsigned")" "$(b64url_file "$signature")" > "$token_file"

      - name: Run authenticated integrated backend path
        if: inputs.operation == 'backend-live-validation'
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/case-c-access.token")"
          upload_json="${RUNNER_TEMP}/case-c-upload.json"
          upload_headers="${RUNNER_TEMP}/case-c-upload.headers"
          job_json="${RUNNER_TEMP}/case-c-job.json"
          draft_json="${RUNNER_TEMP}/case-c-draft.json"
          pf_log="${RUNNER_TEMP}/case-c-port-forward.log"

          kubectl -n "$NAMESPACE" port-forward service/terraformers-backend 18080:80             >"$pf_log" 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/actuator/health               | jq -e '.status == "UP"' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || {
            cat "$pf_log" >&2
            echo 'Backend port-forward did not become healthy.' >&2
            exit 1
          }

          upload_code="$(
            curl -sS -D "$upload_headers" -o "$upload_json" -w '%{http_code}'               -H "Authorization: Bearer ${token}"               -F "file=@${FIXTURE};type=image/webp"               -F "projectName=case-c-live-${GITHUB_RUN_ID}"               http://127.0.0.1:18080/api/upload
          )"
          [[ "$upload_code" == 201 ]] || {
            cat "$upload_json" >&2 || true
            grep -i '^www-authenticate:' "$upload_headers" >&2 || true
            kubectl -n "$NAMESPACE" logs deployment/terraformers-backend               --all-containers=true --tail=200 >&2 || true
            echo "Authenticated upload returned HTTP ${upload_code}, expected 201." >&2
            exit 1
          }

          jq -e '
            .storageProvider == "gcs"
            and .binaryPersisted == true
            and (.analysisJobId | type == "string" and length > 0)
            and (.projectId | type == "number")
            and (.sourceFileId | type == "number")
            and (.sourceBucket == "terraformers-runtime-objects-21647422237")
            and (.sourceKey | type == "string" and length > 0)
          ' "$upload_json" >/dev/null

          job_id="$(jq -r '.analysisJobId' "$upload_json")"
          project_id="$(jq -r '.projectId' "$upload_json")"

          terminal_status=""
          for _ in $(seq 1 240); do
            job_code="$(
              curl -sS -o "$job_json" -w '%{http_code}'                 -H "Authorization: Bearer ${token}"                 "http://127.0.0.1:18080/api/analysis/jobs/${job_id}"
            )"
            [[ "$job_code" == 200 ]] || {
              cat "$job_json" >&2 || true
              echo "AnalysisJob read returned HTTP ${job_code}, expected 200." >&2
              exit 1
            }

            terminal_status="$(jq -r '.status' "$job_json")"
            case "$terminal_status" in
              SUCCEEDED)
                break
                ;;
              FAILED)
                cat "$job_json" >&2
                backend_diagnostics="${RUNNER_TEMP}/case-c-backend-failure.log"
                kubectl -n "$NAMESPACE" logs deployment/terraformers-backend \
                  -c backend --since=10m >"$backend_diagnostics" 2>/dev/null || true
                awk -v job="analysisJobId=${job_id}" '
                  index($0, job) &&
                  $0 ~ /(analysis stage outcome=failure|Analysis job failed outcome=failed|Analysis retry scheduled|Analysis retry budget exhausted|Terraform draft validation failed|Terraform executable validation failed)/ { print }
                ' "$backend_diagnostics" >&2 || true
                echo 'Integrated analysis reached FAILED.' >&2
                exit 1
                ;;
              PENDING|RUNNING)
                sleep 5
                ;;
              *)
                cat "$job_json" >&2
                echo "Unexpected AnalysisJob status: ${terminal_status}" >&2
                exit 1
                ;;
            esac
          done
          [[ "$terminal_status" == SUCCEEDED ]] || {
            cat "$job_json" >&2 || true
            echo "AnalysisJob did not reach SUCCEEDED; final status=${terminal_status}." >&2
            exit 1
          }

          jq -e             --arg job_id "$job_id"             --argjson project_id "$project_id" '
              .id == $job_id
              and .projectId == $project_id
              and .status == "SUCCEEDED"
              and (.provider | type == "string" and length > 0)
              and (.resultFileId | type == "number")
              and (.resultObjectKey | type == "string" and length > 0)
              and (.failureReason == null)
            ' "$job_json" >/dev/null

          draft_code="$(
            curl -sS -o "$draft_json" -w '%{http_code}'               -H "Authorization: Bearer ${token}"               "http://127.0.0.1:18080/api/projects/${project_id}/terraform/main.tf"
          )"
          [[ "$draft_code" == 200 ]] || {
            cat "$draft_json" >&2 || true
            echo "Terraform draft read returned HTTP ${draft_code}, expected 200." >&2
            exit 1
          }
          result_key="$(jq -r '.resultObjectKey' "$job_json")"
          jq -e             --arg job_id "$job_id"             --arg result_key "$result_key" '
              .latestAnalysisJobId == $job_id
              and .latestResultObjectKey == $result_key
              and (.content | type == "string" and length > 0)
            ' "$draft_json" >/dev/null

          {
            echo '## Case C authenticated backend live validation'
            echo
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            echo '- Backend health: `UP`'
            echo '- Authenticated upload: `HTTP 201`'
            echo '- Source object provider: `gcs`'
            echo '- Source bytes persisted: `true`'
            printf -- '- AnalysisJob: `%s`\n' "$job_id"
            echo '- Terminal state: `SUCCEEDED`'
            printf -- '- Provider: `%s`\n' "$(jq -r '.provider' "$job_json")"
            printf -- '- Result object key: `%s`\n' "$result_key"
            echo '- Generated Terraform read through backend: `PASS`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run A7-7 broad v4 persisted-quality live proof
        if: inputs.operation == 'a7-7-broad-v4-live-proof'
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/case-c-access.token")"
          evidence_dir="${RUNNER_TEMP}/a7-7-live-proof"
          mkdir -p "$evidence_dir"

          positive_upload="${RUNNER_TEMP}/a7-7-positive-upload.json"
          positive_headers="${RUNNER_TEMP}/a7-7-positive-upload.headers"
          positive_job="${RUNNER_TEMP}/a7-7-positive-job.json"
          positive_draft="${RUNNER_TEMP}/a7-7-positive-draft.json"
          negative_upload="${RUNNER_TEMP}/a7-7-negative-upload.json"
          negative_headers="${RUNNER_TEMP}/a7-7-negative-upload.headers"
          negative_job="${RUNNER_TEMP}/a7-7-negative-job.json"
          negative_draft="${RUNNER_TEMP}/a7-7-negative-draft.json"
          metrics="${RUNNER_TEMP}/a7-7-metrics.txt"
          backend_log="${RUNNER_TEMP}/a7-7-backend.log"
          pf_log="${RUNNER_TEMP}/a7-7-port-forward.log"

          bounded_job() {
            jq '{
              id,
              projectId,
              status,
              provider,
              resultFileId,
              hasResultObjectKey: (.resultObjectKey != null),
              failureReason,
              quality
            }' "$1"
          }

          kubectl -n "$NAMESPACE" port-forward service/terraformers-backend 18080:80             >"$pf_log" 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/actuator/health                 | jq -e '.status == "UP"' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || {
            echo 'A7-7 backend port-forward did not become healthy.' >&2
            exit 1
          }

          positive_code="$(
            curl -sS -D "$positive_headers" -o "$positive_upload" -w '%{http_code}'               -H "Authorization: Bearer ${token}"               -F "file=@${FIXTURE};type=image/webp"               -F "projectName=a7-7-positive-${GITHUB_RUN_ID}"               http://127.0.0.1:18080/api/upload
          )"
          [[ "$positive_code" == 201 ]] || {
            echo "A7-7 positive upload returned HTTP ${positive_code}, expected 201." >&2
            exit 1
          }
          jq -e '
            .storageProvider == "gcs"
            and .binaryPersisted == true
            and (.analysisJobId | type == "string" and length > 0)
            and (.projectId | type == "number")
            and (.sourceFileId | type == "number")
            and .sourceBucket == "terraformers-runtime-objects-21647422237"
          ' "$positive_upload" >/dev/null

          positive_job_id="$(jq -r '.analysisJobId' "$positive_upload")"
          positive_project_id="$(jq -r '.projectId' "$positive_upload")"
          positive_terminal=""
          for _ in $(seq 1 240); do
            job_code="$(
              curl -sS -o "$positive_job" -w '%{http_code}'                 -H "Authorization: Bearer ${token}"                 "http://127.0.0.1:18080/api/analysis/jobs/${positive_job_id}"
            )"
            [[ "$job_code" == 200 ]] || {
              echo "A7-7 positive job read returned HTTP ${job_code}." >&2
              exit 1
            }
            positive_terminal="$(jq -r '.status' "$positive_job")"
            case "$positive_terminal" in
              SUCCEEDED) break ;;
              FAILED)
                echo 'A7-7 positive control reached FAILED; retaining bounded terminal evidence.' >&2
                bounded_job "$positive_job" >&2
                kubectl -n "$NAMESPACE" logs deployment/terraformers-backend                   -c backend --since=30m >"$backend_log" 2>/dev/null || true
                awk -v job="analysisJobId=${positive_job_id}" '
                  index($0, job) &&
                  $0 ~ /(reference retrieval outcome=|analysis stage outcome=failure|Analysis job failed outcome=failed|Analysis retry scheduled|Analysis retry budget exhausted|Terraform executable diagnostic)/ { print }
                ' "$backend_log" >&2 || true
                exit 1
                ;;
              PENDING|RUNNING) sleep 5 ;;
              *)
                echo "Unexpected A7-7 positive job status: ${positive_terminal}" >&2
                exit 1
                ;;
            esac
          done
          [[ "$positive_terminal" == SUCCEEDED ]] || {
            echo "A7-7 positive job did not reach SUCCEEDED: ${positive_terminal}" >&2
            exit 1
          }

          jq -e '
            .status == "SUCCEEDED"
            and (.provider | type == "string" and length > 0)
            and (.resultFileId | type == "number")
            and (.resultObjectKey | type == "string" and length > 0)
            and .failureReason == null
            and .quality != null
            and .quality.contractVersion == "evidence-quality-v1"
            and .quality.technicalStatus == "PASS"
            and .quality.knowledgeStatus == "COMPLETE"
            and .quality.qualityStatus != "NOT_APPLICABLE"
            and .quality.projectDecisionStatus != "NOT_APPLICABLE"
            and .quality.runtimeQualityBoundary == "CONDITIONAL_ON_EXTRACTED_FACTS"
            and (.quality.reasons | type == "array")
            and all(.quality.reasons[];
              . == "RESOURCE_UNKNOWN_TO_PROVIDER"
              or . == "OFFICIAL_KNOWLEDGE_NOT_AVAILABLE"
              or . == "REQUIRED_EVIDENCE_NOT_RETRIEVED"
              or . == "REQUIRED_PROJECT_DECISION_NOT_RETRIEVED"
              or . == "GENERATED_RESOURCE_UNSUPPORTED_BY_EVIDENCE"
              or . == "PROVIDER_CONTENT_BLOCKED"
              or . == "PROVIDER_OUTPUT_TRUNCATED"
              or . == "PROVIDER_EMPTY_RESPONSE"
              or . == "PROVIDER_TIMEOUT"
              or . == "PROVIDER_RATE_LIMITED"
              or . == "PROVIDER_ERROR"
              or . == "PROVIDER_SCHEMA_FAILURE"
              or . == "TERRAFORM_EXECUTABLE_FAILURE")
          ' "$positive_job" >/dev/null

          positive_draft_code="$(
            curl -sS -o "$positive_draft" -w '%{http_code}'               -H "Authorization: Bearer ${token}"               "http://127.0.0.1:18080/api/projects/${positive_project_id}/terraform/main.tf"
          )"
          [[ "$positive_draft_code" == 200 ]] || {
            echo "A7-7 positive Terraform read returned HTTP ${positive_draft_code}." >&2
            exit 1
          }
          jq -e             --arg job_id "$positive_job_id"             --arg result_key "$(jq -r '.resultObjectKey' "$positive_job")" '
            .latestAnalysisJobId == $job_id
            and .latestResultObjectKey == $result_key
            and (.content | type == "string" and length > 0)
          ' "$positive_draft" >/dev/null
          rm -f "$positive_draft"

          kubectl -n "$NAMESPACE" logs deployment/terraformers-backend             -c backend --since=30m >"$backend_log"
          positive_retrieval_line="$(
            grep -F "analysisJobId=${positive_job_id}" "$backend_log"               | grep -F 'Vertex reference retrieval outcome=success mode=REQUIRED corpusVersion=terraformers-reference-v4 referenceCount='               | tail -n 1 || true
          )"
          [[ -n "$positive_retrieval_line" ]] || {
            echo 'A7-7 positive job has no correlated v4 retrieval-success log.' >&2
            exit 1
          }
          positive_reference_count="$(
            sed -n 's/.*referenceCount=\([0-9][0-9]*\).*/\1/p' <<< "$positive_retrieval_line"
          )"
          [[ "$positive_reference_count" =~ ^[1-9][0-9]*$ ]] || {
            echo "A7-7 positive retrieval referenceCount is not positive: ${positive_reference_count:-missing}" >&2
            exit 1
          }

          negative_code="$(
            curl -sS -D "$negative_headers" -o "$negative_upload" -w '%{http_code}'               -H "Authorization: Bearer ${token}"               -F "file=@${NEGATIVE_FIXTURE};type=image/webp"               -F "projectName=a7-7-negative-${GITHUB_RUN_ID}"               http://127.0.0.1:18080/api/upload
          )"
          [[ "$negative_code" == 201 ]] || {
            echo "A7-7 negative upload returned HTTP ${negative_code}, expected 201." >&2
            exit 1
          }
          jq -e '
            .storageProvider == "gcs"
            and .binaryPersisted == true
            and (.analysisJobId | type == "string" and length > 0)
            and (.projectId | type == "number")
          ' "$negative_upload" >/dev/null

          negative_job_id="$(jq -r '.analysisJobId' "$negative_upload")"
          negative_project_id="$(jq -r '.projectId' "$negative_upload")"
          negative_terminal=""
          for _ in $(seq 1 240); do
            job_code="$(
              curl -sS -o "$negative_job" -w '%{http_code}'                 -H "Authorization: Bearer ${token}"                 "http://127.0.0.1:18080/api/analysis/jobs/${negative_job_id}"
            )"
            [[ "$job_code" == 200 ]] || {
              echo "A7-7 negative job read returned HTTP ${job_code}." >&2
              exit 1
            }
            negative_terminal="$(jq -r '.status' "$negative_job")"
            case "$negative_terminal" in
              FAILED) break ;;
              SUCCEEDED)
                echo 'A7-7 negative control unexpectedly reached SUCCEEDED.' >&2
                bounded_job "$negative_job" >&2
                exit 1
                ;;
              PENDING|RUNNING) sleep 5 ;;
              *)
                echo "Unexpected A7-7 negative job status: ${negative_terminal}" >&2
                exit 1
                ;;
            esac
          done
          [[ "$negative_terminal" == FAILED ]] || {
            echo "A7-7 negative job did not reach FAILED: ${negative_terminal}" >&2
            exit 1
          }

          jq -e '
            .status == "FAILED"
            and .resultFileId == null
            and .resultObjectKey == null
            and .quality != null
            and .quality.contractVersion == "evidence-quality-v1"
            and .quality.technicalStatus == "PASS"
            and .quality.knowledgeStatus == "NOT_APPLICABLE"
            and .quality.qualityStatus == "NOT_APPLICABLE"
            and .quality.projectDecisionStatus == "NOT_APPLICABLE"
            and .quality.runtimeQualityBoundary == "CONDITIONAL_ON_EXTRACTED_FACTS"
            and .quality.reasons == []
          ' "$negative_job" >/dev/null

          negative_draft_code="$(
            curl -sS -o "$negative_draft" -w '%{http_code}'               -H "Authorization: Bearer ${token}"               "http://127.0.0.1:18080/api/projects/${negative_project_id}/terraform/main.tf"
          )"
          [[ "$negative_draft_code" == 404 ]] || {
            echo "A7-7 negative Terraform read returned HTTP ${negative_draft_code}, expected 404." >&2
            exit 1
          }
          rm -f "$negative_draft"

          kubectl -n "$NAMESPACE" logs deployment/terraformers-backend             -c backend --since=30m >"$backend_log"
          grep -F "analysisJobId=${negative_job_id}" "$backend_log"             | grep -F 'Analysis job failed outcome=failed exceptionCategory=rejected_input'             >/dev/null || {
              echo 'A7-7 negative job has no correlated rejected_input terminal log.' >&2
              exit 1
            }

          curl -fsS http://127.0.0.1:18080/actuator/prometheus > "$metrics"
          grep '^terraformers_analysis_jobs_total{' "$metrics" >/dev/null
          grep '^terraformers_analysis_stage_duration_seconds_count{' "$metrics" >/dev/null
          grep '^terraformers_analysis_quality_terminal_total{' "$metrics"             | grep 'contract="evidence-quality-v1"'             | grep 'technical="PASS"' >/dev/null
          grep '^terraformers_analysis_quality_terminal_total{' "$metrics"             | grep 'contract="evidence-quality-v1"'             | grep 'knowledge="NOT_APPLICABLE"'             | grep 'quality="NOT_APPLICABLE"' >/dev/null
          grep '^terraformers_analysis_failures_total{' "$metrics"             | grep 'category="rejected_input"' >/dev/null

          jq -n             --arg source_sha "$GITHUB_SHA"             --arg backend_image "$BACKEND_IMAGE"             --arg backend_source_sha "$BACKEND_SOURCE_SHA"             --arg corpus_version "terraformers-reference-v4"             --arg index_name "terraformers-reference-v4"             --arg corpus_checksum "$A77_V4_CHECKSUM"             --arg positive_fixture_sha "a254981735b1060513251cfd9d6dcab82de8a818730f10b128d1c3904635c8c8"             --arg negative_fixture_sha "12eb8590b89eaea0988d5038c7a9862eebc584039d88084fe91433848a53d36d"             --arg positive_job_id "$positive_job_id"             --arg positive_status "$positive_terminal"             --argjson positive_reference_count "$positive_reference_count"             --arg positive_quality_contract "$(jq -r '.quality.contractVersion' "$positive_job")"             --arg positive_technical "$(jq -r '.quality.technicalStatus' "$positive_job")"             --arg positive_knowledge "$(jq -r '.quality.knowledgeStatus' "$positive_job")"             --arg positive_quality "$(jq -r '.quality.qualityStatus' "$positive_job")"             --arg positive_project_decision "$(jq -r '.quality.projectDecisionStatus' "$positive_job")"             --arg positive_runtime_boundary "$(jq -r '.quality.runtimeQualityBoundary' "$positive_job")"             --argjson positive_reasons "$(jq '.quality.reasons' "$positive_job")"             --arg negative_job_id "$negative_job_id"             --arg negative_status "$negative_terminal"             --arg negative_quality_contract "$(jq -r '.quality.contractVersion' "$negative_job")"             '{
              source_sha: $source_sha,
              backend_image: $backend_image,
              backend_source_sha: $backend_source_sha,
              corpus: {
                version: $corpus_version,
                index: $index_name,
                checksum: $corpus_checksum,
                document_count: 5395
              },
              fixtures: {
                positive_sha256: $positive_fixture_sha,
                negative_sha256: $negative_fixture_sha
              },
              positive: {
                analysis_job_id: $positive_job_id,
                terminal_status: $positive_status,
                retrieval_reference_count: $positive_reference_count,
                terraform_readable_nonempty: true,
                quality: {
                  contractVersion: $positive_quality_contract,
                  technicalStatus: $positive_technical,
                  knowledgeStatus: $positive_knowledge,
                  qualityStatus: $positive_quality,
                  projectDecisionStatus: $positive_project_decision,
                  runtimeQualityBoundary: $positive_runtime_boundary,
                  reasons: $positive_reasons
                }
              },
              negative: {
                analysis_job_id: $negative_job_id,
                terminal_status: $negative_status,
                terraform_result_absent: true,
                quality: {
                  contractVersion: $negative_quality_contract,
                  technicalStatus: "PASS",
                  knowledgeStatus: "NOT_APPLICABLE",
                  qualityStatus: "NOT_APPLICABLE",
                  projectDecisionStatus: "NOT_APPLICABLE",
                  runtimeQualityBoundary: "CONDITIONAL_ON_EXTRACTED_FACTS",
                  reasons: []
                }
              },
              observability: {
                jobs_metric_present: true,
                stage_metric_present: true,
                terminal_quality_metric_present: true,
                rejected_input_metric_present: true,
                positive_v4_retrieval_log_present: true,
                negative_rejected_input_log_present: true
              }
            }' > "$evidence_dir/evidence.json"

          {
            echo '## A7-7 broad v4 persisted-quality live proof'
            echo
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Backend image: `%s`\n' "$BACKEND_IMAGE"
            echo '- Corpus/index: `terraformers-reference-v4`'
            printf -- '- Corpus checksum: `%s`\n' "$A77_V4_CHECKSUM"
            echo '- Live v4 documents: `5395`'
            printf -- '- Positive AnalysisJob: `%s` / `SUCCEEDED`\n' "$positive_job_id"
            printf -- '- Positive retrieval references: `%s`\n' "$positive_reference_count"
            printf -- '- Positive quality: `%s / %s / %s / %s`\n'               "$(jq -r '.quality.technicalStatus' "$positive_job")"               "$(jq -r '.quality.knowledgeStatus' "$positive_job")"               "$(jq -r '.quality.qualityStatus' "$positive_job")"               "$(jq -r '.quality.projectDecisionStatus' "$positive_job")"
            printf -- '- Negative AnalysisJob: `%s` / `FAILED(rejected_input)`\n' "$negative_job_id"
            echo '- Negative quality: `PASS / NOT_APPLICABLE / NOT_APPLICABLE / NOT_APPLICABLE`'
            echo '- Negative Terraform result: `absent`'
            echo '- Raw prompt/image/reference/HCL/embedding content: not uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run C2 five-request repeated correctness stability gate
        if: inputs.operation == 'backend-live-validation-c2-stability'
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_sha }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
        run: |
          set -euo pipefail

          repeat_count=5
          [[ "$repeat_count" == 5 ]]
          expected_fixture_sha='a254981735b1060513251cfd9d6dcab82de8a818730f10b128d1c3904635c8c8'
          actual_fixture_sha="$(sha256sum "$FIXTURE" | awk '{print $1}')"
          [[ "$actual_fixture_sha" == "$expected_fixture_sha" ]] || {
            echo "C2 fixture SHA-256 mismatch: $actual_fixture_sha" >&2
            exit 1
          }

          artifact_dir="${RUNNER_TEMP}/case-c-c2-stability"
          attempts_jsonl="${artifact_dir}/attempts.jsonl"
          summary_json="${artifact_dir}/summary.json"
          runtime_json="${artifact_dir}/runtime-identity.json"
          mkdir -p "$artifact_dir"
          : > "$attempts_jsonl"

          backend_pod="$(
            kubectl -n "$NAMESPACE" get pods               -l app.kubernetes.io/name=terraformers-backend               -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
          )"
          [[ "$(printf '%s\n' "$backend_pod" | sed '/^$/d' | wc -l)" == 1 ]] || {
            echo 'C2 requires exactly one backend Pod.' >&2
            exit 1
          }
          backend_pod_uid="$(
            kubectl -n "$NAMESPACE" get pod "$backend_pod" -o jsonpath='{.metadata.uid}'
          )"
          backend_restart_count="$(
            kubectl -n "$NAMESPACE" get pod "$backend_pod"               -o jsonpath='{.status.containerStatuses[?(@.name=="backend")].restartCount}'
          )"
          [[ "$backend_restart_count" =~ ^[0-9]+$ ]]

          runtime_source="$(
            kubectl -n "$NAMESPACE" exec deployment/terraformers-backend               -c backend -- sh -c 'printf "%s" "$BUILD_SOURCE_REVISION"'
          )"
          [[ "$runtime_source" == "$BACKEND_SOURCE_SHA" ]]

          jq -n             --arg main_sha "$EXPECTED_MAIN_SHA"             --arg backend_image "$BACKEND_IMAGE"             --arg backend_source_sha "$BACKEND_SOURCE_SHA"             --arg fixture_sha256 "$actual_fixture_sha"             --arg backend_pod_uid "$backend_pod_uid"             --argjson backend_restart_count "$backend_restart_count"             --argjson repeat_count "$repeat_count"             '{
              main_sha: $main_sha,
              backend_image: $backend_image,
              backend_source_sha: $backend_source_sha,
              fixture_sha256: $fixture_sha256,
              backend_pod_uid: $backend_pod_uid,
              backend_restart_count: $backend_restart_count,
              repeat_count: $repeat_count,
              concurrency: 1
            }' > "$runtime_json"

          current_project_id=""
          current_job_id=""
          current_provider=""
          current_result_object_key=""
          current_failure_category=""

          record_failure() {
            local attempt="$1"
            local classification="$2"
            local reason="$3"
            local terminal_status="${4:-UNKNOWN}"
            jq -n               --argjson attempt "$attempt"               --arg classification "$classification"               --arg reason "$reason"               --arg terminal_status "$terminal_status"               --arg project_id "$current_project_id"               --arg analysis_job_id "$current_job_id"               --arg provider "$current_provider"               --arg result_object_key "$current_result_object_key"               --arg failure_category "$current_failure_category"               '{
                attempt: $attempt,
                accepted: false,
                classification: $classification,
                reason: $reason,
                terminal_status: $terminal_status,
                project_id: (if $project_id == "" then null else ($project_id | tonumber) end),
                analysis_job_id: (if $analysis_job_id == "" then null else $analysis_job_id end),
                provider: (if $provider == "" then null else $provider end),
                result_object_key: (if $result_object_key == "" then null else $result_object_key end),
                failure_category: (if $failure_category == "" then "unclassified" else $failure_category end)
              }' >> "$attempts_jsonl"
            jq -n               --arg classification "$classification"               --argjson failed_attempt "$attempt"               --argjson required_attempts "$repeat_count"               '{
                classification: $classification,
                passed: false,
                failed_attempt: $failed_attempt,
                accepted_attempts: ($failed_attempt - 1),
                required_attempts: $required_attempts,
                automatic_whole_gate_rerun: false
              }' > "$summary_json"
            echo "C2 gate stopped: classification=$classification attempt=$attempt reason=$reason" >&2
            exit 1
          }

          verify_runtime_identity() {
            local attempt="$1"
            local current_image current_source current_pod current_uid current_restarts
            current_image="$(
              kubectl -n "$NAMESPACE" get deployment terraformers-backend                 -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}'
            )"
            current_source="$(
              kubectl -n "$NAMESPACE" exec deployment/terraformers-backend                 -c backend -- sh -c 'printf "%s" "$BUILD_SOURCE_REVISION"'
            )"
            current_pod="$(
              kubectl -n "$NAMESPACE" get pods                 -l app.kubernetes.io/name=terraformers-backend                 -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
            )"
            if [[ "$(printf '%s\n' "$current_pod" | sed '/^$/d' | wc -l)" != 1 ]]; then
              record_failure "$attempt" RUNTIME_IDENTITY_DRIFT backend_pod_count_changed
            fi
            current_uid="$(kubectl -n "$NAMESPACE" get pod "$current_pod" -o jsonpath='{.metadata.uid}')"
            current_restarts="$(
              kubectl -n "$NAMESPACE" get pod "$current_pod"                 -o jsonpath='{.status.containerStatuses[?(@.name=="backend")].restartCount}'
            )"
            if [[ "$current_image" != "$BACKEND_IMAGE" ||
                  "$current_source" != "$BACKEND_SOURCE_SHA" ||
                  "$current_uid" != "$backend_pod_uid" ||
                  "$current_restarts" != "$backend_restart_count" ]]; then
              record_failure "$attempt" RUNTIME_IDENTITY_DRIFT backend_runtime_identity_changed
            fi
            [[ "$(
              kubectl -n "$NAMESPACE" get deployment terraformers-backend                 -o jsonpath='{.status.readyReplicas}'
            )" == 1 ]] || record_failure "$attempt" RUNTIME_IDENTITY_DRIFT ready_replicas_changed
            [[ "$(
              kubectl -n "$NAMESPACE" get deployment terraformers-backend                 -o jsonpath='{.status.availableReplicas}'
            )" == 1 ]] || record_failure "$attempt" RUNTIME_IDENTITY_DRIFT available_replicas_changed
          }

          token="$(cat "${RUNNER_TEMP}/case-c-access.token")"
          pf_log="${RUNNER_TEMP}/case-c-c2-port-forward.log"
          kubectl -n "$NAMESPACE" port-forward service/terraformers-backend 18080:80             >"$pf_log" 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" >/dev/null 2>&1 || true; wait "$pf_pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/actuator/health                 | jq -e '.status == "UP"' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || {
            jq -n               --arg classification RUNTIME_IDENTITY_DRIFT               --argjson required_attempts "$repeat_count"               '{
                classification: $classification,
                passed: false,
                failed_attempt: 0,
                accepted_attempts: 0,
                required_attempts: $required_attempts,
                automatic_whole_gate_rerun: false
              }' > "$summary_json"
            echo 'C2 backend port-forward did not become healthy.' >&2
            exit 1
          }

          for attempt in $(seq 1 "$repeat_count"); do
            verify_runtime_identity "$attempt"

            current_project_id=""
            current_job_id=""
            current_provider=""
            current_result_object_key=""
            current_failure_category=""

            upload_json="${RUNNER_TEMP}/case-c-c2-upload-${attempt}.json"
            upload_headers="${RUNNER_TEMP}/case-c-c2-upload-${attempt}.headers"
            job_json="${RUNNER_TEMP}/case-c-c2-job-${attempt}.json"
            draft_json="${RUNNER_TEMP}/case-c-c2-draft-${attempt}.json"
            project_name="case-c-c2-${GITHUB_RUN_ID}-${attempt}"

            upload_code="$(
              curl -sS -D "$upload_headers" -o "$upload_json" -w '%{http_code}'                 -H "Authorization: Bearer ${token}"                 -F "file=@${FIXTURE};type=image/webp"                 -F "projectName=${project_name}"                 http://127.0.0.1:18080/api/upload
            )"
            [[ "$upload_code" == 201 ]] ||               record_failure "$attempt" CORRECTNESS_FAILURE "upload_http_${upload_code}"

            if ! jq -e '
              .storageProvider == "gcs"
              and .binaryPersisted == true
              and (.analysisJobId | type == "string" and length > 0)
              and (.projectId | type == "number")
              and (.sourceFileId | type == "number")
              and (.sourceBucket == "terraformers-runtime-objects-21647422237")
              and (.sourceKey | type == "string" and length > 0)
            ' "$upload_json" >/dev/null; then
              record_failure "$attempt" CORRECTNESS_FAILURE upload_contract_mismatch
            fi

            job_id="$(jq -r '.analysisJobId' "$upload_json")"
            project_id="$(jq -r '.projectId' "$upload_json")"
            current_job_id="$job_id"
            current_project_id="$project_id"
            terminal_status=""

            for _ in $(seq 1 240); do
              job_code="$(
                curl -sS -o "$job_json" -w '%{http_code}'                   -H "Authorization: Bearer ${token}"                   "http://127.0.0.1:18080/api/analysis/jobs/${job_id}"
              )"
              [[ "$job_code" == 200 ]] ||                 record_failure "$attempt" CORRECTNESS_FAILURE "analysis_job_http_${job_code}"

              terminal_status="$(jq -r '.status' "$job_json")"
              case "$terminal_status" in
                SUCCEEDED)
                  break
                  ;;
                FAILED)
                  backend_diagnostics="${RUNNER_TEMP}/case-c-c2-backend-failure-${attempt}.log"
                  kubectl -n "$NAMESPACE" logs deployment/terraformers-backend                     -c backend --since=15m >"$backend_diagnostics" 2>/dev/null || true

                  terminal_category="$(
                    awk -v job="analysisJobId=${job_id}" '
                      index($0, job) && /Analysis job failed outcome=failed/ {
                        for (i = 1; i <= NF; i++) {
                          if ($i ~ /^exceptionCategory=[a-z0-9_]+$/) {
                            sub(/^exceptionCategory=/, "", $i)
                            value=$i
                          }
                        }
                      }
                      END { if (value != "") print value }
                    ' "$backend_diagnostics"
                  )"
                  stage_category="$(
                    awk -v job="analysisJobId=${job_id}" '
                      index($0, job) && /analysis stage outcome=failure/ {
                        for (i = 1; i <= NF; i++) {
                          if ($i ~ /^category=[a-z0-9_]+$/) {
                            sub(/^category=/, "", $i)
                            value=$i
                          }
                        }
                      }
                      END { if (value != "") print value }
                    ' "$backend_diagnostics"
                  )"
                  observed_category="${terminal_category:-$stage_category}"
                  observed_error_class="$(
                    awk -v job="analysisJobId=${job_id}" '
                      index($0, job) && /analysis stage outcome=failure/ {
                        for (i = 1; i <= NF; i++) {
                          if ($i ~ /^errorClass=[A-Za-z0-9_.$]+$/) {
                            sub(/^errorClass=/, "", $i)
                            value=$i
                          }
                        }
                      }
                      END { if (value != "") print value }
                    ' "$backend_diagnostics"
                  )"
                  if [[ "$observed_error_class" == GeneratedTerraformContractViolation ]]; then
                    case "$observed_category" in
                      generated_terraform_contract_module|generated_terraform_contract_provider)
                        current_failure_category="$observed_category"
                        ;;
                      *)
                        current_failure_category="unclassified"
                        ;;
                    esac
                  else
                    case "$observed_category" in
                      terraform_init_timeout|terraform_provider_closure|terraform_init_configuration|terraform_validate_timeout|terraform_validate_configuration|terraform_internal|provider_rate_limited|result_finalization|truncated_output|rejected_input|response_format|timeout|executor_rejected|validation|other)
                        current_failure_category="$observed_category"
                        ;;
                      *)
                        current_failure_category="unclassified"
                        ;;
                    esac
                  fi

                  if [[ "$current_failure_category" == provider_rate_limited ]] || \
                     [[ "$current_failure_category" == timeout && "$observed_error_class" == AnalysisProviderTimeoutException ]]; then
                    record_failure "$attempt" EXTERNAL_VARIANCE_INCONCLUSIVE external_provider_failure FAILED
                  fi
                  record_failure "$attempt" CORRECTNESS_FAILURE integrated_analysis_failed FAILED
                  ;;
                PENDING|RUNNING)
                  sleep 5
                  ;;
                *)
                  record_failure "$attempt" CORRECTNESS_FAILURE unexpected_analysis_job_status "$terminal_status"
                  ;;
              esac
            done

            [[ "$terminal_status" == SUCCEEDED ]] ||               record_failure "$attempt" CORRECTNESS_FAILURE terminal_success_timeout "$terminal_status"

            if ! jq -e               --arg job_id "$job_id"               --argjson project_id "$project_id" '
                .id == $job_id
                and .projectId == $project_id
                and .status == "SUCCEEDED"
                and (.provider | type == "string" and length > 0)
                and (.resultFileId | type == "number")
                and (.resultObjectKey | type == "string" and length > 0)
                and (.failureReason == null)
              ' "$job_json" >/dev/null; then
              record_failure "$attempt" CORRECTNESS_FAILURE terminal_job_contract_mismatch SUCCEEDED
            fi

            draft_code="$(
              curl -sS -o "$draft_json" -w '%{http_code}'                 -H "Authorization: Bearer ${token}"                 "http://127.0.0.1:18080/api/projects/${project_id}/terraform/main.tf"
            )"
            [[ "$draft_code" == 200 ]] ||               record_failure "$attempt" CORRECTNESS_FAILURE "terraform_draft_http_${draft_code}" SUCCEEDED

            result_key="$(jq -r '.resultObjectKey' "$job_json")"
            current_provider="$(jq -r '.provider' "$job_json")"
            current_result_object_key="$result_key"
            if ! jq -e               --arg job_id "$job_id"               --arg result_key "$result_key" '
                .latestAnalysisJobId == $job_id
                and .latestResultObjectKey == $result_key
                and (.content | type == "string" and length > 0)
              ' "$draft_json" >/dev/null; then
              record_failure "$attempt" CORRECTNESS_FAILURE terraform_result_contract_mismatch SUCCEEDED
            fi

            verify_runtime_identity "$attempt"

            provider="$current_provider"
            jq -n               --argjson attempt "$attempt"               --arg project_name "$project_name"               --argjson project_id "$project_id"               --arg analysis_job_id "$job_id"               --arg terminal_status "$terminal_status"               --arg provider "$provider"               --arg result_object_key "$result_key"               '{
                attempt: $attempt,
                accepted: true,
                classification: "PASS",
                project_name: $project_name,
                project_id: $project_id,
                analysis_job_id: $analysis_job_id,
                terminal_status: $terminal_status,
                failure_reason_is_null: true,
                provider: $provider,
                result_object_key: $result_object_key,
                terraform_result_readable_nonempty: true
              }' >> "$attempts_jsonl"
          done

          accepted_attempts="$(jq -s '[.[] | select(.accepted == true)] | length' "$attempts_jsonl")"
          [[ "$accepted_attempts" == "$repeat_count" ]] || {
            echo "C2 accepted attempt count mismatch: $accepted_attempts" >&2
            exit 1
          }

          verify_runtime_identity "$repeat_count"

          jq -n             --argjson accepted_attempts "$accepted_attempts"             --argjson required_attempts "$repeat_count"             '{
              classification: "PASS",
              passed: true,
              accepted_attempts: $accepted_attempts,
              required_attempts: $required_attempts,
              concurrency: 1,
              automatic_whole_gate_rerun: false
            }' > "$summary_json"

          {
            echo '## Case C C2 repeated correctness stability gate'
            echo
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            echo '- Sequential attempts: `5/5`'
            echo '- Concurrency: `1`'
            echo '- Runtime identity drift: `0`'
            echo '- Unexpected backend restart: `0`'
            echo '- Result: `PASS`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore placeholder JWKS fixture
        if: always()
        run: |
          set -euo pipefail
          previous_jwks="${RUNNER_TEMP}/previous-jwks.json"
          if [[ -s "$previous_jwks" ]]; then
            kubectl -n "$NAMESPACE" create configmap terraformers-jwks               --from-file=jwks.json="$previous_jwks"               --dry-run=client -o yaml               | kubectl apply -f -
            kubectl -n "$NAMESPACE" rollout restart deployment/terraformers-jwks
            kubectl -n "$NAMESPACE" rollout status deployment/terraformers-jwks --timeout=2m
          fi

      - name: Upload bounded A7-7 live-proof evidence
        if: ${{ always() && inputs.operation == 'a7-7-broad-v4-live-proof' }}
        uses: actions/upload-artifact@v5
        with:
          name: case-a-a7-7-live-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/a7-7-live-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Upload sanitized C2 stability evidence
        if: ${{ always() && inputs.operation == 'backend-live-validation-c2-stability' }}
        uses: actions/upload-artifact@v5
        with:
          name: case-c-c2-stability-${{ github.run_id }}
          path: ${{ runner.temp }}/case-c-c2-stability
          if-no-files-found: error
          retention-days: 14

  runtime-live-acceptance:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'runtime-live-acceptance'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 30
    env:
      PROJECT_ID: terraformers-platform
      ZONE: asia-northeast3-a
      NAMESPACE: terraformers-target
      MARIADB_INSTANCE: terraformers-mariadb
      RUNTIME_BUCKET: terraformers-runtime-objects-21647422237
      BACKEND_IMAGE: asia-northeast3-docker.pkg.dev/terraformers-platform/terraformers-backend/terraformers-backend@sha256:a9331bc8026075390cedd8bfcdc8625b5cc69cdf16cd3799e2029beff6f857ae
      MARIADB_IMAGE: ${{ inputs.mariadb_image }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted live-acceptance request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMATION" == RUN_REVIEWED_GCP_RUNTIME_LIVE_ACCEPTANCE_RESTART ]]
          [[ "$MARIADB_IMAGE" =~ ^mariadb:11\.4@sha256:[0-9a-f]{64}$ ]]

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: terraformers-platform
          cluster_name: terraformers-target
          location: asia-northeast3-a

      - name: Verify boundary and prepare probes
        run: |
          set -euo pipefail

          [[ "$(
            gcloud container clusters describe terraformers-target \
              --zone="$ZONE" --project="$PROJECT_ID" \
              --format='value(secretSyncConfig.enabled)'
          )" == True ]]
          [[ "$(
            gcloud compute instances describe "$MARIADB_INSTANCE" \
              --zone="$ZONE" --project="$PROJECT_ID" \
              --format='value(status)'
          )" == RUNNING ]]
          [[ "$(
            gcloud container node-pools describe terraformers-target-primary \
              --cluster=terraformers-target --zone="$ZONE" --project="$PROJECT_ID" \
              --format='value(config.workloadMetadataConfig.mode)'
          )" == GKE_METADATA ]]
          [[ "$(
            gcloud storage buckets describe "gs://$RUNTIME_BUCKET" \
              --format='value(public_access_prevention)'
          )" == enforced ]]
          [[ "$(
            gcloud storage buckets describe "gs://$RUNTIME_BUCKET" \
              --format='value(uniform_bucket_level_access)'
          )" == True ]]

          bucket_policy="$(mktemp)"
          gcloud storage buckets get-iam-policy "gs://$RUNTIME_BUCKET" --format=json > "$bucket_policy"
          if jq -e '
            any(.bindings[]?.members[]?;
              . == "allUsers" or . == "allAuthenticatedUsers"
            )
          ' "$bucket_policy" >/dev/null; then
            echo 'Runtime bucket unexpectedly has a public IAM principal.' >&2
            exit 1
          fi

          startup="$(
            gcloud compute instances describe "$MARIADB_INSTANCE" \
              --zone="$ZONE" --project="$PROJECT_ID" --format=json \
              | jq -r '.metadata.items[]? | select(.key == "startup-script") | .value'
          )"
          grep -Fq "MARIADB_IMAGE=\"$MARIADB_IMAGE\"" <<< "$startup"
          grep -Fq '/var/lib/mysql' <<< "$startup"
          grep -Fq 'docker rm -f terraformers-mariadb' <<< "$startup"

          kubectl -n "$NAMESPACE" get secret terraformers-backend-runtime-secrets -o json \
            | jq -e '.data.SPRING_DATASOURCE_PASSWORD | type == "string" and length > 0' >/dev/null
          kubectl -n "$NAMESPACE" get endpointslice terraformers-mariadb >/dev/null
          if kubectl -n "$NAMESPACE" get deployment terraformers-backend >/dev/null 2>&1; then
            echo 'Backend Deployment must remain absent during live acceptance.' >&2
            exit 1
          fi

          kubectl -n "$NAMESPACE" apply -f infra/kubernetes/base/backend-serviceaccount.yaml >/dev/null

          gcs_pod="case-c-gcs-${GITHUB_RUN_ID}"
          db_pod="case-c-db-${GITHUB_RUN_ID}"
          echo "GCS_POD=$gcs_pod" >> "$GITHUB_ENV"
          echo "DB_POD=$db_pod" >> "$GITHUB_ENV"

          kubectl -n "$NAMESPACE" delete pod "$gcs_pod" "$db_pod" \
            --ignore-not-found --wait=false >/dev/null 2>&1 || true

          kubectl -n "$NAMESPACE" run "$gcs_pod" \
            --image="$BACKEND_IMAGE" \
            --restart=Never \
            --overrides='{"spec":{"serviceAccountName":"terraformers-backend"}}' \
            --command -- /bin/sh -c 'sleep 1800'

          cat <<EOF | kubectl apply -f - >/dev/null
          apiVersion: v1
          kind: Pod
          metadata:
            name: $db_pod
            namespace: $NAMESPACE
          spec:
            restartPolicy: Never
            containers:
              - name: mariadb-client
                image: $MARIADB_IMAGE
                imagePullPolicy: IfNotPresent
                env:
                  - name: MYSQL_PWD
                    valueFrom:
                      secretKeyRef:
                        name: terraformers-backend-runtime-secrets
                        key: SPRING_DATASOURCE_PASSWORD
                command: ["/bin/sh", "-c", "sleep 1800"]
          EOF

          kubectl -n "$NAMESPACE" wait --for=condition=Ready "pod/$gcs_pod" --timeout=3m
          kubectl -n "$NAMESPACE" wait --for=condition=Ready "pod/$db_pod" --timeout=3m

      - name: Verify GCS through backend workload identity
        run: |
          set -euo pipefail
          object="case-c-live-acceptance-${GITHUB_RUN_ID}.txt"
          payload="case-c-live-acceptance-${GITHUB_SHA}"

          kubectl -n "$NAMESPACE" exec "$GCS_POD" -- \
            env BUCKET="$RUNTIME_BUCKET" OBJECT="$object" PAYLOAD="$payload" /bin/sh -ec '
              token_json="$(
                curl -fsS --retry 20 --retry-delay 2 \
                  -H "Metadata-Flavor: Google" \
                  "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token"
              )"
              access_token="$(printf "%s" "$token_json" | sed -n "s/.*\"access_token\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p")"
              test -n "$access_token"

              printf "%s" "$PAYLOAD" \
                | curl -fsS -X POST \
                    -H "Authorization: Bearer $access_token" \
                    -H "Content-Type: text/plain" \
                    --data-binary @- \
                    "https://storage.googleapis.com/upload/storage/v1/b/$BUCKET/o?uploadType=media&name=$OBJECT" \
                    >/dev/null

              actual="$(
                curl -fsS -H "Authorization: Bearer $access_token" \
                  "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$OBJECT?alt=media"
              )"
              test "$actual" = "$PAYLOAD"

              curl -fsS -X DELETE \
                -H "Authorization: Bearer $access_token" \
                "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$OBJECT" \
                >/dev/null

              status="$(
                curl -sS -o /dev/null -w "%{http_code}" \
                  -H "Authorization: Bearer $access_token" \
                  "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$OBJECT"
              )"
              test "$status" = 404
            '

      - name: Verify MariaDB persistence across VM restart
        timeout-minutes: 10
        run: |
          set -euo pipefail
          marker="case-c-${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}"

          db() {
            kubectl -n "$NAMESPACE" exec "$DB_POD" -- \
              timeout 8 mariadb --connect-timeout=5 --protocol=TCP -h terraformers-mariadb -P 3306 \
                -u terraformers terraformers --batch --skip-column-names "$@"
          }

          ready=false
          for _ in $(seq 1 30); do
            if db -e 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]

          db -e "CREATE TABLE IF NOT EXISTS case_c_runtime_acceptance_marker (
                    id VARCHAR(128) PRIMARY KEY,
                    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
                  );
                  INSERT INTO case_c_runtime_acceptance_marker(id)
                  VALUES ('$marker')
                  ON DUPLICATE KEY UPDATE id = VALUES(id);"

          before_ip="$(
            gcloud compute instances describe "$MARIADB_INSTANCE" \
              --zone="$ZONE" --project="$PROJECT_ID" \
              --format='value(networkInterfaces[0].networkIP)'
          )"
          endpoint_ip="$(kubectl -n "$NAMESPACE" get endpointslice terraformers-mariadb -o jsonpath='{.endpoints[0].addresses[0]}')"
          [[ "$before_ip" == "$endpoint_ip" ]]

          gcloud compute instances stop "$MARIADB_INSTANCE" \
            --zone="$ZONE" --project="$PROJECT_ID" --quiet
          gcloud compute instances start "$MARIADB_INSTANCE" \
            --zone="$ZONE" --project="$PROJECT_ID" --quiet

          [[ "$(
            gcloud compute instances describe "$MARIADB_INSTANCE" \
              --zone="$ZONE" --project="$PROJECT_ID" \
              --format='value(networkInterfaces[0].networkIP)'
          )" == "$before_ip" ]]

          persisted=false
          for _ in $(seq 1 30); do
            marker_result="$(db -e "SELECT id FROM case_c_runtime_acceptance_marker WHERE id='$marker';" 2>/dev/null || true)"
            if [[ "$marker_result" == "$marker" ]]; then
              persisted=true
              break
            fi
            sleep 2
          done
          [[ "$persisted" == true ]] || {
            echo 'Marker persistence/reconnect acceptance failed.' >&2
            exit 1
          }

          db -e 'DROP TABLE IF EXISTS case_c_runtime_acceptance_marker;'

          {
            echo '## Case C runtime live acceptance'
            echo
            echo '- Backend KSA GCS write/read/delete: PASS'
            echo '- Private GKE -> MariaDB path: PASS'
            echo '- Marker row survived VM stop/start: PASS'
            echo '- MariaDB reconnected after VM restart: PASS'
            echo '- Temporary GCS object and DB marker table cleaned: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify final runtime boundary
        run: |
          set -euo pipefail
          [[ "$(
            gcloud storage buckets describe "gs://$RUNTIME_BUCKET" \
              --format='value(public_access_prevention)'
          )" == enforced ]]
          [[ "$(
            gcloud storage buckets describe "gs://$RUNTIME_BUCKET" \
              --format='value(uniform_bucket_level_access)'
          )" == True ]]
          kubectl -n "$NAMESPACE" get secret terraformers-backend-runtime-secrets -o json \
            | jq -e '.data.SPRING_DATASOURCE_PASSWORD | type == "string" and length > 0' >/dev/null
          kubectl -n "$NAMESPACE" get serviceaccount terraformers-backend >/dev/null
          kubectl -n "$NAMESPACE" get endpointslice terraformers-mariadb >/dev/null
          if kubectl -n "$NAMESPACE" get deployment terraformers-backend >/dev/null 2>&1; then
            echo 'Backend Deployment was unexpectedly created.' >&2
            exit 1
          fi
          {
            echo '- Runtime bucket private/PAP/UBLA: PASS'
            echo '- Secret Sync DB-password key present; value not printed'
            echo '- Backend Deployment absent'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recover runtime and clean temporary acceptance state
        if: always()
        run: |
          set +e

          object="case-c-live-acceptance-${GITHUB_RUN_ID}.txt"
          gcloud storage rm "gs://$RUNTIME_BUCKET/$object" --quiet >/dev/null 2>&1 || true

          status="$(
            gcloud compute instances describe "$MARIADB_INSTANCE" \
              --zone="$ZONE" --project="$PROJECT_ID" \
              --format='value(status)' 2>/dev/null
          )"

          if [[ "$status" == STOPPING ]]; then
            for _ in $(seq 1 60); do
              status="$(
                gcloud compute instances describe "$MARIADB_INSTANCE" \
                  --zone="$ZONE" --project="$PROJECT_ID" \
                  --format='value(status)' 2>/dev/null
              )"
              [[ "$status" == TERMINATED ]] && break
              sleep 2
            done
          fi

          if [[ "$status" == TERMINATED ]]; then
            for _ in 1 2 3; do
              gcloud compute instances start "$MARIADB_INSTANCE" \
                --zone="$ZONE" --project="$PROJECT_ID" --quiet && break
              sleep 5
            done
          fi

          for _ in $(seq 1 60); do
            status="$(
              gcloud compute instances describe "$MARIADB_INSTANCE" \
                --zone="$ZONE" --project="$PROJECT_ID" \
                --format='value(status)' 2>/dev/null
            )"
            [[ "$status" == RUNNING ]] && break
            sleep 2
          done
          if [[ "$status" != RUNNING ]]; then
            echo "ERROR: MariaDB VM recovery did not reach RUNNING; status=$status" >&2
          fi

          db_pod="${DB_POD:-case-c-db-${GITHUB_RUN_ID}}"
          if kubectl -n "$NAMESPACE" get pod "$db_pod" >/dev/null 2>&1; then
            for _ in $(seq 1 60); do
              if kubectl -n "$NAMESPACE" exec "$db_pod" -- \
                timeout 8 mariadb --connect-timeout=5 --protocol=TCP -h terraformers-mariadb -P 3306 \
                  -u terraformers terraformers --batch --skip-column-names \
                  -e 'DROP TABLE IF EXISTS case_c_runtime_acceptance_marker;' \
                  >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
          fi

          kubectl -n "$NAMESPACE" delete pod \
            "${GCS_POD:-case-c-gcs-${GITHUB_RUN_ID}}" \
            "$db_pod" \
            --ignore-not-found --wait=false >/dev/null 2>&1 || true

          [[ "$status" == RUNNING ]] || exit 1


  capacity-baseline:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'capacity-baseline'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 120
    env:
      PROJECT_ID: terraformers-platform
      ZONE: asia-northeast3-a
      NAMESPACE: terraformers-target
      ISSUER_URI: https://identity.example.test/case-c
      CLIENT_ID: case-c-runtime-client
      FIXTURE: evaluation/terraformers-eval-v1/fixtures/case-01-vpc-three-tier.webp

    steps:
      - uses: actions/checkout@v5

      - name: Validate protected capacity-baseline request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Approved SHA does not match checked-out main.' >&2
            exit 1
          }
          [[ "$CONFIRMATION" == RUN_REVIEWED_CASE_C_CAPACITY_BASELINE_1 ]] || {
            echo 'Capacity baseline requires confirmation RUN_REVIEWED_CASE_C_CAPACITY_BASELINE_1.' >&2
            exit 1
          }
          [[ "$BACKEND_IMAGE" =~ ^asia-northeast3-docker\.pkg\.dev/terraformers-platform/terraformers-backend/terraformers-backend@sha256:[0-9a-f]{64}$ ]] || {
            echo 'capacity-baseline requires an exact immutable backend_image.' >&2
            exit 1
          }
          [[ "$BACKEND_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'capacity-baseline requires an exact backend_source_sha.' >&2
            exit 1
          }

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: terraformers-platform
          cluster_name: terraformers-target
          location: asia-northeast3-a

      - name: Prepare temporary authenticated JWT fixture
        run: |
          set -euo pipefail
          previous_jwks="${RUNNER_TEMP}/previous-jwks.json"
          private_key="${RUNNER_TEMP}/case-c-private.pem"
          modulus_bin="${RUNNER_TEMP}/case-c-modulus.bin"
          jwks="${RUNNER_TEMP}/case-c-jwks.json"
          token_file="${RUNNER_TEMP}/case-c-access.token"
          unsigned="${RUNNER_TEMP}/case-c-unsigned.token"
          signature="${RUNNER_TEMP}/case-c-signature.bin"
          kid="case-c-capacity-${GITHUB_RUN_ID}"

          kubectl -n "$NAMESPACE" get configmap terraformers-jwks \
            -o jsonpath='{.data.jwks\.json}' > "$previous_jwks"
          test -s "$previous_jwks"
          jq -e '.keys == []' "$previous_jwks" >/dev/null || {
            echo 'Refusing to replace a non-placeholder JWKS configuration.' >&2
            exit 1
          }

          b64url_file() { openssl base64 -A <"$1" | tr '+/' '-_' | tr -d '='; }
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -pkeyopt rsa_keygen_pubexp:65537 -out "$private_key" 2>/dev/null
          modulus_hex="$(openssl rsa -in "$private_key" -noout -modulus 2>/dev/null | cut -d= -f2)"
          printf '%s' "$modulus_hex" | xxd -r -p > "$modulus_bin"
          modulus="$(b64url_file "$modulus_bin")"
          printf '{"keys":[{"kid":"%s","kty":"RSA","alg":"RS256","use":"sig","n":"%s","e":"AQAB"}]}' \
            "$kid" "$modulus" > "$jwks"

          kubectl -n "$NAMESPACE" create configmap terraformers-jwks \
            --from-file=jwks.json="$jwks" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout restart deployment/terraformers-jwks
          kubectl -n "$NAMESPACE" rollout status deployment/terraformers-jwks --timeout=2m

          service_visible=false
          for _ in $(seq 1 30); do
            backend_seen_jwks="$(kubectl -n "$NAMESPACE" exec deployment/terraformers-backend \
              -c backend -- curl -fsS http://terraformers-jwks:8080/jwks.json 2>/dev/null || true)"
            if jq -e --arg kid "$kid" --arg modulus "$modulus" '
              .keys | length == 1 and .[0].kid == $kid and .[0].alg == "RS256"
              and .[0].n == $modulus and .[0].e == "AQAB"
            ' <<< "$backend_seen_jwks" >/dev/null 2>&1; then service_visible=true; break; fi
            sleep 1
          done
          [[ "$service_visible" == true ]] || {
            echo 'Backend pod did not observe the new JWKS through the Service path.' >&2
            exit 1
          }

          now="$(date +%s)"
          header="$(printf '{"alg":"RS256","kid":"%s","typ":"JWT"}' "$kid" | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          payload="$(printf '{"iss":"%s","sub":"%s","email":"%s","token_use":"access","client_id":"%s","iat":%s,"exp":%s}' \
            "$ISSUER_URI" "case-c-capacity-${GITHUB_RUN_ID}" "case-c-capacity-${GITHUB_RUN_ID}@example.test" \
            "$CLIENT_ID" "$now" "$((now + 10800))" | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          printf '%s.%s' "$header" "$payload" > "$unsigned"
          openssl dgst -sha256 -sign "$private_key" -out "$signature" "$unsigned"
          printf '%s.%s' "$(cat "$unsigned")" "$(b64url_file "$signature")" > "$token_file"
          chmod 600 "$token_file"

      - name: Run frozen closed-loop capacity baseline
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BACKEND_IMAGE: ${{ inputs.backend_image }}
          EXPECTED_BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
          TOKEN_FILE: ${{ runner.temp }}/case-c-access.token
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RUNNER_TEMP}/case-c-capacity-baseline"
          export ARTIFACT_DIR
          pf_log="${RUNNER_TEMP}/case-c-capacity-port-forward.log"
          kubectl -n "$NAMESPACE" port-forward service/terraformers-backend 18080:80 >"$pf_log" 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" >/dev/null 2>&1 || true; wait "$pf_pid" >/dev/null 2>&1 || true' EXIT
          ready=false
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/actuator/health > /dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          [[ "$ready" == true ]] || { cat "$pf_log" >&2; exit 1; }
          bash scripts/checks/case-c-capacity-baseline.sh

      - name: Restore placeholder JWKS fixture
        if: always()
        run: |
          set -euo pipefail
          previous_jwks="${RUNNER_TEMP}/previous-jwks.json"
          if [[ -s "$previous_jwks" ]]; then
            kubectl -n "$NAMESPACE" create configmap terraformers-jwks \
              --from-file=jwks.json="$previous_jwks" --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n "$NAMESPACE" rollout restart deployment/terraformers-jwks
            kubectl -n "$NAMESPACE" rollout status deployment/terraformers-jwks --timeout=2m
          fi
          rm -f "${RUNNER_TEMP}/case-c-private.pem" "${RUNNER_TEMP}/case-c-access.token" \
            "${RUNNER_TEMP}/case-c-unsigned.token" "${RUNNER_TEMP}/case-c-signature.bin"

      - name: Upload sanitized capacity evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: case-c-capacity-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/case-c-capacity-baseline
          if-no-files-found: error
          retention-days: 14

      - name: Summarize capacity baseline
        if: always()
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RUNNER_TEMP}/case-c-capacity-baseline"
          summary="${ARTIFACT_DIR}/summary.json"
          saturation="${ARTIFACT_DIR}/saturation-classification.json"
          {
            echo '## Case C capacity baseline'
            echo
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            echo '- Workload: closed-loop AnalysisJob concurrency `1 → 2 → 4 → 6 → 8`'
            echo '- Timing: 30s pre-sample / 240s active / 600s drain / 5s metrics sample'
            if [[ -s "$summary" && -s "$saturation" ]]; then
              printf -- '- Real analysis requests: `%s`\n' "$(jq -r '.real_analysis_requests' "$summary")"
              printf -- '- Classification: `%s`\n' "$(jq -r '.classification' "$saturation")"
              printf -- '- Executed steps: `%s`\n' "$(jq -r '.executed_steps | join(",")' "$saturation")"
            else
              echo '- Result: `INCOMPLETE`; inspect the sanitized artifact and failed step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
