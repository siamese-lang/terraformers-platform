apiVersion: v1
kind: Service
metadata:
  name: terraformers-frontend-hosted
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "terraformers-frontend-hosted"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: terraformers-frontend-hosted
  ports:
    - name: http
      port: 80
      targetPort: http
