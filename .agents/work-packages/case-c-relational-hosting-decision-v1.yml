    - create_VM
    - create_disk
    - create_bucket
    - create_registry
    - mutate_IAM
    - terraform_plan
    - terraform_apply
    - kubernetes_apply
    - start_load_test
    - start_next_work_package

  acceptance_criteria:
    - MySQL_8_4_failure_is_preserved_as_the_reason_Cloud_SQL_is_not_drop_in
    - MariaDB_contract_is_retained
    - dedicated_VM_is_selected_over_GKE_StatefulSet_for_bottleneck_attribution
    - containerized_MariaDB_is_selected_over_direct_host_package_install
    - persistent_DB_disk_is_required
    - public_MariaDB_exposure_is_forbidden
    - e2_medium_and_20_GiB_pd_balanced_are_candidates_only_until_preflight
