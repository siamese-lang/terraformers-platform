name: M1 Cloud Decoupling Closure Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      boundary_contract: ${{ steps.scope.outputs.boundary_contract }}
      backend_regression: ${{ steps.scope.outputs.backend_regression }}
      mariadb_regression: ${{ steps.scope.outputs.mariadb_regression }}
      frontend_regression: ${{ steps.scope.outputs.frontend_regression }}
      runtime_contract: ${{ steps.scope.outputs.runtime_contract }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/checks/ci_changed_scope.py --workflow m1 --all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/checks/ci_changed_scope.py --workflow m1 --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  boundary-contract:
    needs: scope
    if: needs.scope.outputs.boundary_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify M1 source boundaries
        run: python3 scripts/checks/m1-cloud-decoupling-closure-verification.py
      - name: Upload boundary evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m1-cloud-decoupling-boundary-evidence
          path: artifacts/m1-cloud-decoupling-closure
          if-no-files-found: error

  backend-regression:
    needs: scope
    if: needs.scope.outputs.backend_regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend regression suite
        run: bash scripts/checks/backend-local-verification.sh

  mariadb-regression:
    needs: scope
    if: needs.scope.outputs.mariadb_regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: terraformers
          MARIADB_USER: terraformers
          MARIADB_PASSWORD: terraformers
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3306/terraformers
      SPRING_DATASOURCE_USERNAME: terraformers
      SPRING_DATASOURCE_PASSWORD: terraformers
      JWT_PROVIDER: cognito
      JWT_ISSUER_URI: https://identity.example.test/validation-pool
      JWT_JWK_SET_URI: http://127.0.0.1:65535/.well-known/jwks.json
      TERRAFORMERS_SECURITY_JWT_COGNITO_CLIENT_ID: validation-client
      UPLOAD_SOURCE_BUCKET: validation-upload-bucket
      SERVER_PORT: '18080'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate neutral prod schema and repositories
        run: bash scripts/checks/mariadb-schema-validation.sh

  frontend-regression:
    needs: scope
    if: needs.scope.outputs.frontend_regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --legacy-peer-deps --no-audit --no-fund
      - run: CI=true npm --prefix frontend test -- --runInBand
      - run: npm --prefix frontend run build
      - run: test -s frontend/build/index.html

  runtime-contract:
    needs: scope
    if: needs.scope.outputs.runtime_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.30.5
      - name: Verify neutral and AWS compatibility runtime contracts
        run: bash scripts/checks/runtime-contract-verification.sh
