  execution_base_sha: "f5f92508efdafbfc25e672cfa68976193dbd9024"

  goal: >
    Close the Case C relational-hosting decision after MySQL 8.4 failed the
    unchanged-migration compatibility gate.

  selected:
    engine: MariaDB 11.4
    hosting: dedicated Compute Engine VM
    packaging: containerized
    data_storage: dedicated Persistent Disk
    network: private application path; no public MariaDB exposure
    initial_machine_candidate: e2-medium
    initial_data_disk_candidate: 20_GiB_pd-balanced

  deferred:
    - MariaDB_to_MySQL_migration
    - Cloud_SQL_for_MySQL
    - MariaDB_replication
    - automatic_failover
    - multi_zone_database_HA

  rejected_for_first_baseline:
    - MariaDB_StatefulSet_in_current_GKE_cluster

  hard_gate_before_implementation:
    - read_actual_asia_northeast3_compute_quota
    - read_project_wide_compute_quota
    - verify_GKE_plus_DB_VM_CPU_headroom
    - verify_VM_instance_quota
    - verify_disk_quota
    - verify_address_quota_if_required
    - verify_Free_Trial_or_credit_headroom
    - stop_if_quota_or_budget_is_insufficient

  allowed_paths:
    - .agents/work-packages/case-c-relational-hosting-decision-v1.yml
