      - provider_quality_attachment_tests
      - AnalysisJobRepository_tests
      - AnalysisJobStateService_and_Runner_tests
      - AnalysisJobControllerIntegrationTest
      - restart_or_fresh_repository_context_readback_test
      - AnalysisObservability_tests
      - existing_backend_local_verification
      - existing_MariaDB_schema_and_repository_validation
      - git_diff_check
