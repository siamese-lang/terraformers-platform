apiVersion: v1
kind: ConfigMap
metadata:
  name: terraformers-backend-runtime-config
  labels:
    app.kubernetes.io/name: terraformers-backend
    app.kubernetes.io/part-of: terraformers-modernization
data:
  SPRING_PROFILES_ACTIVE: "prod"

  # Runtime defaults. Local and base deployments keep external adapters disabled.
  OBJECT_READER_PROVIDER: "disabled"
  OBJECT_WRITER_PROVIDER: "metadata-only"
  ANALYSIS_PROVIDER: "stub"
  EMBEDDING_PROVIDER: "disabled"
  RETRIEVAL_MODE: "DISABLED"
  PROGRESS_PUBLISHER: "logging"

  # Non-secret runtime defaults.
  OPENSEARCH_TOP_K: "3"
  CORPUS_VERSION: "terraformers-reference-v1"
  PROVIDER_VERSION: "5.100.0"
  ANALYSIS_RESULT_KEY_PREFIX: "analysis-results"
