work_package:
  id: case-a-a7-7-broad-v4-live-proof-v1
  status: REPOSITORY_IMPLEMENTED_BOOTSTRAP_RESTORE_GATED
  approved_base_sha: BIND_AT_ACTIVATION
  execution_base_sha: 13e398599ce69e087e9098b1413cad37c41edfd1

  activation:
    bind_rule: >
      Merge this Work Package to main before implementation. Immediately before the first A7-7
      implementation write, read authoritative remote main exactly once, bind that SHA to
      execution_base_sha on the implementation branch, and do not refresh or rebase afterward.
    first_implementation_write_must_bind_execution_base: true

  prior_phase:
    id: A7_6
    status: COMPLETE_ON_ACTIVATION_MERGE
    decision_merge_sha: a58d78181be642f3b3c2fdd38486c7d19fcc045e
    evidence: docs/evaluation/case-a-a7-6-observability-backend-decision.md
    selected_observability: repository_native
    OpenTelemetry: DEFERRED_WITH_TRIGGER
    Langfuse: DEFERRED_WITH_TRIGGER

  user_goal:
    approved_on: 2026-10-05
    statement: >
      The improved Terraformers must actually operate end-to-end with broad v4 RAG and persisted
      quality. Repository-only evidence is insufficient for final closure.
    interpretation: >
      A7-7 is required. Repository preparation is already merged, but live GCP mutation remains
      gated. The independently authenticated inventory proved that the delivery bootstrap is not a
      simple ABSENT baseline: the state bucket and three delivery service accounts are absent while
      terraformers-github is in Google Cloud DELETED soft-delete state. Restore only that reviewed
      bootstrap after a bootstrap-specific checkpoint. Only after restored GitHub OIDC makes the
      existing read-only preflight possible may a second runtime-live checkpoint freeze the exact
      Terraform plan/image/runtime values.

  goal: >
    Prove in the existing Case C representative GCP topology that the improved Terraformers actually
    serves the broad terraformers-reference-v4 corpus, runs the real authenticated AnalysisJob path,
    persists evidence-quality-v1, returns that quality through the existing job API, rejects a
    negative control without Terraform output, retains any naturally observed failures as evidence,
    and returns all recreated target-runtime resources to the pre-A7-7 teardown baseline.

  non_goal:
    - production_hardening
    - capacity_tuning
    - HPA_or_replica_tuning
    - zero_downtime_rollout
    - HA_database_design
    - OpenTelemetry_or_Langfuse_adoption
    - new_GCP_topology
    - second_vector_database
    - evaluator_LLM
    - rerun_until_green

  frozen_authority:
    provider_version: "5.100.0"
    provider_source_commit: f7a3b98da589ab1d52756b0dcee0dbf2de83d635
    provider_schema_resource_count: 1526
    official_documented_schema_resource_count: 1514
    official_knowledge_gap_count: 12
    v4:
      corpus_version: terraformers-reference-v4
      index_name: terraformers-reference-v4
      selected_resource_count: 1514
      selected_official_evidence_resource_count: 1514
      official_evidence_extraction_gap_count: 0
      total_document_count: 5395
      provider_document_chunk_count: 5387
      project_decision_count: 8
      embedding_model_id: gemini-embedding-001
      vector_dimension: 1024
    historical_v3:
      corpus_version: terraformers-reference-v3
      document_count: 128
      immutable: true

  selected_runtime:
    project: terraformers-platform
    region: asia-northeast3
    zone: asia-northeast3-a
    reuse_case_c_topology: true
    components:
      - GKE_single_node_target_runtime
      - OpenSearch_3_8_single_statefulset
      - MariaDB_11_4_VM_and_dedicated_PD
      - GCS_runtime_object_bucket
      - Secret_Manager_runtime_secrets
      - Artifact_Registry_backend_image
      - Vertex_AI_generation_and_embedding
    no_second_architecture: true

  implementation_contract:
    corpus_build:
      decision: BUILD_REPRODUCIBLY_FOR_LIVE_INGESTION
      do_not_commit_14_8MB_generated_v4_corpus_by_default: true
      provider_source: >
        Use the exact pinned terraform-provider-aws source commit
        f7a3b98da589ab1d52756b0dcee0dbf2de83d635. Do not use current/default branch content.
      provider_schema: >
        Use the AWS Provider 5.100.0 schema from the exact A7-7 backend image/runtime source.
        The backend image already checksum-pins Terraform 1.8.5 and AWS Provider 5.100.0 and exposes
        /opt/terraform-provider-schema/aws-5.100.0.json.
      project_source_commit: >
        Use the exact final A7-7 main source SHA for v4 project-decision provenance.
      compiler: scripts/rag/build-corpus-v4.py
      mode: --all-documented-resources
      deterministic_gate:
        - corpusVersion_is_terraformers-reference-v4
        - providerSchemaResourceCount_is_1526
        - officialDocumentationResourceCount_is_1514
        - selectedResourceCount_is_1514
        - selectedOfficialEvidenceResourceCount_is_1514
        - selectedOfficialEvidenceExtractionGapResourceTypes_is_empty
        - providerDocumentChunkCount_is_5387
        - projectDecisionCount_is_8
        - documentCount_is_5395

    ingestion_script:
      file: scripts/rag/ingest-gcp-target-corpus.py
      required_change: >
        Generalize the currently v3/128-specific contract to a manifest/contract-driven v3+v4
        ingester while preserving all v3 behavior and tests.
      rules:
        - validate corpus through rag-corpus-contract-verification.py
        - validate supported embedding model and dimension from manifest
        - use manifest corpusVersion/indexName/documentCount instead of hard-coded v3/128
        - existing-index checksum mismatch remains fail-closed
        - final corpus-version document count must equal manifest documentCount
        - representative kNN readiness query remains mandatory
        - receipt remains bounded and contains no document content_embedding_vectors_or_credentials
        - preserve bounded retry/backoff_for_transient_Vertex_embedding_errors
        - do_not_weaken_v3_contract

    ingestion_workflow:
      file: .github/workflows/gcp-target-corpus-ingestion.yml
      required_change: >
        Extend the existing protected workflow instead of adding a new workflow. Preserve the
        historical v3 operation and add an exact A7-7 v4 operation/confirmation.
      v4_confirmation: INGEST_A7_7_REFERENCE_V4
      timeout_budget: >
        Broad v4 contains 5,395 documents. The existing 0.5-second document-embedding pacing alone
        can exceed 45 minutes; the workflow timeout must be explicitly sufficient without removing
        bounded pacing/retry merely to make CI faster.
      v4_receipt_gate:
        - corpus_version_terraformers-reference-v4
        - document_count_5395
        - index_name_terraformers-reference-v4
        - embedding_model_gemini-embedding-001
        - vector_dimension_1024
        - checksum_is_64_char_sha256
        - representative_hit_ids_nonempty
        - outcome_ingested_or_already_ingested
      evidence:
        - upload_bounded_contract_and_ingestion_receipt_artifact
        - no_document_content_or_embedding_vector_artifact

    runtime_config:
      file: infra/kubernetes/overlays/gcp-target/backend-configmap-patch.yaml
      required_change:
        INDEX_NAME: terraformers-reference-v4
        CORPUS_VERSION: terraformers-reference-v4
      preserve:
        - RETRIEVAL_MODE_REQUIRED
        - OPENSEARCH_TOP_K_8
        - provider_version_5_100_0
        - embedding_model_gemini-embedding-001
        - vector_dimension_1024

    live_validation_workflow:
      file: .github/workflows/gcp-target-runtime-dependencies.yml
      required_change: >
        Add one bounded A7-7 operation to the existing backend live-validation job. Do not create a
        new workflow. Reuse the existing ephemeral JWT/JWKS authentication mechanism.
      operation: a7-7-broad-v4-live-proof
      confirmation: RUN_A7_7_BROAD_V4_LIVE_PROOF
      positive_fixture:
        case_id: arch-vpc-three-tier
        path: evaluation/terraformers-eval-v1/fixtures/case-01-vpc-three-tier.webp
        sha256: a254981735b1060513251cfd9d6dcab82de8a818730f10b128d1c3904635c8c8
      negative_fixture:
        case_id: non-architecture-deployment-dashboard
        path: evaluation/terraformers-eval-v1/fixtures/case-06-non-architecture-dashboard.webp
        sha256: 12eb8590b89eaea0988d5038c7a9862eebc584039d88084fe91433848a53d36d
      preconditions:
        - deployed_backend_image_is_exact_immutable_digest
        - BUILD_SOURCE_REVISION_equals_approved_main_SHA
        - ConfigMap_INDEX_NAME_is_terraformers-reference-v4
        - ConfigMap_CORPUS_VERSION_is_terraformers-reference-v4
        - OpenSearch_v4_index_checksum_metadata_exists
        - OpenSearch_v4_document_count_is_5395

  live_acceptance:
    identity:
      - exact_main_source_SHA
      - exact_backend_image_digest
      - BUILD_SOURCE_REVISION_matches_main_SHA
      - provider_version_5_100_0
      - corpus_version_terraformers-reference-v4
      - v4_corpus_checksum
      - quality_contract_evidence-quality-v1
      - fixture_SHA256s

    positive_path:
      request:
        - authenticated_upload_HTTP_201
        - source_bytes_persisted_to_GCS
        - AnalysisJob_id_returned
      terminal:
        - AnalysisJob_reaches_SUCCEEDED
        - generated_Terraform_is_readable_and_nonempty
        - result_object_key_is_present
      live_v4_retrieval:
        - correlated_job_log_contains_retrieval_success
        - correlated_job_log_corpusVersion_is_terraformers-reference-v4
        - correlated_job_log_referenceCount_is_positive
        - OpenSearch_active_index_is_terraformers-reference-v4_with_5395_documents
      persisted_quality:
        - quality_object_is_non_null
        - quality_contractVersion_is_evidence-quality-v1
        - technicalStatus_is_PASS
        - knowledgeStatus_is_COMPLETE
        - qualityStatus_is_not_NOT_APPLICABLE
        - projectDecisionStatus_may_be_UNKNOWN_under_current_runtime_contract
        - runtimeQualityBoundary_is_CONDITIONAL_ON_EXTRACTED_FACTS
        - reasons_are_bounded_enum_values
      observability:
        - terminal_quality_metric_is_present
        - job_and_stage_metrics_are_present
        - correlated_logs_use_analysisJobId_and_source_revision
        - no_prompt_image_bytes_raw_reference_content_or_generated_HCL_in_metric_labels

    negative_path:
      request:
        - authenticated_upload_HTTP_201
        - separate_project_identity_from_positive_control
      terminal:
        - terminal_state_is_FAILED_for_INPUT_REJECTED_semantics
        - resultFileId_is_null
        - resultObjectKey_is_null
        - project_Terraform_read_returns_no_successful_draft
      persisted_quality:
        - quality_object_is_non_null
        - contractVersion_is_evidence-quality-v1
        - technicalStatus_is_PASS
        - knowledgeStatus_is_NOT_APPLICABLE
        - qualityStatus_is_NOT_APPLICABLE
        - projectDecisionStatus_is_NOT_APPLICABLE
        - reasons_is_empty
      observability:
        - failure_category_is_rejected_input
        - no_generation_or_Terraform_output_is_claimed

    failure_retention:
      rule: >
        Do not automatically rerun a positive/negative correctness request until green. Any naturally
        observed provider, retrieval, executable, or quality failure is part of the evidence and must
        be retained with exact source/image/corpus identity.
      retry_rule: >
        A retry may occur only after the first attempt is durably recorded and the reason is stated.
        Infrastructure setup/ingestion resume with the identical corpus checksum is not treated as a
        hidden correctness rerun, but all workflow attempts remain evidence.

  actual_pre_A7_7_baseline:
    source: >
      Case C final teardown Stage 2 removed the Terraform state bucket and the
      terraformers-plan / terraformers-apply / terraformers-image-publish service accounts, and
      issued deletion of the terraformers-github Workload Identity Pool after runtime residual
      verification. Google Cloud retains a deleted Workload Identity Pool in recoverable
      soft-delete state for its deletion-retention window, so deletion must not be represented as
      immediate permanent absence.
    observed_on: "2026-10-05"
    runtime_resources: ABSENT
    terraform_state_bucket: ABSENT
    WIF_pool:
      name: projects/21647422237/locations/global/workloadIdentityPools/terraformers-github
      state: DELETED
      expire_time: "2026-11-01T16:21:59.782737490Z"
      recovery_action: UNDELETE_EXISTING_POOL
      create_same_name_while_deleted: FORBIDDEN
    WIF_provider:
      name: projects/21647422237/locations/global/workloadIdentityPools/terraformers-github/providers/terraformers-main
      observed_state: UNRESOLVED_WHILE_PARENT_POOL_DELETED
      read_only_result: >-
        gcloud providers list --show-deleted returned an empty list and NOT_FOUND because the parent
        pool is deleted; the direct IAM REST providers listing returned the same parent NOT_FOUND.
      recovery_rule: >-
        Undelete the existing pool first, then verify that terraformers-main is restored and exactly
        matches the reviewed issuer, attribute mapping and attribute condition. Do not create or
        update a replacement provider as a fallback. If the provider is not restored exactly, STOP.
    plan_service_account: ABSENT
    apply_service_account: ABSENT
    image_publish_service_account: ABSENT
    enabled_Google_APIs: MAY_REMAIN
    GitHub_environments_and_variables: RETAINED_REPOSITORY_CONFIGURATION
    bootstrap_restore_permissions:
      iam_workloadIdentityPools_undelete: GRANTED
      iam_workloadIdentityPoolProviders_undelete: GRANTED
      iam_serviceAccounts_create: GRANTED
      iam_serviceAccounts_getIamPolicy: GRANTED
      iam_serviceAccounts_setIamPolicy: GRANTED
      resourcemanager_projects_setIamPolicy: GRANTED
      serviceusage_services_enable: GRANTED
      storage_buckets_create: GRANTED
    first_A7_7_preflight_attempt:
      run_id: 37278756126
      conclusion: failure_before_GCP_resource_query
      failure: >-
        google-github-actions/auth returned invalid_target for
        terraformers-github/providers/terraformers-main.
      interpretation: >-
        This is bootstrap-lifecycle evidence, not a quota, Terraform plan, or target-runtime
        failure. The later independent inventory resolved the pool itself as DELETED soft-delete.

  bootstrap_restore_contract:
    scope: EXISTING_REVIEWED_DELIVERY_BOOTSTRAP_ONLY
    WIF_pool:
      action: UNDELETE_EXISTING_POOL
      name: terraformers-github
      do_not_create_duplicate: true
    WIF_provider:
      action: VERIFY_PROVIDER_AFTER_POOL_UNDELETE
      name: terraformers-main
      expected_issuer_uri: https://token.actions.githubusercontent.com
      expected_attribute_mapping:
        google.subject: assertion.sub
        attribute.repository_owner_id: assertion.repository_owner_id
        attribute.repository_id: assertion.repository_id
        attribute.ref: assertion.ref
      expected_attribute_condition: >-
        assertion.repository_owner_id=='174786754' &&
        assertion.repository_id=='1374031315' &&
        assertion.ref=='refs/heads/main'
      mismatch_action: STOP
      create_or_update_as_fallback: FORBIDDEN
    terraform_state_bucket:
      action: RECREATE_EXACT_REVIEWED_BUCKET
      name: terraformers-platform-tfstate-21647422237
      location: asia-northeast3
      uniform_bucket_level_access: REQUIRED
      public_access_prevention: REQUIRED
      object_versioning: REQUIRED
    service_accounts:
      action: RECREATE_SAME_EMAILS_AND_REAPPLY_REVIEWED_BINDINGS
      identities:
        - terraformers-plan@terraformers-platform.iam.gserviceaccount.com
        - terraformers-apply@terraformers-platform.iam.gserviceaccount.com
        - terraformers-image-publish@terraformers-platform.iam.gserviceaccount.com
      note: >-
        Recreated service accounts receive new underlying identities; do not assume deleted-account
        IAM state is inherited. Reapply only the repository-reviewed WIF/project/bucket bindings.
    runtime_resources_created_in_this_step: false

  live_execution_sequence:
    - id: BOOTSTRAP_READ_ONLY_INVENTORY
      result: COMPLETE
      action: >
        Independently authenticated Cloud Shell verified the target runtime and state bucket absent,
        all three delivery service accounts absent, and terraformers-github in DELETED soft-delete
        state through 2026-11-01T16:21:59.782737490Z. Provider lookup is unresolved while the parent
        pool is deleted. Required undelete/create/IAM permissions are granted. No mutation occurred.
    - id: BOOTSTRAP_RESTORE
      action: >
        After the bootstrap-restore checkpoint, undelete the existing terraformers-github pool;
        verify the restored terraformers-main provider exactly matches the reviewed issuer, immutable
        repository-ID mapping and refs/heads/main condition; recreate the exact state bucket and the
        three reviewed delivery service accounts with their existing reviewed bindings. Do not create
        or update a replacement WIF provider, and do not create target runtime resources in this step.
    - id: PRECHECK
      action: >
        With the reviewed bootstrap restored, run the existing GitHub OIDC identity check, read-only
        full-shape quota/cost preflight, and protected foundation preflight. Require absent target
        runtime, empty canonical runtime state, protected state bucket, and the reviewed exact
        12-create foundation plan with no update/delete/replacement/additional managed resource.
        Present these exact results at the separate runtime-live checkpoint before FOUNDATION.
    - id: FOUNDATION
      action: >
        Recreate only the previously selected Case C GCP foundation and delivery/runtime dependencies
        using existing protected workflows and reviewed Terraform plans.
    - id: BACKEND_IMAGE
      action: >
        Build/publish one immutable backend image from the exact A7-7 main source SHA and record its digest.
    - id: OPENSEARCH_AND_BACKEND
      action: >
        Deploy the existing OpenSearch and backend runtime with v4 ConfigMap identity. Do not change topology.
    - id: V4_INGESTION
      action: >
        Deterministically build the broad v4 corpus from pinned authority, ingest all 5,395 documents,
        and retain only the bounded contract/receipt.
    - id: LIVE_PROOF
      action: >
        Execute exactly the bounded authenticated positive and negative controls and capture API,
        metrics, and bounded correlated-log evidence.
    - id: TEARDOWN
      action: >
        Use the existing protected runtime teardown workflow with the exact reviewed state/delete
        count. Remove the recreated target runtime, Kubernetes namespace/PVC disk, runtime object
        bucket, Artifact Registry runtime repository/images, runtime secrets, MariaDB VM/PD, GKE
        target, and target VPC.
    - id: BOOTSTRAP_CLEANUP
      action: >
        After runtime residual verification and empty canonical managed state, run the reviewed final
        bootstrap cleanup from an independently authenticated Cloud Shell. Remove all versions/objects
        from terraformers-platform-tfstate-21647422237, delete that state bucket, remove project IAM
        bindings for the exact plan/apply/image-publish identities, delete those three service
        accounts, and delete terraformers-github WIF pool/provider.
    - id: RESIDUAL_CHECK
      action: >
        Verify A7-7 returns to the actual pre-A7-7 baseline: no target runtime resources, no
        Terraform state bucket, no plan/apply/image-publish service accounts, and no terraformers-github
        WIF pool/provider. Enabled shared Google APIs and GitHub environments/non-secret variables may
        remain because they were intentionally retained by the prior final teardown.

  live_checkpoint:
    model: TWO_STAGE_TO_REMOVE_BOOTSTRAP_PREFLIGHT_CYCLE
    bootstrap_restore_checkpoint:
      required_before_first_GCP_mutation: true
      authorizes_only:
        - undelete_existing_terraformers_github_pool
        - verify_restored_terraformers_main_provider
        - recreate_exact_reviewed_state_bucket
        - recreate_three_reviewed_delivery_service_accounts_and_bindings
      must_present:
        - exact_main_SHA
        - independent_read_only_inventory
        - terraformers_github_DELETED_state_and_expire_time
        - provider_unresolved_due_to_deleted_parent
        - exact_bootstrap_restore_contract
        - required_undelete_create_IAM_permissions
      explicitly_does_not_authorize:
        - target_runtime_foundation
        - backend_image_publication
        - Vertex_embedding_or_generation
        - OpenSearch_ingestion
        - A7_7_positive_or_negative_correctness_requests
    runtime_live_checkpoint:
      required_after_bootstrap_restore_and_read_only_preflight: true
      required_before_target_runtime_or_cost_bearing_mutation: true
      must_present:
        - exact_current_main_SHA
        - restored_bootstrap_verification
        - exact_read_only_quota_cost_preflight_result
        - exact_Terraform_plan_contract_for_recreation
        - reviewed_12_create_foundation_plan_with_zero_update_delete_replace
        - expected_runtime_shape_and_region
        - exact_backend_image_source_SHA_strategy
        - broad_v4_embedding_volume_approx_2654504_input_tokens
        - expected_ingestion_document_count_5395
        - runtime_teardown_and_final_bootstrap_cleanup_strategy
      may_authorize_remaining_bounded_A7_7_sequence: true
    actions_outside_work_package_require_new_approval: true

  repository_acceptance_before_live:
    - A7_6_is_COMPLETE
    - execution_base_is_bound_once
    - v3_ingestion_behavior_remains_tested_and_compatible
    - v4_ingestion_is_manifest_driven_and_exact_count_gated
    - broad_v4_build_is_deterministic_from_pinned_provider_source_and_exact_provider_schema
    - runtime_ConfigMap_points_to_v4
    - existing_backend_live_validation_has_bounded_A7_7_operation
    - positive_quality_API_assertions_are_present
    - negative_INPUT_REJECTED_quality_API_assertions_are_present
    - no_new_workflow_is_added
    - Backend_Local_Verification_is_green
    - Terraform_Static_Verification_is_green
    - rag_ingestion_tests_are_green

  final_acceptance:
    - broad_v4_contract_counts_match_A7_0
    - broad_v4_is_actually_ingested_into_live_OpenSearch
    - backend_runtime_actually_points_to_v4_index_and_corpus_version
    - authenticated_positive_request_reaches_SUCCEEDED
    - positive_request_correlated_log_proves_v4_retrieval_with_positive_reference_count
    - positive_generated_Terraform_is_readable
    - positive_quality_snapshot_is_persisted_and_returned_by_API
    - authenticated_negative_control_produces_no_Terraform_result
    - negative_quality_snapshot_matches_INPUT_REJECTED_NOT_APPLICABLE_semantics
    - bounded_quality_and_stage_metrics_logs_are_observed
    - any_natural_failure_is_retained_not_rerun_away
    - all_recreated_target_runtime_resources_are_torn_down
    - Terraform_state_bucket_is_absent_after_final_cleanup
    - plan_apply_image_publish_service_accounts_are_absent_after_final_cleanup
    - terraformers_github_WIF_pool_is_DELETED_soft_delete_or_later_permanently_absent_after_final_cleanup
    - terraformers_main_provider_is_not_ACTIVE_after_final_cleanup
    - final_GCP_baseline_matches_pre_A7_7_final_teardown
    - A7_8_is_not_started

  allowed_paths:
    - .agents/work-packages/case-a-a7-7-broad-v4-live-proof-v1.yml
    - .agents/work-packages/case-a-a7-6-observability-backend-decision-v1.yml
    - .agents/work-packages/case-a-semantic-reliability-v1.yml
    - docs/AI_PROJECT_STATE.md
