name: M2 Runtime Parity Closure Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m2-runtime-parity-closure-verification.yml"
      - "scripts/checks/m2-runtime-parity-closure-verification.py"
      - "scripts/checks/m1-cloud-decoupling-closure-verification.py"
      - "scripts/checks/m2-frontend-experience-baseline.py"
      - "docs/verification/m2-runtime-parity-closure.md"
      - "docs/verification/m2-*.md"
      - "docs/plans/active/M2-runtime-parity.md"
      - "docs/AI_PROJECT_STATE.md"
      - "frontend/src/components/PublicProjectsReadOnly.js"
      - "frontend/src/pages/ProjectDetailPage.js"
      - "frontend/src/components/ProjectTreeReadOnly.js"
      - "backend/src/main/resources/application-prod.yml"
      - "infra/kubernetes/overlays/portable-object-store/**"

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify M2 runtime parity closure
        run: python3 scripts/checks/m2-runtime-parity-closure-verification.py
      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-runtime-parity-closure
          path: artifacts/m2-runtime-parity-closure/
          if-no-files-found: error
