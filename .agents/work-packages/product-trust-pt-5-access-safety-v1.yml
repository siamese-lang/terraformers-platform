  objective: >
    Audit the existing supported API flow for owner/non-owner/anonymous project and artifact
    access, analysis job/source linkage, public discussion and compatibility routes. Correct
    only the demonstrated default-open routing gap, without changing sharing or identity policy.
  mechanism:
    observed_gap: JWT-enabled filter uses anyRequest().permitAll outside enumerated protected routes
    selected_correction: >
      Preserve existing public GET routes with numeric project identifiers, monitoring/readiness
      GET probes and OPTIONS; require authentication for all other requests in the JWT-enabled
      chain. Existing service ownership checks remain authoritative for data and mutations.
    alternatives: >
      Retaining default-open routing leaves future unlisted handlers anonymous by default.
      Denying all unmatched requests would require a second complete list of protected handlers.
      An explicit public list with authenticated fallback closes the supported gap with one
      existing filter-chain change; a new IdP, IAM grant or authorization framework is unnecessary.
    bounds: >
      This tightens route authentication and preserves existing owner/admin private access,
      owner/admin mutations, public reads and authenticated public comments. It does not select
      a production IdP, grant new access, secure direct object-store/IAM access, add cost quotas,
      change CORS origins or deploy anything. Local JWT-disabled mode remains stub development.
