    - create_second_GCP_architecture
    - add_new_workflow
    - add_new_database_or_vector_database
    - add_Langfuse_OpenTelemetry_or_other_observability_product
    - add_evaluator_LLM_or_model_voting
    - change_provider_version
    - change_embedding_model
    - change_quality_taxonomy
    - change_retry_lease_claim_or_fencing_semantics
    - change_prompt_or_generation_model_for_convenience
    - weaken_negative_control
    - log_or_upload_prompt_image_bytes_raw_reference_content_generated_HCL_or_embedding_vectors
