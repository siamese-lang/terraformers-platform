name: AWS Runtime Deployment Package Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      aws_runtime_deployment_package: ${{ steps.scope.outputs.aws_runtime_deployment_package }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/checks/ci_changed_scope.py --workflow aws-runtime-package --all --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/checks/ci_changed_scope.py --workflow aws-runtime-package --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  aws-runtime-deployment-package:
    needs: scope
    if: needs.scope.outputs.aws_runtime_deployment_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.30.0

      - name: Verify AWS runtime deployment package path
        run: bash scripts/checks/aws-runtime-deployment-package-verification.sh

      - name: Upload deployment package evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aws-runtime-deployment-package-evidence
          path: artifacts/aws-runtime-deployment-package-verification
          if-no-files-found: ignore
