apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: terraformers-target
resources:
  - ../gcp-target
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-backendconfig.yaml
  - backend-backendconfig.yaml
  - managed-certificate.yaml
  - frontend-config.yaml
  - ingress.yaml
patches:
  - path: backend-service-neg-patch.yaml
  - target:
      kind: ConfigMap
      name: terraformers-backend-runtime-config
    patch: |-
      - op: replace
        path: /data/JWT_ISSUER_URI
        value: https://securetoken.google.com/REPLACE_WITH_FIREBASE_PROJECT_ID
      - op: replace
        path: /data/JWT_JWK_SET_URI
        value: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
      - op: remove
        path: /data/TERRAFORMERS_SECURITY_JWT_COGNITO_CLIENT_ID
      - op: add
        path: /data/JWT_PROVIDER
        value: firebase
      - op: add
        path: /data/FIREBASE_PROJECT_ID
        value: REPLACE_WITH_FIREBASE_PROJECT_ID
      - op: add
        path: /data/FIREBASE_BILLABLE_UIDS
        value: ""
images:
  - name: asia-northeast3-docker.pkg.dev/terraformers-platform/terraformers-backend/terraformers-backend
    newName: asia-northeast3-docker.pkg.dev/terraformers-platform/terraformers-backend/terraformers-backend
    digest: sha256:REPLACE_WITH_REVIEWED_BACKEND_DIGEST
  - name: terraformers-frontend-hosted
    newName: asia-northeast3-docker.pkg.dev/terraformers-platform/terraformers-frontend/terraformers-frontend
    digest: sha256:REPLACE_WITH_REVIEWED_FRONTEND_DIGEST
