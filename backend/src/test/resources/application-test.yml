spring:
  datasource:
    url: jdbc:h2:mem:terraformers-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false

terraformers:
  runtime:
    required-env: []
  security:
    jwt:
      enabled: true
      provider: cognito
      issuer-uri: https://cognito-idp.ap-northeast-2.amazonaws.com/test-pool
      jwk-set-uri: http://127.0.0.1:65535/.well-known/jwks.json
      cognito:
        client-id: test-client
  storage:
    reader-provider: disabled
    writer-provider: metadata-only
  analysis:
    mode: integrated-java
    provider: stub
    embedding-provider: disabled
    retrieval-mode: disabled
    result-key-prefix: analysis-results
    progress-publisher: logging
