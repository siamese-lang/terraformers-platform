name: M2 Object Byte Storage Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/src/main/java/com/terraformers/modernization/storage/FileSystemObjectStore.java"
      - "backend/src/test/java/com/terraformers/modernization/storage/FileSystemObjectStoreTest.java"
      - "backend/src/main/java/com/terraformers/modernization/storage/StorageRuntimeProperties.java"
      - "infra/kubernetes/overlays/portable-object-store/**"
      - "scripts/checks/kind-portable-upload-analysis-filesystem.sh"
      - ".github/workflows/m2-object-byte-storage-verification.yml"

permissions:
  contents: read

jobs:
  object-byte-storage:
    name: Portable object byte storage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run filesystem adapter unit tests
        working-directory: backend
        run: mvn -q -Dtest=FileSystemObjectStoreTest test
      - name: Setup Kind
        uses: helm/kind-action@v1
        with:
          cluster_name: terraformers-portable-object-store
          wait: 120s
      - name: Verify object byte storage parity
        run: bash scripts/checks/kind-portable-upload-analysis-filesystem.sh
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-object-byte-storage
          path: artifacts/m2-object-byte-storage
