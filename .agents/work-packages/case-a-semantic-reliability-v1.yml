work_package:
  id: case-a-semantic-reliability-v1
  status: A7_0_COMPLETE_HANDOFF_TO_A7_1_WORK_PACKAGE
  approved_base_sha: BIND_AT_ACTIVATION
  execution_base_sha: dd34d1cec34d31783ca2d672c65311ce82fd2666

  execution_handoff:
    reason: >
      The original Work Package bound execution_base_sha once for A7-0 and stops when main drifts.
      A7-0 implementation and closure were intentionally merged, so later phases must not overwrite
      that historical execution base. A7-1 therefore uses its own bounded Work Package.
    next_work_package: .agents/work-packages/case-a-a7-1-evidence-quality-contract-v1.yml
    user_approval: 2026-10-04
    A7_1_implementation_started: false

  phase_gate:
    completed_phase: A7_0
    closure_evidence: docs/evaluation/case-a-a7-0-authoritative-knowledge-coverage.md
    next_phase: A7_1
    next_phase_status: NOT_STARTED
    next_phase_requires_explicit_user_approval: true
    measured_provider_schema_resource_count: 1526
    measured_official_documented_schema_resource_count: 1514
    measured_missing_official_document_resource_count: 12
    selected_rag_scope: full_official_documented_schema_intersection
    structural_authority_scope: full_provider_schema_universe
    missing_official_docs_policy: explicit_knowledge_gap_not_fabricated_RAG_evidence

  goal: >
    Extend the already-closed Case A retrieval-grounding/generalization case into an
    evidence-backed AI service reliability case. The implementation must make authoritative
    knowledge coverage, retrieval grounding, generated-output evidence support, provider partial
    failures, executable correctness, and runtime quality state separately observable without
    introducing an evaluator LLM as the default quality oracle.

  decision_source:
    - docs/architecture/decisions/ADR-008-evidence-backed-ai-quality.md
    - docs/plans/active/case-a-semantic-reliability-extension.md

  engineering_axis:
    - authoritative RAG knowledge architecture
    - AI/RAG quality measurement
    - backend AI-service reliability
    - runtime observability from real failure diagnosis

  representative_case:
    - Case A extension — Evidence-backed AI Quality and Semantic Reliability

  closure_boundary:
    original_case_a_claim: >
      The existing Case A retrieval-grounding/generalization closure remains valid and is not
      retroactively reopened.
    new_claim: >
      Terraformers can distinguish technical pipeline success from authoritative-knowledge
      coverage and evidence-backed output quality; classify false-green outcomes in labeled
      evaluation; identify provider partial failures; and retain bounded actionable diagnostics
      without exposing raw prompts, generated HCL, credentials, or unbounded provider payloads.

  direction_freeze:
    source: docs/architecture/decisions/ADR-008-evidence-backed-ai-quality.md
    axes:
      - provider_schema_is_deterministic_structural_authority
      - official_provider_docs_examples_are_authoritative_RAG_evidence
      - project_decisions_are_curated_relationship_architecture_evidence
      - corpus_resource_support_must_not_be_a_hard_coded_source_allowlist
      - evaluator_LLM_is_not_the_default_quality_oracle
      - technical_knowledge_runtime_quality_and_labeled_quality_are_separate_states
      - resource_and_relationship_decision_grounding_are_separate_dimensions
      - provider_partial_failures_are_explicitly_classified
      - Terraform_diagnostics_are_bounded_and_safe
      - observability_product_adoption_is_evidence_gated
      - any_live_GCP_proof_reuses_the_existing_representative_topology
      - any_recreated_live_runtime_must_be_torn_down_after_evidence
    change_rule: >
      An implementation may not change a frozen axis because a new tool/framework is interesting.
      A direction change requires repository/live evidence that a frozen assumption is materially
      false or insufficient, a written ADR amendment, and explicit user approval.

  activation:
    bind_rule: >
      Immediately before the first implementation write after this decision PR merges, read
      authoritative GitHub remote main exactly once and bind that SHA to execution_base_sha.
      Do not automatically refresh or rebase after activation.
    stop_on_main_drift: true

  allowed_paths:
    - .agents/work-packages/case-a-semantic-reliability-v1.yml
    - docs/architecture/decisions/ADR-008-evidence-backed-ai-quality.md
    - docs/plans/active/case-a-semantic-reliability-extension.md
    - docs/AI_PROJECT_STATE.md
    - docs/plans/active/portfolio-case-reassessment.md
    - docs/reference-retrieval.md
    - docs/evaluation/**
    - corpus/terraformers-reference/**
    - scripts/rag/**
    - scripts/checks/rag-corpus-contract-verification.py
    - tests/rag/**
    - backend/src/main/java/com/terraformers/modernization/analysis/**
    - backend/src/main/java/com/terraformers/modernization/analysis/vertex/**
    - backend/src/main/java/com/terraformers/modernization/evaluation/**
    - backend/src/main/java/com/terraformers/modernization/reference/**
    - backend/src/main/resources/db/migration/**
    - backend/src/test/java/com/terraformers/modernization/analysis/**
    - backend/src/test/java/com/terraformers/modernization/analysis/vertex/**
    - backend/src/test/java/com/terraformers/modernization/evaluation/**
    - backend/src/test/java/com/terraformers/modernization/reference/**
    - backend/src/test/resources/**
    - .github/workflows/gcp-target-evaluation-baseline.yml
    - .github/workflows/gcp-target-runtime-dependencies.yml

  prohibited_paths:
    - frontend/**
    - infra/terraform/**
    - infra/kubernetes/**
    - AGENTS.md

  allowed_actions:
    - inspect_repository
    - bind_execution_base_once
    - inventory_current_provider_and_corpus_coverage
    - implement_scalable_provider_corpus_compiler
    - create_new_versioned_corpus_without_mutating_v3
    - validate_arbitrary_provider_resource_support_without_source_code_allowlist_changes
    - preserve_full_provider_schema_direct_lookup_authority
    - preserve_curated_project_decisions
    - define_knowledge_coverage_taxonomy
    - define_evidence_backed_runtime_quality_contract
    - add_generated_resource_to_selected_evidence_support_checks
    - add_false_green_measurement_to_existing_evaluation_outputs
    - add_provider_content_blocked_and_empty_response_semantics
    - add_bounded_provider_finish_reason_observability
    - persist_bounded_runtime_quality_state
    - expose_bounded_runtime_quality_state_in_existing_AnalysisJob_API
    - add_low_cardinality_quality_metrics_and_job_correlated_logs
    - add_safe_Terraform_validation_diagnostic_taxonomy
    - compare_repository_native_observability_with_Langfuse_and_OpenTelemetry
    - modify_existing_evaluation_or_runtime_workflow_only_when_required_for_accepted_evidence
    - run_existing_backend_RAG_and_static_checks
    - create_pull_request
    - inspect_CI_once
    - perform_one_bounded_corrective_iteration_within_same_failure_class

  prohibited_actions:
    - merge
    - direct_main_write
    - mutate_historical_v3_corpus_content
    - add_case_or_fixture_specific_production_retrieval_rules
    - add_evaluator_LLM_without_an_approved_ADR_amendment
    - add_multiple_model_voting_without_an_approved_ADR_amendment
    - create_new_cloud_architecture
    - change_GCP_resource_topology_in_this_work_package
    - live_GCP_creation_without_separate_user_checkpoint
    - live_AI_evaluation_without_separate_user_checkpoint
    - arbitrary_model_change
    - arbitrary_prompt_tuning
    - arbitrary_retrieval_tuning
    - corpus_expansion_for_the_purpose_of_making_a_specific_gate_pass
    - provider_safety_validator_bypass
    - disable_provider_safety_controls
    - upload_raw_prompts_or_generated_HCL_as_monitoring_artifacts
    - upload_unbounded_Terraform_CLI_diagnostics
    - use_job_project_or_resource_names_as_metric_labels
    - next_work_package_start

  selected_contract:
    knowledge_authority:
      provider_schema:
        role: deterministic_resource_and_argument_contract
        retrieval: direct_lookup
      official_provider_docs_examples:
        role: authoritative_resource_usage_RAG_evidence
        retrieval: resource_aware_plus_semantic
      terraformers_project_decisions:
        role: curated_relationship_and_architecture_decision_evidence
        retrieval: applicability_and_semantic_selection

    corpus:
      historical_version: terraformers-reference-v3
      historical_version_immutable: true
      new_version: terraformers-reference-v4
      builder_rule: >
        Provider resource support must be derived from pinned provider source/schema and must not
        require adding the resource to a production source-code dictionary.
      build_modes:
        - bounded_resource_set
        - discovered_provider_resource_set
      required_provenance:
        - provider_version
        - provider_source_commit
        - source_path
        - authority
        - document_type
        - stable_document_id
        - corpus_version
        - corpus_checksum
      coverage_report:
        required:
          - provider_schema_resource_count
          - provider_document_resource_count
          - indexed_official_resource_count
          - missing_official_document_resource_count
          - project_decision_count

    runtime_state:
      technical_status:
        values:
          - PASS
          - FAIL
      knowledge_status:
        values:
          - COMPLETE
          - INCOMPLETE
          - UNKNOWN
          - NOT_APPLICABLE
      quality_status:
        values:
          - EVIDENCE_BACKED
          - DEGRADED
          - UNKNOWN
          - NOT_APPLICABLE
      contract_version:
        initial: evidence-quality-v1
      bounded_reasons:
        minimum:
          - RESOURCE_UNKNOWN_TO_PROVIDER
          - OFFICIAL_KNOWLEDGE_NOT_AVAILABLE
          - REQUIRED_EVIDENCE_NOT_RETRIEVED
          - REQUIRED_PROJECT_DECISION_NOT_RETRIEVED
          - GENERATED_RESOURCE_UNSUPPORTED_BY_EVIDENCE
          - PROVIDER_CONTENT_BLOCKED
          - PROVIDER_OUTPUT_TRUNCATED
          - PROVIDER_EMPTY_RESPONSE
          - PROVIDER_TIMEOUT
          - PROVIDER_RATE_LIMITED
          - PROVIDER_ERROR
          - PROVIDER_SCHEMA_FAILURE
          - TERRAFORM_EXECUTABLE_FAILURE

    runtime_quality_boundary: >
      Runtime quality is evidence-backed quality conditional on extracted architecture facts. It is
      not semantic ground truth for an arbitrary user image.

    generated_output_support: >
      Generated resource types are deterministically matched against selected reference
      resourceTypes and provider schema. The model is not asked to self-report citations.

    labeled_evaluation:
      false_green_definition: >
        false_green = technical_success && !labeled_quality_success
      labeled_quality_success_definition: >
        For architecture fixtures, require the frozen expected classification, complete required
        project-decision/resource grounding, required generated-resource coverage, zero forbidden
        generated resources, and the accepted validation contract. For negative controls, require
        expected classification/rejection and empty Terraform.
      calibration_role: >
        Canonical and holdout datasets validate the runtime evidence model and preserve the original
        Case A acceptance history; they are not required as per-request production labels.

    provider_completion:
      bounded_outcomes:
        - normal_stop
        - output_truncated
        - content_blocked
        - empty_response
        - provider_timeout
        - provider_rate_limited
        - provider_error

    diagnostics:
      Terraform_rule: >
        Parse structured Terraform diagnostics into bounded safe categories derived from observed
        diagnostic data. Do not retain raw failed generated HCL or arbitrary diagnostic text.

  prior_evidence_to_reuse:
    false_green_baseline:
      source: docs/plans/active/case-a-retrieval-grounding-decision.md
      evidence: >
        Historical VPC traces include retrieval PASS, generation PASS, and validation PASS while
        required grounding coverage was incomplete.
    corpus_scope_limitation:
      evidence: >
        terraformers-reference-v3 contains 128 documents but preserves the v2 curated provider
        content and covers only a limited provider-resource subset. PR #50 changed runtime corpus
        identity/embedding model without broadening provider content.
    repository_safety_false_failure:
      run_id: 36949479621
      interpretation: >
        The generated draft was rejected by a repository hard-coded-sensitive-credential policy.
        PR #190 later removed that policy-only rejection and its dedicated regeneration. This is
        not evidence of Vertex censorship.
      current_status: RESOLVED_BY_PR_190
    unresolved_executable_variance:
      run_id: 37016993776
      interpretation: >
        Attempt 1 passed and attempt 2 failed with terminal category
        terraform_validate_configuration under one frozen runtime identity. Raw failed HCL was
        intentionally not retained, leaving a diagnostic gap.
      current_status: RETAINED_DIAGNOSTIC_GAP

  implementation_phases:
    - id: A7_0
      title: Authoritative knowledge coverage architecture
      acceptance:
        - current_v3_provider_resource_coverage_is_machine_reported
        - provider_schema_resource_universe_is_machine_reported
        - new_v4_builder_does_not_require_a_source_code_allowlist_entry_for_each_resource
        - at_least_one_resource_absent_from_v3_is_built_and_verified_without_changing_builder_source
        - provider_schema_and_official_document_coverage_are_reported_separately
        - provider_source_commit_version_path_and_checksum_provenance_are_preserved
        - project_decision_documents_remain_separate_curated_authority
        - v3_content_is_unchanged
        - bounded_vs_full_provider_ingestion_scope_is_selected_from_measured_size_and_cost_not_from_old_allowlist

    - id: A7_1
      title: Evidence-backed quality contract
      acceptance:
        - technical_knowledge_and_quality_status_are_separate
        - missing_official_knowledge_is_not_reported_as_AI_quality_failure
        - retrieval_miss_is_distinguishable_from_corpus_knowledge_gap
        - generated_resource_types_are_checked_against_provider_schema_and_selected_evidence
        - project_decision_relationship_evidence_is_preserved_as_a_separate_dimension
        - runtime_quality_claim_is_explicitly_conditional_on_extracted_facts
        - quality_contract_has_a_versioned_persistent_representation

    - id: A7_2
      title: False-green measurement and offline calibration
      acceptance:
        - existing_historical_VPC_false_green_is_machine_representable
        - canonical_and_holdout_outputs_report_technical_success_labeled_quality_success_and_false_green
        - canonical_and_holdout_preserve_existing_Case_A_closure_metrics
        - negative_control_semantics_are_included
        - runtime_evidence_status_can_be_compared_with_labeled_quality_without_calling_runtime_status_ground_truth

    - id: A7_3
      title: Provider partial-failure taxonomy
      acceptance:
        - Vertex_abnormal_finish_reasons_are_not_all_collapsed_into_response_format
        - provider_content_blocking_is_distinguishable_from_transport_success
        - truncation_empty_response_timeout_rate_limit_and_generic_provider_error_remain_bounded
        - no_provider_safety_setting_is_weakened_to_make_a_test_pass
        - deterministic_tests_cover_content_blocked_and_empty_response_without_live_unsafe_prompts

    - id: A7_4
      title: Durable runtime quality observability
      acceptance:
        - AnalysisJob_persists_technical_knowledge_quality_status_reason_and_contract_version
        - existing_API_exposes_the_bounded_quality_state_with_backward_compatible_tests
        - successful_AnalysisJob_can_be_distinguished_from_degraded_or_unknown_quality
        - metrics_are_low_cardinality
        - job_identity_remains_in_logs_or_persisted_state_not_metric_labels
        - result_survives_process_restart_or_backend_replacement_with_the_job_state

    - id: A7_5
      title: Safe executable correctness diagnostics
      acceptance:
        - Terraform_init_validate_failures_retain_bounded_structured_diagnostic_categories
        - category_mapping_is_derived_from_real_or_fixture_Terraform_JSON_diagnostics
        - raw_HCL_credentials_prompts_and_unbounded_CLI_output_are_not_persisted_or_exported
        - the_37016993776_failure_class_would_be_more_actionable_under_the_new_evidence_contract

    - id: A7_6
      title: Observability backend decision
      acceptance:
        - repository_native_Micrometer_evaluation_artifacts_Langfuse_and_OpenTelemetry_are_compared
        - comparison_uses_trace_score_job_release_correlation_privacy_cost_and_Java_integration
        - new_product_is_selected_only_for_a_demonstrated_remaining_gap
        - Langfuse_if_selected_is_an_observability_surface_not_the_quality_oracle

    - id: A7_7
      title: Representative live validation
      acceptance:
        - live_execution_occurs_only_after_a_separate_user_checkpoint
        - existing_Case_C_GCP_topology_is_reused_if_live_service_proof_is_required
        - exact_source_image_corpus_and_quality_contract_identity_are_frozen
        - authenticated_positive_request_exposes_persisted_quality_state
        - authenticated_negative_control_proves_correct_no_Terraform_behavior
        - selected_RAG_evidence_and_quality_metrics_logs_are_observable
        - naturally_observed_provider_or_executable_failures_are_retained_not_rerun_away
        - live_resources_are_returned_to_an_explicitly_reviewed_zero_cost_closure_state

    - id: A7_8
      title: Integrated extension closure
      acceptance:
        - authoritative_knowledge_architecture_is_documented
        - false_green_before_after_is_documented
        - corpus_gap_retrieval_gap_generation_gap_and_executable_failure_are_distinguishable
        - runtime_vs_labeled_quality_boundary_is_explicit
        - provider_partial_failures_and_safe_diagnostics_support_the_claim
        - observability_product_decision_is_recorded
        - residual_risks_and_non_claims_are_preserved
        - final_portfolio_docs_and_PR_196_reconciliation_are_updated_before_project_closure

  observability_product_decision:
    candidates:
      - repository_native_micrometer_plus_evaluation_artifacts
      - langfuse
      - opentelemetry_plus_existing_metrics
    decision_dimensions:
      - model_call_trace_visibility
      - quality_score_attachment
      - job_and_release_correlation
      - Java_integration_complexity
      - self_host_or_managed_runtime_cost
      - sensitive_payload_control
      - additional_GCP_resource_cost
      - portfolio_explanatory_value
    no_default_winner: true

  live_sequence_after_implementation_merge:
    requires_separate_user_checkpoint: true
    preliminary_checks:
      - current_main_and_exact_image_identity
      - GCP_project_billing_and_remaining_credit
      - quota_and_region_capacity
      - current_model_access
      - absence_of_conflicting_Terraformers_runtime
      - reviewed_rebootstrap_and_teardown_path
    permitted_result: >
      If accepted evidence requires a full service path, recreate the existing GCP representative
      runtime through repository bootstrap/IaC/delivery paths. A different topology requires an ADR
      amendment and explicit user approval.
    cleanup_required: true

  validation:
    required:
      - existing_RAG_corpus_contract_and_tests
      - existing_Backend_Local_Verification
      - existing_Terraform_Static_Verification_when_workflow_or_state_docs_change
      - focused_unit_and_integration_tests_for_new_knowledge_quality_and_diagnostic_contracts
      - git_diff_check
    live_validation_is_separate: true

  auto_repair_limit: 1

  stop_on:
    - current_main_differs_from_bound_execution_base
    - second_failure_after_one_bounded_repair
    - failure_class_changes
    - direction_freeze_axis_would_need_to_change_without_ADR_amendment
    - allowed_path_outside_scope_is_required
    - existing_GCP_topology_requires_design_change
    - provider_safety_controls_would_need_to_be_weakened
    - runtime_would_infer_semantic_ground_truth_for_unlabeled_input
    - evaluator_LLM_or_model_voting_is_proposed_without_demonstrated_gap_and_ADR_amendment
    - new_observability_product_is_required_without_comparison_and_user_decision
    - live_or_cost_action_is_requested_without_user_checkpoint
    - acceptance_criteria_would_need_to_change

  completion:
    merge_requires_user_approval: true
    direction_change_requires_ADR_amendment_and_user_approval: true
    live_action_requires_separate_user_approval: true
    new_observability_product_requires_user_approval: true
    final_case_extension_closure_requires_user_approval: true
    next_work_package_requires_user_approval: true
