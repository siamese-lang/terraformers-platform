apiVersion: v1
kind: ConfigMap
metadata:
  name: terraformers-jwks
  namespace: terraformers-target
data:
  # The later bounded backend validation workflow replaces this with the public
  # key paired to its runner-local signing key before any authenticated request.
  jwks.json: '{"keys":[]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraformers-jwks
  namespace: terraformers-target
  labels:
    app.kubernetes.io/name: terraformers-jwks
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terraformers-jwks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraformers-jwks
    spec:
      containers:
        - name: jwks
          image: busybox:1.36.1
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /jwks.json
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: jwks
              mountPath: /www
              readOnly: true
      volumes:
        - name: jwks
          configMap:
            name: terraformers-jwks
---
apiVersion: v1
kind: Service
metadata:
  name: terraformers-jwks
  namespace: terraformers-target
spec:
  selector:
    app.kubernetes.io/name: terraformers-jwks
  ports:
    - name: http
      port: 8080
      targetPort: http
