program:
  id: product-trust-v1
  version: 3
  status: APPROVED_AMENDMENT_PENDING_INDEPENDENT_REVIEW_AND_USER_MERGE
  approved_on: "2026-10-06"
  approval_evidence: "User explicitly approved: APPROVE product-trust-v1"
  activation_base_sha: BIND_AT_ACTIVATION
  plan: docs/plans/active/product-trust-modernization.md
  state: .agents/state/product-trust-v1.json
  integrity_audit: docs/evaluation/product-trust-v3-cross-phase-integrity-audit.md
  remaining_mandatory_order: [PT-6R1, PT-6R2, PT-7, PT-8A, PT-8B, PT-9]

  approved_amendments:
    - id: PT2_FINAL_INCOMPLETE_TO_BOUNDED_PT3
      authority: USER
      approved_on: "2026-10-07"
      independent_result_review: https://github.com/siamese-lang/terraformers-platform/pull/246#issuecomment-6028079078
      accepted_disposition: PT2_INCOMPLETE_ACCEPTED_AS_FINAL_EVIDENCE_DISPOSITION
      baseline_complete: false
      applies_once_in_substantive_PT3_PR: true
      additional_PT2_dispatch_rerun_exception_or_harness_recovery: prohibited
      residuals:
        - PT2_did_not_establish_ten_case_realistic_generalization
        - cases_03_to_10_remain_NOT_RUN_neither_pass_nor_fail
        - no_aggregate_realistic_classification_hallucination_semantic_success_or_executable_validity_rate
        - original_case02_latency_remains_censored_at_424846_ms
        - runs_37500000739_and_37509368210_are_zero_product_observation_measurement_failures
    - id: V3_RESIDUAL_CLOSURE
      authority: USER
      approved_at: "2026-10-07T04:15:00Z"
      approval_evidence: docs/evidence/product-trust-v3-amendment/approved-request.md
      approval_text: "APPROVE product-trust-v1 v3 residual-closure amendment as audited above."
      reconciled_from_main_sha: f344552fe58db26438a4f0b2c9abb1806e6a99d9
      PT6_acceptance_review: https://github.com/siamese-lang/terraformers-platform/pull/250#issuecomment-6030408825
      applies_in_one_repository_only_amendment_PR: true
      amendment_requires_independent_acceptance_and_USER_merge: true
      PT6R1_activation: BIND_AT_ACTIVATION_AFTER_AMENDMENT_ACCEPTANCE_AND_USER_MERGE
      separate_state_sync_or_activation_PR: prohibited
      production_or_live_execution_in_amendment: prohibited
      PT2_final_disposition_and_evidence: immutable

  goal: >
    Establish whether Terraformers is trustworthy as an actual user-facing AI service on realistic
    architecture inputs, correct only evidence-backed defects, then complete one integrated live
    proof and teardown.

  primary_success_criteria:
    - realistic_input_fidelity_is_measured_against_frozen_human_reviewable_truth
    - false_trusted_success_is_measured
    - processing_success_and_output_trust_are_not_collapsed_for_the_user
    - accepted_to_terminal_latency_and_truthful_progress_are_observable
    - supported_private_project_access_is_fail_closed
    - same_external_identity_first_requests_converge_without_privilege_escalation
    - each_accepted_job_has_a_reviewed_bounded_provider_and_terminal_contract
    - final_browser_user_flow_is_validated
    - all_ten_frozen_final_acceptance_inputs_are_submitted_once_and_natural_failures_retained
    - final_realistic_false_trusted_success_equals_zero_and_no_positive_defect_is_hidden_by_averages
    - final_release_identity_is_source_and_digest_bound
    - live_runtime_is_torn_down_after_final_acceptance

  evidence_policy:
    preserve_direct_mechanism_evidence:
      - case_b_durable_job_semantics
      - broad_v4_provider_schema_and_corpus_coverage
      - real_terraform_cli_validation
      - existing_owner_non_owner_authorization_evidence
      - wif_immutable_image_and_source_binding
      - real_provider_latency_and_stage_telemetry
      - durable_quality_snapshot_persistence
    downgrade_to_controlled_regression_only:
      - terraformers_eval_v1_synthetic_positive_quality_claims
      - terraformers_eval_holdout_v1_synthetic_positive_quality_claims
      - synthetic_only_grounding_percentages
      - single_synthetic_positive_live_proof_as_generalization_evidence
    contradiction_rule: REALISTIC_PRODUCT_EVIDENCE_OVERRIDES_BROADER_HISTORICAL_CLAIMS

  execution_policy:
    github_is_durable_ssot: true
    max_active_work_packages: 1
    codex_cloud_preferred_executor: true
    auto_create_next_eligible_work_package: true
    auto_advance_repository_only_phases: true
    auto_repair_limit: 1
    auto_merge: false
    rerun_until_green: false
    refresh_execution_base_after_activation: false
    unrelated_cleanup_or_refactor: false
    next_phase_selection_must_follow_declared_dag: true
    phase_acceptance_requires_independent_review: true
    PT2_final_disposition_is_permanent_and_not_an_execution_authority: true
    future_phase_execution_base: BIND_ONCE_FROM_REMOTE_MAIN_AT_ACTIVATION_NOT_PREDICTED
    completion_reconciliation: IN_NEXT_SUBSTANTIVE_PR_NO_SEPARATE_STATE_SYNC_PR

  human_gates:
    - PROGRAM_APPROVAL
    - REALISTIC_DATASET_TRUTH_FREEZE
    - LIVE_REALISTIC_BASELINE
    - PRODUCT_OR_ARCHITECTURE_DECISION
    - IAM_OR_SECURITY_BOUNDARY_EXPANSION
    - NEW_PAID_OR_COST_INCREASING_CLOUD_ACTION
    - FINAL_PRODUCT_LIVE_PROOF
    - PROVIDER_OR_JOB_LATENCY_BUDGET_DECISION
    - FINAL_REALISTIC_AI_RAG_LIVE_MODEL_COST_ACCEPTANCE
    - DESTRUCTIVE_TEARDOWN
    - MERGE_WHEN_NOT_SEPARATELY_PREAUTHORIZED

  phases:
    - id: PT-1
      title: Realistic input benchmark design and freeze
      kind: repository
      depends_on: []
      auto_start_after_program_approval: true
      human_gate_before_completion: REALISTIC_DATASET_TRUTH_FREEZE
      objective: >
        Create a small diverse realistic-input dataset with provenance and human-reviewable truth
        before any live result is observed.
      completion:
        - realistic_positive_ambiguous_and_non_architecture_inputs_are_present
        - provenance_and_redistribution_boundary_are_recorded
        - expected_components_relationships_and_resource_intent_are_human_reviewable
        - model_under_test_did_not_author_its_own_truth_labels
        - dataset_identity_is_frozen_before_live_measurement

    - id: PT-2
      title: Current system realistic live baseline
      kind: live_measurement
      depends_on: [PT-1]
      auto_start_after_dependencies: false
      human_gate_before_start: LIVE_REALISTIC_BASELINE
      final_disposition:
        status: PT2_INCOMPLETE_ACCEPTED_AS_FINAL_EVIDENCE_DISPOSITION
        independently_reviewed: true
        successful_benchmark_completion: false
        further_execution_authorized: false
      objective: >
        Measure the current production-equivalent system once on the frozen realistic dataset before
        tuning prompts, retrieval, models, repair logic or scoring.
      completion:
        - input_fidelity_is_measured
        - false_trusted_success_is_measured
        - grounding_and_executable_validity_are_measured
        - accepted_to_terminal_and_stage_latency_are_measured
        - natural_failures_are_retained
        - no_rerun_until_green

    - id: PT-3
      title: Baseline driven AI trust correction
      kind: conditional_implementation
      depends_on: [PT-2]
      dependency_acceptance:
        original_success_criteria_are_not_weakened: true
        alternative_authorized_once: PT2_INCOMPLETE_ACCEPTED_AS_FINAL_EVIDENCE_DISPOSITION
        authority: USER_approved_amendment_PT2_FINAL_INCOMPLETE_TO_BOUNDED_PT3
        corrective_evidence: independently_supported_observed_subset_and_existing_earlier_evidence_only
      auto_start_after_dependencies: true
      human_gate_when: PRODUCT_OR_ARCHITECTURE_DECISION
      allowed_candidate_tracks:
        - input_fidelity_or_human_confirmation_boundary
        - generated_evidence_closure_versus_semantic_repair_gating
        - bounded_existing_model_fact_or_classification_correction
      prohibited_default_directions:
        - second_judge_model
        - model_voting
        - langgraph
        - new_vector_database
        - new_model_family
      objective: >
        Correct only independently supported defects evidenced by the observed PT-2 subset or
        existing earlier evidence. PT-2 remains historically INCOMPLETE, without ten-case or
        aggregate realistic metric claims. Do not reopen PT-2 or recover its measurement harness.
        If correction requires a new product choice,
        write a decision brief and stop rather than choosing silently.

    - id: PT-4
      title: Trustworthy user status and waiting experience
      kind: implementation
      depends_on: [PT-3]
      auto_start_after_dependencies: true
      mandatory_baseline_inputs:
        - persisted_quality_UNKNOWN_hidden_by_SUCCEEDED_API_and_frontend_completion
        - original_case02_424846_ms_censor_contradicts_unconditional_1_to_3_minute_guidance
        - semantic_degradation_reasons_from_PT3_must_remain_distinct_from_processing_completion
      objective: >
        Separate terminal processing state from output trust for the user and expose truthful durable
        progress plus accepted-to-terminal latency without fake confidence or percent-complete values.
      completion:
        - unknown_or_degraded_quality_is_not_indistinguishable_from_fully_supported_output
        - no_fake_numeric_confidence_is_added
        - accepted_to_terminal_latency_is_observable
        - truthful_stage_or_status_progress_survives_navigation_or_reload
        - unsupported_latency_promise_is_removed_or_bounded_by_evidence

    - id: PT-5
      title: Access safety and authentication boundary audit
      kind: audit_and_conditional_implementation
      depends_on: [PT-4]
      auto_start_after_dependencies: true
      human_gate_when: IAM_OR_SECURITY_BOUNDARY_EXPANSION
      objective: >
        Audit the supported user/API flow for owner/non-owner/anonymous access, default-open routing
        and relevant abuse boundaries. Do not adopt a new production IdP by default.
      completion:
        - supported_private_project_reads_and_mutations_are_owner_scoped
        - public_routes_are_explicit_and_fail_closed_where_selected
        - analysis_job_and_artifact_access_follow_project_ownership
        - deterministic_JWKS_fixture_is_not_claimed_as_permanent_production_identity
        - any_new_IdP_or_IAM_change_requires_human_decision

    - id: PT-6
      title: Browser level realistic user flow
      kind: integration_validation
      depends_on: [PT-5]
      auto_start_after_dependencies: true
      objective: >
        Validate the browser-observable path from authentication and realistic upload through durable
        progress, result/trust display and private-project access denial for another identity.
      accepted_completion:
        merged_pull_request: 250
        reviewed_head: 0b8f7ef0eefc472a0438a3d0eeedee0f1c919c7a
        independent_review_comment: 6030408825
        merged_main_sha: f344552fe58db26438a4f0b2c9abb1806e6a99d9
        execution_base_sha_preserved: 37e006be4d5995019704ea8a4009e1a59da039b2
        boundary: DETERMINISTIC_BROWSER_INTEGRATION_ONLY_NO_PRODUCTION_IDP_MODEL_QUALITY_OR_GENERALIZATION
        historical_failed_evidence: preserved
        additional_browser_execution_authorized: false

    - id: PT-6R1
      title: First-user identity concurrency closure
      kind: audit_and_conditional_implementation
      depends_on: [PT-6]
      auto_start_after_dependencies: true
      activation_requires: V3_amendment_independent_acceptance_and_USER_merge
      execution_base_sha: BIND_AT_ACTIVATION
      human_gates_when: [PRODUCT_OR_ARCHITECTURE_DECISION, IAM_OR_SECURITY_BOUNDARY_EXPANSION]
      objective: >
        Audit and deterministically reproduce concurrent first requests for the same provider/subject
        against real MariaDB before selecting a fix. If reproduced, correct the actual persistence
        atomicity boundary with the smallest production change. Do not preselect upsert,
        conflict-and-reread or another implementation. No browser/model/GCP work is needed merely
        for this defect.
      mandatory_inputs:
        - docs/evaluation/product-trust-pt-6-browser-journey.md
        - docs/evaluation/product-trust-pt-5-access-safety.md
      completion:
        - real_MariaDB_concurrent_first_request_reproduction_or_audit_is_recorded_before_any_fix
        - same_provider_subject_converges_to_exactly_one_durable_user_and_same_user_identity
        - no_5xx_unique_constraint_leak_or_privilege_escalation
        - distinct_identities_remain_distinct
        - PT5_owner_non_owner_anonymous_public_admin_authorization_matrix_remains_intact
        - deterministic_before_after_evidence_and_independent_acceptance

    - id: PT-6R2
      title: Provider terminality and latency-budget closure
      kind: audit_and_conditional_implementation
      depends_on: [PT-6R1]
      auto_start_after_dependencies: true
      execution_base_sha: BIND_AT_ACTIVATION
      human_gate_when: PROVIDER_OR_JOB_LATENCY_BUDGET_DECISION
      objective: >
        Ensure one accepted AnalysisJob cannot remain provider-bound indefinitely. Audit the actual
        Google GenAI client request/deadline capability and provider/retry/job boundaries first.
        Do not invent a timeout value or choose a retry-policy tradeoff silently. A required numeric
        provider/job budget or product tradeoff stops at the named product-decision gate with
        measured evidence and options. Preserve the original 424846 ms PT2 case-02 censor.
      budget_policy:
        numeric_budget: NOT_PRESELECTED
        decision_gate: PROVIDER_OR_JOB_LATENCY_BUDGET_DECISION
        authority_required_if_product_choice_needed: USER
        accepted_to_terminal_contract: FREEZE_IN_PT6R2_WORK_PACKAGE_AFTER_REQUIRED_DECISION
      completion:
        - actual_SDK_deadline_and_provider_retry_job_boundaries_are_audited
        - any_required_numeric_budget_or_retry_policy_choice_has_explicit_USER_approval
        - timeout_and_hang_injection_prove_truthful_bounded_terminal_semantics_for_accepted_jobs
        - bounded_terminal_contract_and_failure_semantics_are_durable_and_independently_accepted
        - PT4_truthful_waiting_status_and_original_PT2_censor_are_preserved
        - no_claim_that_Gemini_is_inherently_fast

    - id: PT-7
      title: CI CD trust gates and operational handoff
      kind: repository
      depends_on: [PT-6R2]
      auto_start_after_dependencies: true
      objective: >
        Correct demonstrated protected-main and pre-publication validation gaps and document the
        source-to-live session handoff without enabling automatic GCP deploy-on-merge.
        Audit first: current Backend Local Verification skips the production Docker build because
        RUN_DOCKER_BUILD defaults false. Determine the smallest shift-left correction for relevant
        backend/Dockerfile PR changes, preferably within the existing automatic PR workflow.
        Inspect actual protected-main/ruleset required checks and reconcile only demonstrated gaps;
        a required ruleset/security-boundary change still needs explicit human authority.
      build_contract:
        validation_authority: real_backend_Dockerfile
        terraform_version: "1.8.5"
        aws_provider_version: "5.100.0"
        bespoke_duplicate_pin_verifier: prohibited
        new_workflow_for_appearance: prohibited
      completion:
        - relevant_changes_have_stable_required_merge_gates
        - container_build_is_shifted_left_if_the_audit_justifies_it
        - live_session_runbook_connects_source_publish_rollout_proof_and_teardown
        - cost_gated_GCP_delivery_remains_human_approved
        - real_Dockerfile_build_covers_pinned_Terraform_and_provider_image_contracts
        - actual_required_checks_are_audited_and_only_demonstrated_gaps_reconciled
        - handoff_binds_source_SHA_immutable_image_digest_rollout_evidence_teardown

    - id: PT-8A
      title: Final realistic AI RAG trust acceptance
      kind: live_acceptance
      depends_on: [PT-7]
      auto_start_after_dependencies: false
      human_gate_before_start: FINAL_REALISTIC_AI_RAG_LIVE_MODEL_COST_ACCEPTANCE
      human_gate_immediately_before_execution: FINAL_REALISTIC_AI_RAG_LIVE_MODEL_COST_ACCEPTANCE
      objective: >
        Perform NEW final-system acceptance on the frozen human-reviewed realistic dataset, never
        PT2 recovery or reopening. Bind the final post-PT7 reviewed source/runtime identity, broad
        terraformers-reference-v4, gemini-embedding-2 / 1536, final production generation/grounding
        closure and the real Terraform CLI validator. Submit all ten inputs through the authenticated
        production AnalysisJob path exactly once in frozen order. Score only after inference against
        frozen truth. Preserve natural failures and individual case evidence.
      rationale:
        prior_broad_v4_run: 37419983898
        prior_findings: substantial_positive_false_green_and_semantic_failures
        production_generated_resource_closure_changed_by_PR: 237
        evaluator_aligned_to_production_orchestration_by_PR: 238
        complete_live_broad_v4_remeasurement_after_final_corrections: NOT_EXECUTED
        final_corrected_path_realistic_acceptance: UNPROVEN
      frozen_dataset:
        directory: evaluation/terraformers-realistic-v1
        revision: 3
        identity: 04f65a5c2c82a5afcab9ffe567018d0190b95877adb7c87a22797f0193e5c014
        positives: 6
        ambiguous_controls: 2
        non_architecture_controls: 2
      repetition_policy:
        first_submissions_per_input: 1
        correctness_resubmission_rerun_until_green_or_replacement_sample: prohibited
        truth_tuning_from_model_output: prohibited
        on_positive_semantic_evidence_executable_or_false_trusted_defect: >
          NOT_PASS; classify the failure mechanism and stop for a bounded corrective Work Package.
        after_actual_correction: >
          Only the minimum predeclared post-change regression for the affected mechanism may be
          authorized; preserve the original failure, never retry until green.
      completion:
        - all_ten_frozen_inputs_have_individually_preserved_once_only_first_submission_evidence
        - all_six_positives_satisfy_required_components_directed_relationships_resource_intent_and_cardinality
        - all_six_positives_satisfy_forbidden_interpretations_official_generated_resource_evidence_closure_and_real_CLI_validity
        - neither_ambiguous_nor_non_architecture_controls_allow_trusted_Terraform_success
        - false_trusted_success_equals_zero
        - every_accepted_job_follows_independently_accepted_PT6R2_bounded_terminal_contract
        - persisted_and_user_visible_quality_trust_agree_with_observed_semantic_and_technical_results
        - no_failing_case_is_hidden_by_aggregate_percentages_and_any_positive_defect_prevents_PASS
        - independent_acceptance_is_bounded_to_this_frozen_human_reviewed_realistic_dataset

    - id: PT-8B
      title: Final integrated release proof
      kind: live_acceptance
      depends_on: [PT-8A]
      dependency_acceptance: INDEPENDENT_PT8A_ACCEPTANCE_REQUIRED
      auto_start_after_dependencies: false
      human_gate_before_start: FINAL_PRODUCT_LIVE_PROOF
      objective: >
        Bind exact reviewed main SHA to immutable backend image, source-SHA tag, digest, deployed
        BUILD_SOURCE_REVISION and exact broad-v4 corpus/index identity. Compose accepted PT8A
        semantic evidence with PT6 browser/access evidence only where source-equivalence permits.
        Do not rerun ten-case model inference for ceremony when AI-relevant source/runtime identity
        is unchanged; rerun only an affected boundary if later code actually invalidates evidence.
        Do not add public ingress or a GCP frontend merely to make proof more live.
      completion:
        - reviewed_source_SHA_immutable_image_source_tag_digest_BUILD_SOURCE_REVISION_and_corpus_index_are_bound
        - PT8A_semantic_evidence_has_independent_acceptance
        - PT6_browser_access_evidence_is_composed_only_with_explicit_source_equivalence
        - any_later_invalidated_boundary_has_only_its_minimum_authorized_regression
        - claim_is_bounded_to_reviewed_realistic_dataset_and_representative_runtime
        - no_universal_AWS_diagram_generalization_or_deployment_correct_IAM_claim
        - independent_integrated_release_acceptance

    - id: PT-9
      title: Teardown and final portfolio closure
      kind: destructive_and_closure
      depends_on: [PT-8B]
      dependency_acceptance: INDEPENDENT_PT8B_ACCEPTANCE_REQUIRED
      auto_start_after_dependencies: false
      human_gate_before_start: DESTRUCTIVE_TEARDOWN
      objective: >
        Remove the live runtime and bootstrap resources, verify residual cost/resource baseline, then
        reconcile A7-8 and the final product-trust portfolio narrative.
      completion:
        - explicit_USER_destructive_checkpoint_precedes_any_teardown
        - retained_runtime_and_bootstrap_return_to_reviewed_final_baseline
        - residual_resource_absence_and_baseline_are_verified
        - final_closure_is_independently_reviewed_with_all_claim_limits_preserved

  explicit_non_blocking_portfolio_residuals:
    - hosted_production_Cognito_IdP_lifecycle_not_established_deterministic_identity_is_not_hosted_IdP_proof
    - per_user_model_cost_abuse_quota_not_established
    - twelve_AWS_provider_schema_resources_without_official_resource_docs_remain_knowledge_gaps
    - PT1_reference_derived_human_reviewed_recreations_are_not_a_statistical_sample_of_user_exports
  residual_claim_policy: CONSTRAIN_FINAL_CLAIMS_NEVER_SILENTLY_PROMOTE_RESIDUALS_TO_PASS

  explicitly_out_of_program:
    - kubernetes_or_gke_platform_reselection
    - microservice_decomposition
    - capacity_curve_or_hpa_tuning
    - multi_zone_or_database_ha
    - zero_downtime_multi_replica_rollout_optimization
    - rollback_or_canary_redesign_without_new_release_failure_evidence
    - observability_product_adoption_for_breadth
    - rabbitmq_kafka_redis_or_new_database
    - production_IdP_replacement_by_default
    - public_ingress_or_new_IdP
    - new_vector_DB_evaluator_LLM_or_model_voting
    - langfuse_or_OpenTelemetry_for_breadth
    - Kubernetes_redesign_HA_HPA_or_canary_work
    - unrelated_hardening

  stop_on:
    - current_main_differs_from_bound_execution_base_during_active_work_package
    - next_action_is_not_declared_by_program_or_active_work_package
    - acceptance_criteria_would_need_weakening
    - same_failure_requires_more_than_one_bounded_repair
    - failure_class_changes
    - realistic_truth_label_is_ambiguous
    - architecture_or_product_choice_is_required
    - IAM_or_security_boundary_expansion_is_required
    - unexpected_live_cost_or_quota_boundary_appears
    - destructive_action_is_required
    - rerun_would_exist_only_to_obtain_a_green_result
