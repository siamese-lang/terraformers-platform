  objective: >
    Make persisted processing state, output quality and accepted-to-terminal timing separately
    visible in the supported private/project and public-detail flow. Reuse existing durable jobs
    and quality snapshots, without fake stages, numeric confidence or completion estimates.
  mechanism:
    observed_gaps:
      - project_and_tree_metadata_drop_the_existing_quality_snapshot
      - SUCCEEDED_is_presented_as_undifferentiated_completion
      - thirty_second_client_timer_invents_a_model_wait_stage
      - unconditional_1_to_3_minute_guidance_conflicts_with_the_424846_ms_censor
      - job_updatedAt_changes_on_heartbeat_and_cleanup_and_cannot_represent_terminal_time
    selected_correction: >
      Add a nullable terminal timestamp in the existing fenced terminal transitions, without
      historical backfill. Expose the same-job quality and timing in existing job/project/tree
      responses. Render shared processing/trust presentation and elapsed time anchored to durable
      acceptance, preserve editable drafts, and show only persisted coarse states.
    alternatives: >
      Keeping completion-only presentation fails the approved phase. Inferring stage or terminal
      timing from timers/updatedAt fabricates evidence. New telemetry services, status machines,
      confidence scorers or model judges are unnecessary; use the existing job/quality contracts.
    bounds: >
      Terminal time records the backend terminal transition, not browser receipt or upload start.
      Active elapsed time uses the browser clock and is approximate. Legacy terminal rows without
      that timestamp have unknown elapsed duration; never reinterpret the original PT-2 censor.
      Quality is conditional on extracted facts, and PT-3 omission detection is not effective IAM
      authorization or deployment validation. No new product choice, identity or architecture.
