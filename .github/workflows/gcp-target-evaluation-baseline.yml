name: GCP Target Evaluation Baseline

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact trusted main commit SHA used for the live evaluation.
        required: true
        type: string
      evaluation_scope:
        description: Run M3, one M4-2 reproduction, one Case A baseline/holdout, the A3 probe, or the adaptive retrieval probe.
        required: true
        type: choice
        default: m3-full-baseline
        options:
          - m3-full-baseline
          - m4-arch-vpc-three-tier
          - m4-arch-private-aoss
          - case-a-full-baseline
          - case-a-holdout
          - case-a-a3-retrieval-probe
          - adaptive-retrieval-probe
          - a7-7-v4-production-evaluation
      backend_image:
        description: Exact immutable backend image used as the A7-7 v4 evaluation toolchain.
        required: false
        type: string
      backend_source_sha:
        description: Source SHA embedded in the immutable backend image for A7-7 v4 evaluation.
        required: false
        type: string
      confirmation:
        description: Use the scope-specific explicit confirmation token.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-target-terraform-state
  cancel-in-progress: false

jobs:
  baseline:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 90
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
      TARGET_PROJECT: terraformers-platform
      TARGET_CLUSTER: terraformers-target
      TARGET_ZONE: asia-northeast3-a
      TARGET_NAMESPACE: terraformers-target
      TARGET_KSA: terraformers-backend
      BASELINE_POD: terraformers-evaluation-baseline
      OPENSEARCH_SERVICE: terraformers-opensearch
      A7_7_V4_CORPUS_CHECKSUM: da410626b80d8624e93c8a8da81206a2ed8da1b06086a75279d5646b068bd66a

    steps:
      - uses: actions/checkout@v5

      - name: Validate trusted baseline request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVALUATION_SCOPE: ${{ inputs.evaluation_scope }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          APPLY_SERVICE_ACCOUNT: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'expected_sha must be a full 40-character commit SHA.' >&2
            exit 1
          }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || {
            echo 'Approved SHA does not match the checked-out main commit.' >&2
            exit 1
          }
          case "$EVALUATION_SCOPE" in
            m3-full-baseline)
              [[ "$CONFIRMATION" == RUN_M3_4_BASELINE ]] || {
                echo 'M3-4 baseline requires confirmation RUN_M3_4_BASELINE.' >&2
                exit 1
              }
              ;;
            m4-arch-vpc-three-tier)
              [[ "$CONFIRMATION" == RUN_M4_2_REPRODUCTION ]] || {
                echo 'M4-2 reproduction requires confirmation RUN_M4_2_REPRODUCTION.' >&2
                exit 1
              }
              echo 'M4_CASE_ID=arch-vpc-three-tier' >> "$GITHUB_ENV"
              ;;
            m4-arch-private-aoss)
              [[ "$CONFIRMATION" == RUN_M4_2_REPRODUCTION ]] || {
                echo 'M4-2 reproduction requires confirmation RUN_M4_2_REPRODUCTION.' >&2
                exit 1
              }
              echo 'M4_CASE_ID=arch-private-aoss' >> "$GITHUB_ENV"
              ;;
            case-a-full-baseline)
              [[ "$CONFIRMATION" == RUN_CASE_A_BASELINE ]] || {
                echo 'Case A baseline requires confirmation RUN_CASE_A_BASELINE.' >&2
                exit 1
              }
              ;;
            case-a-holdout)
              [[ "$CONFIRMATION" == RUN_CASE_A_HOLDOUT ]] || {
                echo 'Case A holdout requires confirmation RUN_CASE_A_HOLDOUT.' >&2
                exit 1
              }
              ;;
            case-a-a3-retrieval-probe)
              [[ "$CONFIRMATION" == RUN_CASE_A_A3_PROBE ]] || {
                echo 'Case A A3 probe requires confirmation RUN_CASE_A_A3_PROBE.' >&2
                exit 1
              }
              ;;
            adaptive-retrieval-probe)
              [[ "$CONFIRMATION" == RUN_ADAPTIVE_RETRIEVAL_PROBE ]] || {
                echo 'Adaptive retrieval probe requires confirmation RUN_ADAPTIVE_RETRIEVAL_PROBE.' >&2
                exit 1
              }
              ;;
            a7-7-v4-production-evaluation)
              [[ "$CONFIRMATION" == RUN_A7_7_V4_PRODUCTION_EVALUATION ]] || {
                echo 'A7-7 v4 evaluation requires confirmation RUN_A7_7_V4_PRODUCTION_EVALUATION.' >&2
                exit 1
              }
              [[ "$BACKEND_IMAGE" =~ ^asia-northeast3-docker\.pkg\.dev/terraformers-platform/terraformers-backend/terraformers-backend@sha256:[0-9a-f]{64}$ ]] || {
                echo 'A7-7 v4 evaluation requires the exact immutable backend image digest.' >&2
                exit 1
              }
              [[ "$BACKEND_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo 'A7-7 v4 evaluation requires a full backend source SHA.' >&2
                exit 1
              }
              echo 'A7_7_V4_EVALUATION=true' >> "$GITHUB_ENV"
              echo "A7_7_BACKEND_IMAGE=$BACKEND_IMAGE" >> "$GITHUB_ENV"
              echo "A7_7_BACKEND_SOURCE_SHA=$BACKEND_SOURCE_SHA" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported evaluation scope: $EVALUATION_SCOPE" >&2
              exit 1
              ;;
          esac
          [[ "$APPLY_SERVICE_ACCOUNT" == terraformers-apply@terraformers-platform.iam.gserviceaccount.com ]] || {
            echo 'Unexpected Kubernetes deployment identity.' >&2
            exit 1
          }
          [[ -n "$WIF_PROVIDER" ]] || {
            echo 'Missing GCP_WIF_PROVIDER environment variable.' >&2
            exit 1
          }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build bounded evaluation bundle
        run: |
          set -euo pipefail
          mvn -q -f backend/pom.xml -DskipTests package dependency:copy-dependencies             -DincludeScope=runtime

          bundle_root="${RUNNER_TEMP}/live-baseline-bundle"
          mkdir -p "$bundle_root/classes" "$bundle_root/dependency" "$bundle_root/evaluation"

          cp -a backend/target/classes/. "$bundle_root/classes/"
          cp -a backend/target/dependency/. "$bundle_root/dependency/"
          cp -a evaluation/terraformers-eval-v1 "$bundle_root/evaluation/"
          cp -a evaluation/terraformers-eval-holdout-v1 "$bundle_root/evaluation/"
          cp evaluation/case-a-a3-fixed-facts-v1.json "$bundle_root/evaluation/"
          cp -a evaluation/adaptive-retrieval-v1 "$bundle_root/evaluation/"

          (
            cd "$bundle_root"
            zip -qr "${RUNNER_TEMP}/live-baseline.zip" classes dependency evaluation
          )

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: kubectl

      - name: Verify GKE and OpenSearch substrate
        run: |
          set -euo pipefail
          cluster_status="$(
            gcloud container clusters describe "$TARGET_CLUSTER"               --zone="$TARGET_ZONE"               --project="$TARGET_PROJECT"               --format='value(status)'
          )"
          node_pool_status="$(
            gcloud container node-pools describe "${TARGET_CLUSTER}-primary"               --cluster="$TARGET_CLUSTER"               --zone="$TARGET_ZONE"               --project="$TARGET_PROJECT"               --format='value(status)'
          )"
          [[ "$cluster_status" == RUNNING ]]
          [[ "$node_pool_status" == RUNNING ]]

      - name: Configure GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: terraformers-platform
          cluster_name: terraformers-target
          location: asia-northeast3-a

      - name: Verify bounded Kubernetes permissions
        run: |
          set -euo pipefail
          for permission in             'create serviceaccounts'             'create pods'             'create pods/exec'             'get pods'             'delete pods'; do
            verb="${permission%% *}"
            resource="${permission#* }"
            kubectl auth can-i "$verb" "$resource" -n "$TARGET_NAMESPACE" | grep -Fxq yes || {
              echo "Apply identity lacks Kubernetes permission: $verb $resource" >&2
              exit 1
            }
          done

      - name: Verify backend Workload Identity IAM bindings
        run: |
          set -euo pipefail
          project_number="$(
            gcloud projects describe "$TARGET_PROJECT" --format='value(projectNumber)'
          )"
          principal="principal://iam.googleapis.com/projects/${project_number}/locations/global/workloadIdentityPools/${TARGET_PROJECT}.svc.id.goog/subject/ns/${TARGET_NAMESPACE}/sa/${TARGET_KSA}"
          policy="${RUNNER_TEMP}/project-iam.json"
          gcloud projects get-iam-policy "$TARGET_PROJECT" --format=json > "$policy"

          for role in roles/aiplatform.user roles/serviceusage.serviceUsageConsumer; do
            jq -e --arg role "$role" --arg principal "$principal" '
              any(.bindings[]?;
                .role == $role and any(.members[]?; . == $principal)
              )
            ' "$policy" >/dev/null || {
              echo "Missing backend Workload Identity binding: $role" >&2
              exit 1
            }
          done

      - name: Apply only the backend Kubernetes ServiceAccount
        run: |
          set -euo pipefail
          kubectl -n "$TARGET_NAMESPACE" apply             -f infra/kubernetes/base/backend-serviceaccount.yaml

      - name: Verify OpenSearch readiness
        run: |
          set -euo pipefail
          kubectl -n "$TARGET_NAMESPACE" rollout status             statefulset/terraformers-opensearch             --timeout=2m
          service_type="$(
            kubectl -n "$TARGET_NAMESPACE" get service "$OPENSEARCH_SERVICE"               -o jsonpath='{.spec.type}'
          )"
          [[ "$service_type" == ClusterIP ]]

      - name: Start ephemeral Java baseline pod
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: |
          set -euo pipefail
          kubectl -n "$TARGET_NAMESPACE" delete pod "$BASELINE_POD"             --ignore-not-found=true --wait=true

          evaluation_image='eclipse-temurin:17-jdk-jammy'
          if [[ "${A7_7_V4_EVALUATION:-false}" == true ]]; then
            evaluation_image="$BACKEND_IMAGE"
          fi

          cat > "${RUNNER_TEMP}/baseline-pod.yaml" <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: terraformers-evaluation-baseline
            labels:
              app.kubernetes.io/name: terraformers-evaluation-baseline
              app.kubernetes.io/part-of: terraformers-modernization
          spec:
            serviceAccountName: terraformers-backend
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: baseline
                image: ${evaluation_image}
                imagePullPolicy: IfNotPresent
                command: ["/bin/sh", "-c", "sleep 5400"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                resources:
                  requests:
                    cpu: 1m
                    memory: 256Mi
                  limits:
                    cpu: "1"
                    memory: 1Gi
          EOF

          kubectl -n "$TARGET_NAMESPACE" apply -f "${RUNNER_TEMP}/baseline-pod.yaml"

          if ! kubectl -n "$TARGET_NAMESPACE" wait             --for=condition=Ready "pod/${BASELINE_POD}"             --timeout=5m; then
            echo 'Evaluation baseline pod did not become Ready; capturing bounded diagnostics.' >&2
            kubectl -n "$TARGET_NAMESPACE" get pod "$BASELINE_POD" -o wide || true
            kubectl -n "$TARGET_NAMESPACE" describe pod "$BASELINE_POD" || true
            kubectl -n "$TARGET_NAMESPACE" get events               --field-selector "involvedObject.name=${BASELINE_POD}"               --sort-by='.lastTimestamp' || true
            kubectl -n "$TARGET_NAMESPACE" logs "$BASELINE_POD"               --all-containers=true --tail=200 || true
            exit 1
          fi

      - name: Transfer evaluation bundle
        run: |
          set -euo pipefail
          kubectl -n "$TARGET_NAMESPACE" exec -i "$BASELINE_POD" --             /bin/sh -c 'cat > /tmp/live-baseline.zip'             < "${RUNNER_TEMP}/live-baseline.zip"

          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- /bin/sh -c '
            rm -rf /tmp/workspace &&
            mkdir -p /tmp/workspace &&
            cd /tmp/workspace &&
            if command -v unzip >/dev/null 2>&1; then
              unzip -q /tmp/live-baseline.zip
            else
              jar xf /tmp/live-baseline.zip
            fi
          '

      - name: Verify A7-7 v4 production-equivalent substrate
        if: inputs.evaluation_scope == 'a7-7-v4-production-evaluation'
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_SOURCE_SHA: ${{ inputs.backend_source_sha }}
        run: |
          set -euo pipefail
          [[ "$(kubectl -n "$TARGET_NAMESPACE" get pod "$BASELINE_POD" -o jsonpath='{.spec.containers[0].image}')" == "$BACKEND_IMAGE" ]]
          [[ "$(kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- printenv BUILD_SOURCE_REVISION)" == "$BACKEND_SOURCE_SHA" ]]

          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- terraform version | head -n 1 | grep -Fx 'Terraform v1.8.5'
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- test -s /opt/terraform-provider-schema/aws-5.100.0.json
          plugin_count="$(kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- /bin/sh -c "find /opt/terraform-plugins/registry.terraform.io/hashicorp/aws/5.100.0/linux_amd64 -maxdepth 1 -type f -name 'terraform-provider-aws*' | wc -l")"
          [[ "$plugin_count" == 1 ]]

          count_json="$(kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- curl -fsS "http://${OPENSEARCH_SERVICE}:9200/terraformers-reference-v4/_count")"
          jq -e '.count == 5395' <<< "$count_json" >/dev/null

          mapping_json="$(kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- curl -fsS "http://${OPENSEARCH_SERVICE}:9200/terraformers-reference-v4/_mapping")"
          jq -e --arg checksum "$A7_7_V4_CORPUS_CHECKSUM" '
            .["terraformers-reference-v4"].mappings.properties.embedding.dimension == 1536
            and .["terraformers-reference-v4"].mappings._meta.terraformers_corpus.corpus_version == "terraformers-reference-v4"
            and .["terraformers-reference-v4"].mappings._meta.terraformers_corpus.checksum == $checksum
          ' <<< "$mapping_json" >/dev/null

      - name: Run unchanged six-case M3 baseline
        if: inputs.evaluation_scope == 'm3-full-baseline'
        run: |
          set -euo pipefail
          run_id="m3-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" --             env               EVALUATION_DATASET=/tmp/workspace/evaluation/terraformers-eval-v1/dataset.json               EVALUATION_OUTPUT=/tmp/m3-live-baseline.json               EVALUATION_RUN_ID="$run_id"               EVALUATION_MODE=full               GOOGLE_CLOUD_PROJECT=terraformers-platform               GOOGLE_CLOUD_LOCATION=global               ANALYSIS_PROVIDER=vertex               EMBEDDING_PROVIDER=vertex               RETRIEVAL_MODE=REQUIRED               VERTEX_GENERATION_MODEL_ID=gemini-3.8-flash               VERTEX_EMBEDDING_MODEL_ID=gemini-embedding-001               OPENSEARCH_ENDPOINT="http://${OPENSEARCH_SERVICE}:9200"               INDEX_NAME=terraformers-reference-v3               VECTOR_FIELD_NAME=embedding               CONTENT_FIELD_NAME=content               CORPUS_VERSION=terraformers-reference-v3               PROVIDER_VERSION=5.100.0               EXPECTED_VECTOR_DIMENSION=1024               OPENSEARCH_TOP_K=8               VERTEX_MAX_OUTPUT_TOKENS=8192               java -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*'                 com.terraformers.modernization.evaluation.LiveEvaluationLauncher

          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" --             cat /tmp/m3-live-baseline.json             > "${RUNNER_TEMP}/m3-live-baseline.json"

      - name: Verify baseline identity and completeness
        if: inputs.evaluation_scope == 'm3-full-baseline'
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/m3-live-baseline.json"

          jq -e '
            . as $root
            | (
            .schemaVersion == "m3-evaluation-v1"
            and .datasetVersion == "terraformers-eval-v1"
            and (.traces | length == 6)
            and ([.traces[].caseId] == [
              "arch-vpc-three-tier",
              "arch-cloudfront-private-alb",
              "arch-private-aoss",
              "arch-s3-metadata-split",
              "ambiguous-cropped-service-sketch",
              "non-architecture-deployment-dashboard"
            ])
            and .configuration.corpusVersion == "terraformers-reference-v3"
            and .configuration.providerVersion == "5.100.0"
            and .configuration.analysisProvider == "vertex"
            and .configuration.embeddingProvider == "vertex"
            and .configuration.retrievalMode == "REQUIRED"
            and .configuration.topK == 8
            and .configuration.generationModelId == "gemini-3.8-flash"
            and .configuration.embeddingModelId == "gemini-embedding-001"
            and (.configuration.configurationFingerprint | startswith("sha256:"))
            and all(.traces[]; .configuration == $root.configuration)
            )
          ' "$result" >/dev/null

          {
            echo '## M3-4 unchanged six-case live baseline'
            echo
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Run ID: `%s`\n' "$(jq -r '.runId' "$result")"
            printf -- '- Configuration fingerprint: `%s`\n' "$(jq -r '.configuration.configurationFingerprint' "$result")"
            echo '- Dataset: `terraformers-eval-v1`'
            echo '- Cases: `6`'
            echo
            echo '| Case | Facts | Retrieval | Generation | Validation | First divergence |'
            echo '|---|---|---|---|---|---|'
            jq -r '
              .traces[] |
              "| \(.caseId) | \(.factExtraction.status) | \(.retrieval.status) | \(.generation.status) | \(.validation.status) | " +
              (if .firstDivergence == null then "none" else "\(.firstDivergence.stage):\(.firstDivergence.category)" end) +
              " |"
            ' "$result"
            echo
            echo '- Quality failures are preserved as baseline evidence and do not change the fixed dataset or runtime configuration.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable baseline
        if: always() && inputs.evaluation_scope == 'm3-full-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: m3-live-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-live-baseline.json
          if-no-files-found: warn
          retention-days: 90

      - name: Run one bounded M4-2 affected-case reproduction
        if: startsWith(inputs.evaluation_scope, 'm4-')
        run: |
          set -euo pipefail
          [[ "$M4_CASE_ID" == arch-vpc-three-tier || "$M4_CASE_ID" == arch-private-aoss ]]
          run_id="m4-r2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${M4_CASE_ID}"

          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" --             env               EVALUATION_DATASET=/tmp/workspace/evaluation/terraformers-eval-v1/dataset.json               EVALUATION_OUTPUT=/tmp/m4-live-reproduction.json               EVALUATION_RUN_ID="$run_id"               EVALUATION_MODE=single               EVALUATION_CASE_ID="$M4_CASE_ID"               GOOGLE_CLOUD_PROJECT=terraformers-platform               GOOGLE_CLOUD_LOCATION=global               ANALYSIS_PROVIDER=vertex               EMBEDDING_PROVIDER=vertex               RETRIEVAL_MODE=REQUIRED               VERTEX_GENERATION_MODEL_ID=gemini-3.8-flash               VERTEX_EMBEDDING_MODEL_ID=gemini-embedding-001               OPENSEARCH_ENDPOINT="http://${OPENSEARCH_SERVICE}:9200"               INDEX_NAME=terraformers-reference-v3               VECTOR_FIELD_NAME=embedding               CONTENT_FIELD_NAME=content               CORPUS_VERSION=terraformers-reference-v3               PROVIDER_VERSION=5.100.0               EXPECTED_VECTOR_DIMENSION=1024               OPENSEARCH_TOP_K=8               VERTEX_MAX_OUTPUT_TOKENS=8192               java -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*'                 com.terraformers.modernization.evaluation.LiveEvaluationLauncher

          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" --             cat /tmp/m4-live-reproduction.json             > "${RUNNER_TEMP}/m4-live-reproduction.json"

      - name: Verify M4-2 identity and preserve diagnostic outcome
        if: startsWith(inputs.evaluation_scope, 'm4-')
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/m4-live-reproduction.json"

          jq -e --arg case_id "$M4_CASE_ID" '
            . as $root
            | .traces[0] as $trace
            | (
              .schemaVersion == "m3-evaluation-v1"
              and .datasetVersion == "terraformers-eval-v1"
              and (.traces | length == 1)
              and $trace.caseId == $case_id
              and .configuration.corpusVersion == "terraformers-reference-v3"
              and .configuration.providerVersion == "5.100.0"
              and .configuration.analysisProvider == "vertex"
              and .configuration.embeddingProvider == "vertex"
              and .configuration.retrievalMode == "REQUIRED"
              and .configuration.topK == 8
              and .configuration.generationModelId == "gemini-3.8-flash"
              and .configuration.embeddingModelId == "gemini-embedding-001"
              and .configuration.configurationFingerprint
                == "sha256:d10c56e4f124ee67d1cbc69457249ad0cf1243bf682305f32e65817e32b6ae66"
              and $trace.configuration == $root.configuration
              and (
                if $trace.factExtraction.status == "FAIL" then
                  $trace.firstDivergence.stage == "FACT_EXTRACTION"
                  and ($trace.factExtraction.failures | length) > 0
                  and ($trace.factExtraction.failures[0].detail | startswith("reason="))
                else
                  $trace.factExtraction.status == "PASS"
                end
              )
            )
          ' "$result" >/dev/null

          {
            echo '## M4-2 bounded live reproduction'
            echo
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Run ID: `%s`\n' "$(jq -r '.runId' "$result")"
            printf -- '- Case: `%s`\n' "$M4_CASE_ID"
            printf -- '- Configuration fingerprint: `%s`\n' "$(jq -r '.configuration.configurationFingerprint' "$result")"
            printf -- '- Fact extraction: `%s`\n' "$(jq -r '.traces[0].factExtraction.status' "$result")"
            printf -- '- First divergence: `%s`\n' "$(jq -r 'if .traces[0].firstDivergence == null then "none" else (.traces[0].firstDivergence.stage + ":" + .traces[0].firstDivergence.category) end' "$result")"
            printf -- '- Fact failure detail: `%s`\n' "$(jq -r 'if (.traces[0].factExtraction.failures | length) == 0 then "none" else .traces[0].factExtraction.failures[0].detail end' "$result")"
            echo '- A PASS is recorded as not reproduced for this bounded attempt; no retry or tuning is introduced.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload M4-2 machine-readable reproduction
        if: always() && startsWith(inputs.evaluation_scope, 'm4-')
        uses: actions/upload-artifact@v4
        with:
          name: m4-r2-reproduction-${{ github.run_id }}
          path: ${{ runner.temp }}/m4-live-reproduction.json
          if-no-files-found: warn
          retention-days: 90

      - name: Run one Case A canonical baseline and deterministic scoring
        if: inputs.evaluation_scope == 'case-a-full-baseline'
        run: |
          set -euo pipefail
          run_id="case-a-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- env \
            EVALUATION_DATASET=/tmp/workspace/evaluation/terraformers-eval-v1/dataset.json \
            EVALUATION_OUTPUT=/tmp/case-a-baseline.json EVALUATION_RUN_ID="$run_id" EVALUATION_MODE=full \
            GOOGLE_CLOUD_PROJECT=terraformers-platform GOOGLE_CLOUD_LOCATION=global \
            ANALYSIS_PROVIDER=vertex EMBEDDING_PROVIDER=vertex RETRIEVAL_MODE=REQUIRED \
            VERTEX_GENERATION_MODEL_ID=gemini-3.8-flash VERTEX_EMBEDDING_MODEL_ID=gemini-embedding-001 \
            OPENSEARCH_ENDPOINT="http://${OPENSEARCH_SERVICE}:9200" INDEX_NAME=terraformers-reference-v3 \
            VECTOR_FIELD_NAME=embedding CONTENT_FIELD_NAME=content CORPUS_VERSION=terraformers-reference-v3 \
            PROVIDER_VERSION=5.100.0 EXPECTED_VECTOR_DIMENSION=1024 OPENSEARCH_TOP_K=8 \
            VERTEX_MAX_OUTPUT_TOKENS=8192 java -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
            com.terraformers.modernization.evaluation.LiveEvaluationLauncher
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- java \
            -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
            com.terraformers.modernization.evaluation.CaseAMeasurementLauncher \
            --mode=report --result=/tmp/case-a-baseline.json \
            --dataset=/tmp/workspace/evaluation/terraformers-eval-v1/dataset.json \
            --output=/tmp/case-a-grounding-report.json
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- cat /tmp/case-a-baseline.json > "${RUNNER_TEMP}/case-a-baseline.json"
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- cat /tmp/case-a-grounding-report.json > "${RUNNER_TEMP}/case-a-grounding-report.json"

      - name: Verify Case A identity and report
        if: inputs.evaluation_scope == 'case-a-full-baseline'
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/case-a-baseline.json"
          report="${RUNNER_TEMP}/case-a-grounding-report.json"
          jq -e '
            .datasetVersion == "terraformers-eval-v1" and (.traces | length == 6)
            and .configuration.corpusVersion == "terraformers-reference-v3"
            and .configuration.providerVersion == "5.100.0"
            and .configuration.analysisProvider == "vertex"
            and .configuration.embeddingProvider == "vertex"
            and .configuration.retrievalMode == "REQUIRED"
            and .configuration.topK == 8
            and .configuration.generationModelId == "gemini-3.8-flash"
            and .configuration.embeddingModelId == "gemini-embedding-001"
            and .configuration.factExtractionThinkingLevel == "LOW"
            and .configuration.factExtractionMaxOutputTokens == 800
            and .configuration.generationMaxOutputTokens == 8192
          ' "$raw" >/dev/null
          jq -e --arg run_id "$(jq -r .runId "$raw")" '
            .reportSchemaVersion == "case-a-retrieval-grounding-report-v1"
            and .sourceRunId == $run_id and .datasetVersion == "terraformers-eval-v1"
            and .caseCount == 6 and (.cases | length == 6)
          ' "$report" >/dev/null

      - name: Upload Case A raw artifact
        if: always() && inputs.evaluation_scope == 'case-a-full-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: case-a-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/case-a-baseline.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Case A grounding report artifact
        if: always() && inputs.evaluation_scope == 'case-a-full-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: case-a-grounding-report-${{ github.run_id }}
          path: ${{ runner.temp }}/case-a-grounding-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Run one Case A frozen holdout and deterministic scoring
        if: inputs.evaluation_scope == 'case-a-holdout'
        run: |
          set -euo pipefail
          run_id="case-a-holdout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- env \
            EVALUATION_DATASET=/tmp/workspace/evaluation/terraformers-eval-holdout-v1/dataset.json \
            EVALUATION_OUTPUT=/tmp/case-a-holdout.json EVALUATION_RUN_ID="$run_id" EVALUATION_MODE=full \
            GOOGLE_CLOUD_PROJECT=terraformers-platform GOOGLE_CLOUD_LOCATION=global \
            ANALYSIS_PROVIDER=vertex EMBEDDING_PROVIDER=vertex RETRIEVAL_MODE=REQUIRED \
            VERTEX_GENERATION_MODEL_ID=gemini-3.8-flash VERTEX_EMBEDDING_MODEL_ID=gemini-embedding-001 \
            OPENSEARCH_ENDPOINT="http://${OPENSEARCH_SERVICE}:9200" INDEX_NAME=terraformers-reference-v3 \
            VECTOR_FIELD_NAME=embedding CONTENT_FIELD_NAME=content CORPUS_VERSION=terraformers-reference-v3 \
            PROVIDER_VERSION=5.100.0 EXPECTED_VECTOR_DIMENSION=1024 OPENSEARCH_TOP_K=8 \
            VERTEX_MAX_OUTPUT_TOKENS=8192 java -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
            com.terraformers.modernization.evaluation.LiveEvaluationLauncher
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- java \
            -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
            com.terraformers.modernization.evaluation.CaseAMeasurementLauncher \
            --mode=report --result=/tmp/case-a-holdout.json \
            --dataset=/tmp/workspace/evaluation/terraformers-eval-holdout-v1/dataset.json \
            --output=/tmp/case-a-holdout-grounding-report.json
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- cat /tmp/case-a-holdout.json > "${RUNNER_TEMP}/case-a-holdout.json"
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- cat /tmp/case-a-holdout-grounding-report.json > "${RUNNER_TEMP}/case-a-holdout-grounding-report.json"

      - name: Verify Case A holdout identity and report
        if: inputs.evaluation_scope == 'case-a-holdout'
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/case-a-holdout.json"
          report="${RUNNER_TEMP}/case-a-holdout-grounding-report.json"
          jq -e '
            . as $root
            | .datasetVersion == "terraformers-eval-holdout-v1"
            and (.traces | length == 4)
            and ([.traces[].caseId] == [
              "holdout-eks-irsa",
              "holdout-workload-rds-sg",
              "holdout-ambiguous-obscured-flow",
              "holdout-non-architecture-status-board"
            ])
            and .configuration.corpusVersion == "terraformers-reference-v3"
            and .configuration.providerVersion == "5.100.0"
            and .configuration.analysisProvider == "vertex"
            and .configuration.embeddingProvider == "vertex"
            and .configuration.retrievalMode == "REQUIRED"
            and .configuration.topK == 8
            and .configuration.generationModelId == "gemini-3.8-flash"
            and .configuration.embeddingModelId == "gemini-embedding-001"
            and .configuration.factExtractionThinkingLevel == "LOW"
            and .configuration.factExtractionMaxOutputTokens == 800
            and .configuration.generationMaxOutputTokens == 8192
            and (.configuration.configurationFingerprint | startswith("sha256:"))
            and all(.traces[]; .configuration == $root.configuration)
          ' "$raw" >/dev/null
          jq -e --arg run_id "$(jq -r .runId "$raw")" '
            .reportSchemaVersion == "case-a-retrieval-grounding-report-v1"
            and .sourceRunId == $run_id and .datasetVersion == "terraformers-eval-holdout-v1"
            and .caseCount == 4 and (.cases | length == 4)
          ' "$report" >/dev/null

      - name: Upload Case A holdout raw artifact
        if: always() && inputs.evaluation_scope == 'case-a-holdout'
        uses: actions/upload-artifact@v4
        with:
          name: case-a-holdout-${{ github.run_id }}
          path: ${{ runner.temp }}/case-a-holdout.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Case A holdout grounding report artifact
        if: always() && inputs.evaluation_scope == 'case-a-holdout'
        uses: actions/upload-artifact@v4
        with:
          name: case-a-holdout-grounding-report-${{ github.run_id }}
          path: ${{ runner.temp }}/case-a-holdout-grounding-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Run A7-7 broad-v4 canonical N=3 and frozen holdout N=1
        if: inputs.evaluation_scope == 'a7-7-v4-production-evaluation'
        run: |
          set -euo pipefail

          run_evaluation() {
            dataset_path="$1"
            dataset_id="$2"
            run_id="$3"
            raw_path="$4"
            report_path="$5"
            calibration_path="$6"

            kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- env \
              EVALUATION_DATASET="$dataset_path" \
              EVALUATION_OUTPUT="$raw_path" \
              EVALUATION_RUN_ID="$run_id" \
              EVALUATION_MODE=full \
              GOOGLE_CLOUD_PROJECT=terraformers-platform \
              GOOGLE_CLOUD_LOCATION=global \
              ANALYSIS_PROVIDER=vertex \
              EMBEDDING_PROVIDER=vertex \
              RETRIEVAL_MODE=REQUIRED \
              VERTEX_GENERATION_MODEL_ID=gemini-3.8-flash \
              VERTEX_EMBEDDING_MODEL_ID=gemini-embedding-2 \
              OPENSEARCH_ENDPOINT="http://${OPENSEARCH_SERVICE}:9200" \
              INDEX_NAME=terraformers-reference-v4 \
              VECTOR_FIELD_NAME=embedding \
              CONTENT_FIELD_NAME=content \
              CORPUS_VERSION=terraformers-reference-v4 \
              PROVIDER_VERSION=5.100.0 \
              EXPECTED_VECTOR_DIMENSION=1536 \
              OPENSEARCH_TOP_K=8 \
              VERTEX_MAX_OUTPUT_TOKENS=8192 \
              java -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
                com.terraformers.modernization.evaluation.LiveEvaluationLauncher

            kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- java \
              -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
              com.terraformers.modernization.evaluation.CaseAMeasurementLauncher \
              --mode=report \
              --result="$raw_path" \
              --dataset="$dataset_path" \
              --output="$report_path"

            kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- java \
              -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
              com.terraformers.modernization.evaluation.CaseAMeasurementLauncher \
              --mode=calibrate \
              --result="$raw_path" \
              --dataset="$dataset_path" \
              --output="$calibration_path"
          }

          canonical_dataset=/tmp/workspace/evaluation/terraformers-eval-v1/dataset.json
          holdout_dataset=/tmp/workspace/evaluation/terraformers-eval-holdout-v1/dataset.json

          for attempt in 1 2 3; do
            run_evaluation \
              "$canonical_dataset" \
              terraformers-eval-v1 \
              "a7-7-v4-canonical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              "/tmp/a7-7-v4-canonical-${attempt}.json" \
              "/tmp/a7-7-v4-canonical-report-${attempt}.json" \
              "/tmp/a7-7-v4-canonical-calibration-${attempt}.json"
          done

          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- java \
            -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
            com.terraformers.modernization.evaluation.CaseAMeasurementLauncher \
            --mode=aggregate \
            --reports=/tmp/a7-7-v4-canonical-report-1.json,/tmp/a7-7-v4-canonical-report-2.json,/tmp/a7-7-v4-canonical-report-3.json \
            --output=/tmp/a7-7-v4-canonical-aggregate.json

          run_evaluation \
            "$holdout_dataset" \
            terraformers-eval-holdout-v1 \
            "a7-7-v4-holdout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            /tmp/a7-7-v4-holdout.json \
            /tmp/a7-7-v4-holdout-report.json \
            /tmp/a7-7-v4-holdout-calibration.json

          output_dir="${RUNNER_TEMP}/a7-7-v4-evaluation"
          mkdir -p "$output_dir"

          for attempt in 1 2 3; do
            for kind in "" "-report" "-calibration"; do
              src="/tmp/a7-7-v4-canonical${kind}-${attempt}.json"
              dst="$output_dir/a7-7-v4-canonical${kind}-${attempt}.json"
              kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- cat "$src" > "$dst"
            done
          done

          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- cat /tmp/a7-7-v4-canonical-aggregate.json \
            > "$output_dir/a7-7-v4-canonical-aggregate.json"
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- cat /tmp/a7-7-v4-holdout.json \
            > "$output_dir/a7-7-v4-holdout.json"
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- cat /tmp/a7-7-v4-holdout-report.json \
            > "$output_dir/a7-7-v4-holdout-report.json"
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- cat /tmp/a7-7-v4-holdout-calibration.json \
            > "$output_dir/a7-7-v4-holdout-calibration.json"

      - name: Verify A7-7 v4 evaluation identity and evidence shape
        if: inputs.evaluation_scope == 'a7-7-v4-production-evaluation'
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/a7-7-v4-evaluation"

          for attempt in 1 2 3; do
            raw="$output_dir/a7-7-v4-canonical-${attempt}.json"
            report="$output_dir/a7-7-v4-canonical-report-${attempt}.json"
            calibration="$output_dir/a7-7-v4-canonical-calibration-${attempt}.json"

            jq -e '
              . as $root
              | .datasetVersion == "terraformers-eval-v1"
              and (.traces | length == 6)
              and .configuration.corpusVersion == "terraformers-reference-v4"
              and .configuration.providerVersion == "5.100.0"
              and .configuration.analysisProvider == "vertex"
              and .configuration.embeddingProvider == "vertex"
              and .configuration.retrievalMode == "REQUIRED"
              and .configuration.topK == 8
              and .configuration.generationModelId == "gemini-3.8-flash"
              and .configuration.embeddingModelId == "gemini-embedding-2"
              and .configuration.factExtractionThinkingLevel == "LOW"
              and .configuration.factExtractionMaxOutputTokens == 800
              and .configuration.generationMaxOutputTokens == 8192
              and all(.traces[]; .configuration == $root.configuration)
              and all(.traces[];
                (.validation.evidence == null)
                or .validation.evidence.applicationValidator.name == "ProductionEquivalentTerraformValidator")
            ' "$raw" >/dev/null

            jq -e --arg run_id "$(jq -r .runId "$raw")" '
              .reportSchemaVersion == "case-a-retrieval-grounding-report-v1"
              and .sourceRunId == $run_id
              and .datasetVersion == "terraformers-eval-v1"
              and .caseCount == 6
              and (.cases | length == 6)
            ' "$report" >/dev/null

            jq -e --arg run_id "$(jq -r .runId "$raw")" '
              .reportSchemaVersion == "case-a-quality-calibration-v1"
              and .sourceRunId == $run_id
              and .datasetVersion == "terraformers-eval-v1"
              and .counts.caseCount == 6
              and (.cases | length == 6)
            ' "$calibration" >/dev/null
          done

          aggregate="$output_dir/a7-7-v4-canonical-aggregate.json"
          jq -e '
            .reportSchemaVersion == "case-a-retrieval-grounding-multi-run-v1"
            and .runCount == 3
            and .datasetVersion == "terraformers-eval-v1"
            and .configuration.corpusVersion == "terraformers-reference-v4"
            and .configuration.embeddingModelId == "gemini-embedding-2"
            and (.sourceRunIds | length == 3)
          ' "$aggregate" >/dev/null

          holdout="$output_dir/a7-7-v4-holdout.json"
          holdout_report="$output_dir/a7-7-v4-holdout-report.json"
          holdout_calibration="$output_dir/a7-7-v4-holdout-calibration.json"
          jq -e '
            . as $root
            | .datasetVersion == "terraformers-eval-holdout-v1"
            and (.traces | length == 4)
            and ([.traces[].caseId] == [
              "holdout-eks-irsa",
              "holdout-workload-rds-sg",
              "holdout-ambiguous-obscured-flow",
              "holdout-non-architecture-status-board"
            ])
            and .configuration.corpusVersion == "terraformers-reference-v4"
            and .configuration.embeddingModelId == "gemini-embedding-2"
            and .configuration.topK == 8
            and all(.traces[]; .configuration == $root.configuration)
            and all(.traces[];
              (.validation.evidence == null)
              or .validation.evidence.applicationValidator.name == "ProductionEquivalentTerraformValidator")
          ' "$holdout" >/dev/null

          jq -e --arg run_id "$(jq -r .runId "$holdout")" '
            .reportSchemaVersion == "case-a-retrieval-grounding-report-v1"
            and .sourceRunId == $run_id
            and .datasetVersion == "terraformers-eval-holdout-v1"
            and .caseCount == 4
          ' "$holdout_report" >/dev/null
          jq -e --arg run_id "$(jq -r .runId "$holdout")" '
            .reportSchemaVersion == "case-a-quality-calibration-v1"
            and .sourceRunId == $run_id
            and .datasetVersion == "terraformers-eval-holdout-v1"
            and .counts.caseCount == 4
          ' "$holdout_calibration" >/dev/null

      - name: Summarize A7-7 v4 stage-by-stage evidence
        if: inputs.evaluation_scope == 'a7-7-v4-production-evaluation'
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/a7-7-v4-evaluation"

          {
            echo '## A7-7 broad-v4 production-equivalent evaluation'
            echo
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Backend toolchain image: `%s`\n' '${{ inputs.backend_image }}'
            printf -- '- Backend toolchain source: `%s`\n' '${{ inputs.backend_source_sha }}'
            printf -- '- Corpus checksum: `%s`\n' "$A7_7_V4_CORPUS_CHECKSUM"
            echo '- Canonical observations: `6 cases x 3 fixed runs = 18`'
            echo '- Frozen holdout observations: `4 cases x 1 run = 4`'
            echo '- Quality failures are retained as measurements; this workflow does not rerun until green.'
            echo

            for attempt in 1 2 3; do
              calibration="$output_dir/a7-7-v4-canonical-calibration-${attempt}.json"
              echo "### Canonical run ${attempt}"
              echo
              echo '| Case | Technical | Label | Components | Relationships | Fact resources | Retrieval resources | Project decisions | Handoff | Generated required | Forbidden generated | CLI validation | First divergence |'
              echo '|---|---|---|---|---|---|---|---|---|---|---|---|---|'
              jq -r '
                .cases[] |
                "| \(.caseId) | \(.technicalSuccess) | \(.labeledQualitySuccess) | " +
                "\(.componentCoverage.requiredMatched)/\(.componentCoverage.requiredTotal); forbidden=\(.componentCoverage.forbiddenMatched) | " +
                "\(.relationshipCoverage.requiredMatched)/\(.relationshipCoverage.requiredTotal); forbidden=\(.relationshipCoverage.forbiddenMatched) | " +
                "\(.requiredFactResourceMatched)/\(.requiredFactResourceTotal) | " +
                (if .grounding.resourceTypeCoverage == null then "N/A" else "\(.grounding.resourceTypeCoverage.matched)/\(.grounding.resourceTypeCoverage.total)" end) + " | " +
                (if .grounding.projectDecisionCoverage == null then "N/A" else "\(.grounding.projectDecisionCoverage.matched)/\(.grounding.projectDecisionCoverage.total)" end) + " | " +
                "\(.grounding.retrievalToGenerationHandoffComplete) | " +
                "\(.grounding.requiredGeneratedResourceMatched)/\(.grounding.requiredGeneratedResourceTotal) | " +
                "\(.grounding.forbiddenGeneratedResourceCount) | " +
                (if .grounding.terraformValidationPassed == null then "N/A" else "\(.grounding.terraformValidationPassed)" end) + " | " +
                (if .grounding.firstDivergence == null then "none" else "\(.grounding.firstDivergence.stage):\(.grounding.firstDivergence.category)" end) +
                " |"
              ' "$calibration"
              echo
            done

            aggregate="$output_dir/a7-7-v4-canonical-aggregate.json"
            echo '### Canonical stability aggregate'
            echo
            jq -r '
              "- Grounding-gap frequency: \(.groundingGap.failureCount)/\(.groundingGap.sampleCount) (\(.groundingGap.frequency))",
              "- Grounding-gap-with-valid-output frequency: \(.groundingGapWithValidOutput.failureCount)/\(.groundingGapWithValidOutput.sampleCount) (\(.groundingGapWithValidOutput.frequency))",
              "- Fact extraction latency ms min/median/max: \(.factExtractionLatencyMs.min)/\(.factExtractionLatencyMs.median)/\(.factExtractionLatencyMs.max)",
              "- Retrieval latency ms min/median/max: \(.retrievalLatencyMs.min)/\(.retrievalLatencyMs.median)/\(.retrievalLatencyMs.max)",
              "- Generation latency ms min/median/max: \(.generationLatencyMs.min)/\(.generationLatencyMs.median)/\(.generationLatencyMs.max)"
            ' "$aggregate"
            echo

            echo '### Frozen holdout'
            echo
            echo '| Case | Technical | Label | Components | Relationships | Fact resources | Retrieval resources | Project decisions | Handoff | Generated required | Forbidden generated | CLI validation | First divergence |'
            echo '|---|---|---|---|---|---|---|---|---|---|---|---|---|'
            jq -r '
              .cases[] |
              "| \(.caseId) | \(.technicalSuccess) | \(.labeledQualitySuccess) | " +
              "\(.componentCoverage.requiredMatched)/\(.componentCoverage.requiredTotal); forbidden=\(.componentCoverage.forbiddenMatched) | " +
              "\(.relationshipCoverage.requiredMatched)/\(.relationshipCoverage.requiredTotal); forbidden=\(.relationshipCoverage.forbiddenMatched) | " +
              "\(.requiredFactResourceMatched)/\(.requiredFactResourceTotal) | " +
              (if .grounding.resourceTypeCoverage == null then "N/A" else "\(.grounding.resourceTypeCoverage.matched)/\(.grounding.resourceTypeCoverage.total)" end) + " | " +
              (if .grounding.projectDecisionCoverage == null then "N/A" else "\(.grounding.projectDecisionCoverage.matched)/\(.grounding.projectDecisionCoverage.total)" end) + " | " +
              "\(.grounding.retrievalToGenerationHandoffComplete) | " +
              "\(.grounding.requiredGeneratedResourceMatched)/\(.grounding.requiredGeneratedResourceTotal) | " +
              "\(.grounding.forbiddenGeneratedResourceCount) | " +
              (if .grounding.terraformValidationPassed == null then "N/A" else "\(.grounding.terraformValidationPassed)" end) + " | " +
              (if .grounding.firstDivergence == null then "none" else "\(.grounding.firstDivergence.stage):\(.grounding.firstDivergence.category)" end) +
              " |"
            ' "$output_dir/a7-7-v4-holdout-calibration.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload A7-7 v4 production-equivalent evaluation evidence
        if: always() && inputs.evaluation_scope == 'a7-7-v4-production-evaluation'
        uses: actions/upload-artifact@v4
        with:
          name: a7-7-v4-production-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/a7-7-v4-evaluation
          if-no-files-found: error
          retention-days: 90

      - name: Run one Case A A3 fixed-facts retrieval comparison
        if: inputs.evaluation_scope == 'case-a-a3-retrieval-probe'
        run: |
          set -euo pipefail
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- env \
            A3_FIXED_FACTS=/tmp/workspace/evaluation/case-a-a3-fixed-facts-v1.json \
            EVALUATION_DATASET=/tmp/workspace/evaluation/terraformers-eval-v1/dataset.json \
            A3_OUTPUT=/tmp/case-a-a3-retrieval-probe.json SOURCE_COMMIT="$GITHUB_SHA" \
            GOOGLE_CLOUD_PROJECT=terraformers-platform GOOGLE_CLOUD_LOCATION=global \
            VERTEX_EMBEDDING_MODEL_ID=gemini-embedding-001 \
            OPENSEARCH_ENDPOINT="http://${OPENSEARCH_SERVICE}:9200" INDEX_NAME=terraformers-reference-v3 \
            VECTOR_FIELD_NAME=embedding CONTENT_FIELD_NAME=content CORPUS_VERSION=terraformers-reference-v3 \
            PROVIDER_VERSION=5.100.0 EXPECTED_VECTOR_DIMENSION=1024 \
            java -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
            com.terraformers.modernization.evaluation.CaseAAlternativeProbeLauncher
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- \
            cat /tmp/case-a-a3-retrieval-probe.json > "${RUNNER_TEMP}/case-a-a3-retrieval-probe.json"

      - name: Verify Case A A3 probe identity and comparison shape
        if: inputs.evaluation_scope == 'case-a-a3-retrieval-probe'
        run: |
          set -euo pipefail
          jq -e --arg sha "$GITHUB_SHA" '
            .schemaVersion == "case-a-a3-retrieval-probe-v1"
            and .sourceCommit == $sha and .datasetVersion == "terraformers-eval-v1"
            and .corpusVersion == "terraformers-reference-v3" and .providerVersion == "5.100.0"
            and .embeddingModel == "gemini-embedding-001" and .embeddingDimension == 1024
            and (.snapshots | length == 6)
            and all(.snapshots[]; (.strategies | length == 6))
            and (.aggregates | keys | length == 6)
          ' "${RUNNER_TEMP}/case-a-a3-retrieval-probe.json" >/dev/null

      - name: Upload Case A A3 machine-readable probe artifact
        if: always() && inputs.evaluation_scope == 'case-a-a3-retrieval-probe'
        uses: actions/upload-artifact@v4
        with:
          name: case-a-a3-retrieval-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/case-a-a3-retrieval-probe.json
          if-no-files-found: warn
          retention-days: 90

      - name: Run adaptive retrieval live measurement probe
        if: inputs.evaluation_scope == 'adaptive-retrieval-probe'
        run: |
          set -euo pipefail
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- env \
            ADAPTIVE_RETRIEVAL_FIXTURE=/tmp/workspace/evaluation/adaptive-retrieval-v1/fixed-facts.json \
            ADAPTIVE_RETRIEVAL_OUTPUT=/tmp/adaptive-retrieval-probe.json \
            SOURCE_COMMIT="$GITHUB_SHA" \
            GOOGLE_CLOUD_PROJECT=terraformers-platform GOOGLE_CLOUD_LOCATION=global \
            VERTEX_EMBEDDING_MODEL_ID=gemini-embedding-001 \
            OPENSEARCH_ENDPOINT="http://${OPENSEARCH_SERVICE}:9200" INDEX_NAME=terraformers-reference-v3 \
            VECTOR_FIELD_NAME=embedding CONTENT_FIELD_NAME=content CORPUS_VERSION=terraformers-reference-v3 \
            PROVIDER_VERSION=5.100.0 EXPECTED_VECTOR_DIMENSION=1024 \
            java -cp '/tmp/workspace/classes:/tmp/workspace/dependency/*' \
            com.terraformers.modernization.evaluation.adaptive.AdaptiveRetrievalProbeLauncher
          kubectl -n "$TARGET_NAMESPACE" exec "$BASELINE_POD" -- \
            cat /tmp/adaptive-retrieval-probe.json > "${RUNNER_TEMP}/adaptive-retrieval-probe.json"

      - name: Verify adaptive retrieval probe identity and bounded coverage
        if: inputs.evaluation_scope == 'adaptive-retrieval-probe'
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/adaptive-retrieval-probe.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .schemaVersion == "adaptive-retrieval-live-probe-v1"
            and .sourceCommit == $sha
            and .scenarioId == "large-vpc-eks-rds-s3"
            and .corpusVersion == "terraformers-reference-v3"
            and .providerVersion == "5.100.0"
            and .embeddingModel == "gemini-embedding-001"
            and .embeddingDimension == 1024
            and .baseTopK == 8
            and .controlMaxEvidence == 8
            and .adaptiveMaxEvidence == 16
            and .minimumCorpusDocumentCover == 10
            and .queryResourceTypes == [
              "aws_vpc",
              "aws_subnet",
              "aws_internet_gateway",
              "aws_nat_gateway",
              "aws_route_table",
              "aws_security_group",
              "aws_lb",
              "aws_lb_listener",
              "aws_lb_target_group",
              "aws_eks_cluster",
              "aws_db_instance",
              "aws_s3_bucket"
            ]
            and .embeddingDelegateCalls == 1
            and .control.coverageTotal == 12
            and .control.coverageMatched < 12
            and .control.evidenceCount <= 8
            and .adaptive.coverageTotal == 12
            and .adaptive.coverageMatched == 12
            and .adaptive.evidenceCount > 8
            and .adaptive.evidenceCount <= 16
            and (.adaptive.missingResourceTypes | length) == 0
            and (.adaptive.selectedDocumentIds | length) == .adaptive.evidenceCount
            and (.adaptive.selectedDocumentIds | unique | length) == .adaptive.evidenceCount
          ' "$result" >/dev/null

      - name: Upload adaptive retrieval probe artifact
        if: always() && inputs.evaluation_scope == 'adaptive-retrieval-probe'
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-retrieval-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/adaptive-retrieval-probe.json
          if-no-files-found: warn
          retention-days: 90

      - name: Delete ephemeral evaluation baseline pod
        if: always()
        run: |
          kubectl -n "$TARGET_NAMESPACE" delete pod "$BASELINE_POD"             --ignore-not-found=true --wait=false || true
