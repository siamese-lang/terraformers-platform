name: GCP Target Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-target-terraform-state
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: gcp-target-plan
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_project_id: terraformers-platform
      TF_VAR_subnet_cidr: 10.40.0.0/20
      TF_VAR_node_count: '1'
      STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      PLAN_SERVICE_ACCOUNT: ${{ vars.GCP_TF_PLAN_SERVICE_ACCOUNT }}
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/envs/gcp-target-runtime
    steps:
      - uses: actions/checkout@v5

      - name: Check identity and state configuration
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]] || exit 1
          [[ -n "$STATE_BUCKET" && -n "$WIF_PROVIDER" && -n "$PLAN_SERVICE_ACCOUNT" ]] || {
            echo 'Configure GCP_TF_STATE_BUCKET, GCP_WIF_PROVIDER, and GCP_TF_PLAN_SERVICE_ACCOUNT in the gcp-target-plan environment.' >&2
            exit 1
          }
          [[ "$WIF_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]] || exit 1
          [[ "$PLAN_SERVICE_ACCOUNT" == *@terraformers-platform.iam.gserviceaccount.com ]] || exit 1
          [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{2,62}$ ]] || exit 1
          [[ "$STATE_BUCKET" != *..* ]] || exit 1

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PLAN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Check state bucket protection
        run: |
          set -euo pipefail
          gcloud storage buckets describe "gs://${STATE_BUCKET}" \
            --format='value(versioning_enabled)' > "${RUNNER_TEMP}/bucket-versioning"
          [[ "$(cat "${RUNNER_TEMP}/bucket-versioning")" == True ]] || {
            echo 'State bucket object versioning must be enabled.' >&2
            exit 1
          }
          gcloud storage buckets describe "gs://${STATE_BUCKET}" \
            --format='value(uniform_bucket_level_access)' > "${RUNNER_TEMP}/bucket-ubla"
          [[ "$(cat "${RUNNER_TEMP}/bucket-ubla")" == True ]] || {
            echo 'State bucket uniform bucket-level access must be enabled.' >&2
            exit 1
          }

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Plan against the canonical remote state
        run: |
          set -euo pipefail
          terraform init -reconfigure -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config='prefix=gcp-target-runtime' \
            > "${RUNNER_TEMP}/terraform-init.log" 2>&1 || {
              echo 'Terraform init failed; use the same backend in an authorized Cloud Shell to diagnose the error.' >&2
              exit 1
            }
          terraform plan -input=false -lock-timeout=5m \
            -out="${RUNNER_TEMP}/gcp-target.tfplan" \
            > "${RUNNER_TEMP}/terraform-plan.log" 2>&1 || {
              echo 'Terraform plan failed; use the same backend in an authorized Cloud Shell to diagnose the error.' >&2
              exit 1
            }
          terraform show -json "${RUNNER_TEMP}/gcp-target.tfplan" \
            > "${RUNNER_TEMP}/gcp-target-plan.json"

      - name: Publish resource action counts
        env:
          PLAN_JSON: ${{ runner.temp }}/gcp-target-plan.json
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os

          with open(os.environ['PLAN_JSON'], encoding='utf-8') as stream:
              plan = json.load(stream)
          changes = [r for r in plan.get('resource_changes', [])
                     if r.get('change', {}).get('actions') != ['no-op']]
          actions = collections.Counter(
              '+'.join(r.get('change', {}).get('actions', [])) for r in changes
          )
          types = collections.Counter(r.get('type', 'unknown') for r in changes)
          lines = [
              '## GCP target Terraform plan',
              '',
              f'- Commit: `{os.environ["GITHUB_SHA"]}`',
              f'- Managed/data changes: `{len(changes)}`',
              f'- Action counts: `{json.dumps(dict(sorted(actions.items())))}`',
              '- GKE and node pool changes may incur cost after a separately reviewed apply.',
              '- The full plan, state and provider outputs remain on the runner.',
              '',
              '| Resource type | Changes |',
              '| --- | ---: |',
          ]
          lines += [f'| `{kind}` | {count} |' for kind, count in sorted(types.items())]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          if any('delete' in r.get('change', {}).get('actions', []) for r in changes):
              raise SystemExit('Destructive or replacement actions require investigation; no apply is provided here.')
          PY
