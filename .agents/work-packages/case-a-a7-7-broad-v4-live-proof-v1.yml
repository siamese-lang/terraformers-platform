    - .github/workflows/gcp-target-corpus-ingestion.yml
    - .github/workflows/gcp-target-runtime-dependencies.yml
    - .github/workflows/gcp-target-terraform-plan.yml
    - .github/workflows/terraform-static-verification.yml
    - infra/kubernetes/overlays/gcp-target/backend-configmap-patch.yaml

  prohibited_paths:
