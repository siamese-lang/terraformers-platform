name: GCP Opus Generation Evaluation

on:
  workflow_dispatch:
    inputs:
      expected_sha: {description: Exact trusted main SHA, required: true, type: string}
      confirmation: {description: Type RUN_OPUS_GENERATION_EVALUATION, required: true, type: string}

permissions: {contents: read, id-token: write}
concurrency: {group: gcp-opus-generation-evaluation, cancel-in-progress: false}

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gcp-target-apply
    timeout-minutes: 30
    env:
      PROJECT: terraformers-platform
      CLUSTER: terraformers-target
      ZONE: asia-northeast3-a
      NAMESPACE: terraformers-target
      POD: terraformers-opus-generation-evaluation
    steps:
      - uses: actions/checkout@v5
      - name: Validate bounded request
        env: {EXPECTED_SHA: '${{ inputs.expected_sha }}', CONFIRMATION: '${{ inputs.confirmation }}'}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMATION" == RUN_OPUS_GENERATION_EVALUATION ]]
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17', cache: maven}
      - name: Build evaluation bundle
        run: |
          mvn -q -f backend/pom.xml -DskipTests package dependency:copy-dependencies -DincludeScope=runtime
          mkdir -p bundle/{classes,dependency,evaluation,corpus}
          cp -a backend/target/classes/. bundle/classes/; cp -a backend/target/dependency/. bundle/dependency/
          cp -a evaluation/terraformers-eval-v1 evaluation/opus-generation-v1 bundle/evaluation/
          cp -a corpus/terraformers-reference/v3 bundle/corpus/
      - uses: google-github-actions/auth@v3
        with: {project_id: terraformers-platform, workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}', service_account: '${{ vars.GCP_TF_APPLY_SERVICE_ACCOUNT }}'}
      - uses: google-github-actions/get-gke-credentials@v3
        with: {project_id: terraformers-platform, cluster_name: terraformers-target, location: asia-northeast3-a}
      - name: Verify bounded Kubernetes access and KSA
        run: |
          set -euo pipefail
          for p in 'create pods' 'create pods/exec' 'get pods' 'delete pods'; do kubectl auth can-i ${p} -n "$NAMESPACE" | grep -Fxq yes; done
          kubectl get serviceaccount terraformers-backend -n "$NAMESPACE"
      - name: Run isolated evaluation in backend identity
        run: |
          set -euo pipefail
          trap 'kubectl delete pod "$POD" -n "$NAMESPACE" --ignore-not-found' EXIT
          kubectl run "$POD" -n "$NAMESPACE" --image=eclipse-temurin:17-jre --restart=Never --overrides='{"spec":{"serviceAccountName":"terraformers-backend","containers":[{"name":"'$POD'","image":"eclipse-temurin:17-jre","command":["sleep","1800"]}]}}'
          kubectl wait -n "$NAMESPACE" --for=condition=Ready "pod/$POD" --timeout=180s
          kubectl cp bundle/. "$NAMESPACE/$POD:/work"
          kubectl exec -n "$NAMESPACE" "$POD" -- env OPUS_FIXTURE_MANIFEST=/work/evaluation/opus-generation-v1/manifest.json EVALUATION_DATASET=/work/evaluation/terraformers-eval-v1/dataset.json CORPUS_DOCUMENTS=/work/corpus/v3/documents.jsonl EVALUATION_OUTPUT=/work/output.json EVALUATION_RUN_ID="$GITHUB_RUN_ID" SOURCE_COMMIT="$GITHUB_SHA" GOOGLE_CLOUD_PROJECT="$PROJECT" GOOGLE_CLOUD_LOCATION=global OPUS_MODEL_ID=claude-opus-5-5 OPUS_MAX_OUTPUT_TOKENS=8192 java -cp '/work/classes:/work/dependency/*' com.terraformers.modernization.evaluation.opus.OpusGenerationEvaluationLauncher
          kubectl cp "$NAMESPACE/$POD:/work/output.json" opus-generation-evaluation-${GITHUB_RUN_ID}.json
      - name: Validate artifact identity
        run: jq -e '.schemaVersion=="opus-generation-evaluation-v1" and .modelId=="claude-opus-5-5" and .location=="global" and .caseCount==6' opus-generation-evaluation-*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'opus-generation-evaluation-${{ github.run_id }}', path: 'opus-generation-evaluation-*.json', if-no-files-found: warn}
