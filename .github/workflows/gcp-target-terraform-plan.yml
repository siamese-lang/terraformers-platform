name: GCP Target Terraform Plan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Authenticate only, run the read-only Case C quota/cost preflight, or run the Terraform plan.
        required: true
        type: choice
        options:
          - identity-check
          - case-c-preflight
          - plan
  push:
    branches:
      - main
    paths:
      - '.agents/work-packages/case-c-gcp-quota-cost-preflight-v1.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-target-terraform-state
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: gcp-target-plan
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_project_id: terraformers-platform
      TF_VAR_subnet_cidr: 10.40.0.0/20
      TF_VAR_node_count: '1'
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/envs/gcp-target-runtime
    steps:
      - uses: actions/checkout@v5

      - name: Check identity and state configuration
        env:
          RUN_MODE: ${{ github.event_name == 'push' && 'case-c-preflight' || inputs.mode }}
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PLAN_SERVICE_ACCOUNT: ${{ vars.GCP_TF_PLAN_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == siamese-lang/terraformers-platform ]] || exit 1
          [[ "$RUN_MODE" == identity-check || "$RUN_MODE" == case-c-preflight || "$RUN_MODE" == plan ]] || exit 1
          [[ -n "$WIF_PROVIDER" && -n "$PLAN_SERVICE_ACCOUNT" ]] || {
            echo 'Configure GCP_WIF_PROVIDER and GCP_TF_PLAN_SERVICE_ACCOUNT in the gcp-target-plan environment.' >&2
            exit 1
          }
          [[ "$WIF_PROVIDER" == projects/*/locations/global/workloadIdentityPools/*/providers/* ]] || exit 1
          [[ "$PLAN_SERVICE_ACCOUNT" == *@terraformers-platform.iam.gserviceaccount.com ]] || exit 1
          if [[ "$RUN_MODE" == plan ]]; then
            [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{2,62}$ ]] || exit 1
            [[ "$STATE_BUCKET" != *..* ]] || exit 1
          fi

      - uses: google-github-actions/auth@v3
        with:
          project_id: terraformers-platform
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Check OIDC exchange without resource access
        run: |
          set -euo pipefail
          gcloud auth print-access-token > /dev/null
          echo 'GitHub OIDC exchange and service account impersonation succeeded.' >> "$GITHUB_STEP_SUMMARY"

      - name: Assert plan identity has no target mutation permissions
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          response="$(
            curl -fsS -X POST               -H "Authorization: Bearer ${access_token}"               -H 'Content-Type: application/json'               -d '{"permissions":["compute.networks.create","compute.subnetworks.create","container.clusters.create","container.clusters.update","iam.serviceAccounts.create","iam.serviceAccounts.actAs","resourcemanager.projects.setIamPolicy","serviceusage.services.enable"]}'               "https://cloudresourcemanager.googleapis.com/v1/projects/terraformers-platform:testIamPermissions"
          )"
          granted="$(jq -r '.permissions // [] | join(",")' <<< "$response")"
          [[ -z "$granted" ]] || {
            echo "Plan identity unexpectedly has target mutation permissions: $granted" >&2
            exit 1
          }
          echo 'Plan identity mutation-permission check: PASS.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run Case C quota and cost preflight
        if: github.event_name == 'push' || inputs.mode == 'case-c-preflight'
        run: |
          set -euo pipefail

          PROJECT_ID=terraformers-platform
          REGION=asia-northeast3
          ZONE=asia-northeast3-a

          gcloud compute project-info describe \
            --project="$PROJECT_ID" \
            --format=json > "${RUNNER_TEMP}/project-quota.json"

          gcloud compute regions describe "$REGION" \
            --project="$PROJECT_ID" \
            --format=json > "${RUNNER_TEMP}/region-quota.json"

          gcloud compute machine-types describe e2-standard-2 \
            --zone="$ZONE" \
            --project="$PROJECT_ID" \
            --format=json > "${RUNNER_TEMP}/e2-standard-2.json"

          gcloud compute machine-types describe e2-medium \
            --zone="$ZONE" \
            --project="$PROJECT_ID" \
            --format=json > "${RUNNER_TEMP}/e2-medium.json"

          current_nodes="$(
            gcloud container clusters list \
              --project="$PROJECT_ID" \
              --filter='name=terraformers-target AND location=asia-northeast3-a' \
              --format='value(currentNodeCount)'
          )"
          [[ "$current_nodes" =~ ^[01]$ ]] || {
            echo "Expected terraformers-target currentNodeCount to be 0 or 1, got: ${current_nodes:-missing}" >&2
            exit 1
          }

          billing_status=unavailable
          billing_enabled=unknown
          if gcloud billing projects describe "$PROJECT_ID" --format=json \
              > "${RUNNER_TEMP}/billing.json" 2> "${RUNNER_TEMP}/billing.err"; then
            billing_status=verified
            billing_enabled="$(jq -r '.billingEnabled // false' "${RUNNER_TEMP}/billing.json")"
            [[ "$billing_enabled" == true ]] || {
              echo 'Project billing is explicitly disabled.' >&2
              exit 1
            }
          fi

          CURRENT_NODES="$current_nodes" \
          BILLING_STATUS="$billing_status" \
          BILLING_ENABLED="$billing_enabled" \
          PROJECT_QUOTA_JSON="${RUNNER_TEMP}/project-quota.json" \
          REGION_QUOTA_JSON="${RUNNER_TEMP}/region-quota.json" \
          GKE_MACHINE_JSON="${RUNNER_TEMP}/e2-standard-2.json" \
          DB_MACHINE_JSON="${RUNNER_TEMP}/e2-medium.json" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(name):
              return json.loads(Path(os.environ[name]).read_text(encoding='utf-8'))

          def quota_map(payload):
              result = {}
              for item in payload.get('quotas', []):
                  metric = item.get('metric')
                  if not metric:
                      continue
                  limit = float(item.get('limit', 0) or 0)
                  usage = float(item.get('usage', 0) or 0)
                  result[metric] = {'limit': limit, 'usage': usage, 'available': limit - usage}
              return result

          def require_quota(table, metric, required):
              if metric not in table:
                  raise SystemExit(f'Required quota metric missing: {metric}')
              row = table[metric]
              if row['available'] < required:
                  raise SystemExit(
                      f"Insufficient {metric}: available={row['available']:g}, required={required:g}"
                  )
              return row

          current_nodes = int(os.environ['CURRENT_NODES'])
          additional_gke_nodes = 1 - current_nodes
          additional_e2_vcpus = additional_gke_nodes * 2 + 2
          additional_instances = additional_gke_nodes + 1
          additional_standard_gib = additional_gke_nodes * 30
          additional_balanced_gib = 30
          additional_addresses = additional_gke_nodes

          project = quota_map(load('PROJECT_QUOTA_JSON'))
          region = quota_map(load('REGION_QUOTA_JSON'))

          checks = []
          checks.append(('global', 'CPUS_ALL_REGIONS', additional_e2_vcpus,
                         require_quota(project, 'CPUS_ALL_REGIONS', additional_e2_vcpus)))
          for metric, required in [
              ('CPUS', additional_e2_vcpus),
              ('E2_CPUS', additional_e2_vcpus),
              ('INSTANCES', additional_instances),
              ('DISKS_TOTAL_GB', additional_standard_gib),
              ('SSD_TOTAL_GB', additional_balanced_gib),
              ('IN_USE_ADDRESSES', additional_addresses),
          ]:
              checks.append(('region', metric, required, require_quota(region, metric, required)))

          gke_machine = load('GKE_MACHINE_JSON')
          db_machine = load('DB_MACHINE_JSON')
          if gke_machine.get('name') != 'e2-standard-2' or int(gke_machine.get('guestCpus', 0)) != 2:
              raise SystemExit('Unexpected e2-standard-2 machine metadata')
          if int(gke_machine.get('memoryMb', 0)) != 8192:
              raise SystemExit('Unexpected e2-standard-2 memory')
          if db_machine.get('name') != 'e2-medium' or int(db_machine.get('guestCpus', 0)) != 2:
              raise SystemExit('Unexpected e2-medium machine metadata')
          if int(db_machine.get('memoryMb', 0)) != 4096:
              raise SystemExit('Unexpected e2-medium memory')

          lines = [
              '## Case C GCP quota / cost preflight',
              '',
              '- Project: terraformers-platform',
              '- Region / zone: asia-northeast3 / asia-northeast3-a',
              f'- Current target GKE nodes: {current_nodes}',
              '- Target active shape: 1 x e2-standard-2 GKE node + 1 x e2-medium MariaDB VM',
              f'- Additional E2 quota required from current state: {additional_e2_vcpus:g} vCPU',
              f'- Additional instances required from current state: {additional_instances:g}',
              f'- Additional pd-standard quota required: {additional_standard_gib:g} GiB',
              f'- Additional pd-balanced/SSD quota budget: {additional_balanced_gib:g} GiB',
              f'- Additional in-use address quota required: {additional_addresses:g}',
              f"- Billing query: {os.environ['BILLING_STATUS']}",
              f"- Billing enabled: {os.environ['BILLING_ENABLED']}",
              '- Remaining Free Trial promotional-credit balance: HUMAN_REQUIRED',
              '- Quota/machine preflight: PASS',
              '',
              '> This workflow is read-only. It does not initialize Terraform, create resources, change IAM, activate GKE nodes, or reserve quota.',
              '',
              '| Scope | Metric | Limit | Usage | Available | Required additional |',
              '| --- | --- | ---: | ---: | ---: | ---: |',
          ]
          for scope, metric, required, row in checks:
              lines.append(
                  f"| {scope} | {metric} | {row['limit']:g} | {row['usage']:g} | "
                  f"{row['available']:g} | {required:g} |"
              )

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY

          echo 'Case C quota/cost preflight completed without mutating GCP resources.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check state bucket protection
        if: inputs.mode == 'plan'
        env:
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          gcloud storage buckets describe "gs://${STATE_BUCKET}" \
            --format='value(versioning_enabled)' > "${RUNNER_TEMP}/bucket-versioning"
          [[ "$(cat "${RUNNER_TEMP}/bucket-versioning")" == True ]] || {
            echo 'State bucket object versioning must be enabled.' >&2
            exit 1
          }
          gcloud storage buckets describe "gs://${STATE_BUCKET}" \
            --format='value(uniform_bucket_level_access)' > "${RUNNER_TEMP}/bucket-ubla"
          [[ "$(cat "${RUNNER_TEMP}/bucket-ubla")" == True ]] || {
            echo 'State bucket uniform bucket-level access must be enabled.' >&2
            exit 1
          }

      - uses: hashicorp/setup-terraform@v3
        if: inputs.mode == 'plan'
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Plan against the canonical remote state
        if: inputs.mode == 'plan'
        env:
          STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail

          show_terraform_errors() {
            python3 - "$1" <<'PY'
          import sys

          path = sys.argv[1]
          with open(path, encoding='utf-8', errors='replace') as stream:
              lines = stream.read().splitlines()

          emitted = 0
          for index, line in enumerate(lines):
              if not line.startswith('Error:'):
                  continue
              for item in lines[index:index + 12]:
                  print(item)
                  emitted += 1
                  if emitted >= 80:
                      raise SystemExit(0)

          if emitted == 0:
              print('Terraform failed without a structured Error: block; reproduce in an authorized Cloud Shell.')
          PY
          }

          terraform init -no-color -reconfigure -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config='prefix=gcp-target-runtime' \
            > "${RUNNER_TEMP}/terraform-init.log" 2>&1 || {
              echo 'Terraform init failed.' >&2
              show_terraform_errors "${RUNNER_TEMP}/terraform-init.log" >&2
              exit 1
            }
          terraform plan -no-color -input=false -lock-timeout=5m \
            -out="${RUNNER_TEMP}/gcp-target.tfplan" \
            > "${RUNNER_TEMP}/terraform-plan.log" 2>&1 || {
              echo 'Terraform plan failed.' >&2
              show_terraform_errors "${RUNNER_TEMP}/terraform-plan.log" >&2
              exit 1
            }
          terraform show -json "${RUNNER_TEMP}/gcp-target.tfplan" \
            > "${RUNNER_TEMP}/gcp-target-plan.json"

      - name: Publish resource action counts
        if: inputs.mode == 'plan'
        env:
          PLAN_JSON: ${{ runner.temp }}/gcp-target-plan.json
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os

          with open(os.environ['PLAN_JSON'], encoding='utf-8') as stream:
              plan = json.load(stream)
          changes = [r for r in plan.get('resource_changes', [])
                     if r.get('change', {}).get('actions') != ['no-op']]
          actions = collections.Counter(
              '+'.join(r.get('change', {}).get('actions', [])) for r in changes
          )
          types = collections.Counter(r.get('type', 'unknown') for r in changes)
          lines = [
              '## GCP target Terraform plan',
              '',
              f'- Commit: `{os.environ["GITHUB_SHA"]}`',
              f'- Managed/data changes: `{len(changes)}`',
              f'- Action counts: `{json.dumps(dict(sorted(actions.items())))}`',
              '- GKE and node pool changes may incur cost after a separately reviewed apply.',
              '- The full plan, state and provider outputs remain on the runner.',
              '',
              '| Resource type | Changes |',
              '| --- | ---: |',
          ]
          lines += [f'| `{kind}` | {count} |' for kind, count in sorted(types.items())]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          if any('delete' in r.get('change', {}).get('actions', []) for r in changes):
              raise SystemExit('Destructive or replacement actions require investigation; no apply is provided here.')
          PY
