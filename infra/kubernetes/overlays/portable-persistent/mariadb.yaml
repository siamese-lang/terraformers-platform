apiVersion: v1
kind: Secret
metadata:
  name: terraformers-mariadb-fixture-credentials
type: Opaque
stringData:
  # Deterministic test-fixture values only. These are not deployment secrets.
  MARIADB_DATABASE: terraformers
  MARIADB_USER: terraformers
  MARIADB_PASSWORD: portable-test-password
  MARIADB_ROOT_PASSWORD: portable-test-root-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraformers-mariadb
  labels:
    app.kubernetes.io/name: terraformers-mariadb
    app.kubernetes.io/part-of: terraformers-modernization
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terraformers-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraformers-mariadb
        app.kubernetes.io/part-of: terraformers-modernization
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          envFrom:
            - secretRef:
                name: terraformers-mariadb-fixture-credentials
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: database
              mountPath: /var/lib/mysql
      volumes:
        # A clean-run fixture verifies schema/repository semantics, not restart durability.
        - name: database
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: terraformers-mariadb
  labels:
    app.kubernetes.io/name: terraformers-mariadb
    app.kubernetes.io/part-of: terraformers-modernization
spec:
  selector:
    app.kubernetes.io/name: terraformers-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
